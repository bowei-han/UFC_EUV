 ufc_situations.2215.title:0 "旅行商人：非洲之角"
 ufc_situations.2215.desc:0 "这是伊本·白图泰能够触及到的最远的地方。离开亚丁湾后，伊本·白图泰沿着索马里海岸遍游非洲之角，最后南下斯瓦希里海岸。其中以摩加迪沙、蒙巴萨与基尔瓦最为著名。之后伊本·白图泰并未继续向南，由于季风已至，他返程于霍尔木兹了。\n\n摩加迪沙是坐落在非洲之角的首屈一指的大城市，当年名震一时的索马里苏丹向伊本·白图泰展示了出口埃及的精美丝织物。这里的人虽然以索马里语为日常交流，但并非对阿拉伯语一窍不通，这给伊本·白图泰带来了相当的便利。\n蒙巴萨是伊本·白图泰曾经造访过的一个小城，但其坐落于东非海岸的交通枢纽，一旁的桑给巴尔岛也展现出了贸易枢纽的潜力。在此的商业活动可以沟通南北，综合来看将是一笔可观的利润。\n基尔瓦则是拥有稳定政权的地区大国，当年伊本·白图泰在此受到了当地苏丹的接见。基尔瓦基斯瓦尼大清真寺更是以珊瑚石修筑，这在全世界绝无仅有。这里的黄金和象牙贸易更是难以想象能够为我们带来多少利润。\n\n唯一的问题在于，此处路途遥远，且船只需要季风航行，商队可能失联也是迫在眉睫的难题。"
 ufc_situations.2215.a:0 "摩加迪沙，“柏柏尔人之地”，柏柏尔人不骗柏柏尔人。"
 ufc_situations.2215.a.tt:0 "摩加迪沙是老牌商业重镇，我们的商队可以得到保障。"
 ufc_situations.2215.b:0 "蒙巴萨和桑给巴尔一定会成为当地的贸易中心。"
 ufc_situations.2215.b.tt:0 "蒙巴萨有很强的发展潜力，但目前还是个小集镇。"
 ufc_situations.2215.c:0 "有黄金和象牙不卖，难道去倒腾那些破布？"
 ufc_situations.2215.c.tt:0 "基尔瓦更远一些，但至少我们同在真主的庇佑之下。"
 ufc_situations.2215.d:0 "那么远……我已经开始想家了。"
