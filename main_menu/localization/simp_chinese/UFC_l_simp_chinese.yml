 ufc_situations.2200.title:0 "旅行商人：朝觐之路"
 ufc_situations.2200.desc:0 "这是每个穆斯林毕生必行之事：前往麦加朝觐。然而，在世俗的马穆鲁克政府这里，朝觐更像是一种生意。马穆鲁克政府给所有从地中海东岸登陆的朝觐者们规划了至少三条前往麦加的道路，沿途均有设置休息站与驿站，同行的商队也往往会向朝圣者出售服饰、食物与宗教器物。相比于基督徒，穆斯林们在这点上还是略显收敛，至少反圣象是名义上的教义。\n\n在马穆鲁克政府为朝觐者们规划的所有路途中，途径叙利亚的大马士革、耶路撒冷和麦地那等圣地的一条最为稳妥，这也是伊本·白图泰当年的最终选择——他曾选择过抄近道，但他没有分开红海的奇迹，反而被一场暴乱赶回了开罗。\n\n由于联合果品商会中大部分是穆斯林，我们的商队对这项旅程情有独钟。他们计划在一个地方集中展开贸易活动，并顺便履行他们的宗教义务。"
 ufc_situations.2200.a:0 "要抢就抢麦加的生意！"
 ufc_situations.2200.b:0 "耶路撒冷是当之无愧的圣城。"
 ufc_situations.2200.c:0 "大马士革的伍麦叶大清真寺附近必然有巨大历史机遇。"
 ufc_situations.2200.d:0 "去什么去，公费旅游吗？！"
 ufc_situations.2200.a.tt:0 "麦加与麦地那附近的商业路线会给我们带来丰厚的回报，但深入沙漠腹地也带来了一丝不确定性。\n注意：本次成功的贸易远征将会降低黑死病的余波的效果。"
 ufc_situations.2200.b.tt:0 "耶路撒冷的风险可控，且收益不菲。\n注意：本次成功的贸易远征将会降低黑死病的余波的效果。"
 ufc_situations.2200.c.tt:0 "叙利亚地区的收益是可以接受的。\n注意：本次成功的贸易远征将会降低黑死病的余波的效果。"
