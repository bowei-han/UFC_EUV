 ufc_situations.2225.title:0 "旅行商人：罗马残躯"
 ufc_situations.2225.desc:0 "在阿斯特拉罕的日子里，伊本·白图泰接到了金帐汗的一个特殊任务——护送巴列奥略王朝嫁到金帐汗国的巴雅伦公主回君士坦丁堡分娩。伊本·白图泰十分积极地承接了这一任务，并踏上了第一个非穆斯林国家的土地。\n\n据伊本·白图泰自称，当他抵达君士坦丁堡时，曾会见了巴列奥略王朝的专制公安德罗尼卡三世。他参观了宏伟瑰丽的圣索菲亚大教堂，并平和地与一名东正教神甫谈论了自己在耶路撒冷的所见所闻。值得一提的是，在君士坦丁堡的集市上，伊本·白图泰曾偶然听好事者说到有关东罗马帝国的军事机密希腊火的最新传闻。此火由一种黑色的液体引燃，遇木即燃，遇水愈旺。遥想七百年前，伍麦叶王朝的穆阿维叶哈里发突袭拜占庭时，穆斯林舰队就被这种希腊火打得溃不成军。后来希腊火一直被东罗马皇室以机密形式保存着，直至最近才有零星的传闻说有人复现了这种神奇的武器，但所知真相者依旧寥寥。\n君士坦丁堡得天独厚的地理位置使其成为整个东欧地区最繁华的贸易城市。然而，由于一些宗教审查的原因，我们很可能需要拜托我们的热那亚朋友们在此进行商业活动，这很可能使商会的利润大打折扣。\n\n完成了任务的伊本·白图泰返回了阿斯特拉罕，经历过一次东正教世界的他不再忌惮更加北方的基辅甚至是罗斯地区，但这里常年积雪，狗拉雪橇是唯一的交通工具，还有短暂的夏夜与漫长的冬季等情况都令白图泰惊奇不已。不希望继续冒险的伊本·白图泰离开了金帐汗国，他准备去印度走一遭了。"
 ufc_situations.2225.a:0 "去和热那亚人商量，我们要介入君士坦丁堡的贸易。"
 ufc_situations.2225.a.tt:0 "君士坦丁堡是稳定的首选。\n注意：本次成功的贸易远征将会降低黑死病的余波的效果。"
 ufc_situations.2225.b:0 "准备间谍活动，希腊火的秘密一旦到手，这一百年我们将可以躺着挣钱。"
 ufc_situations.2225.b.tt:0 "注意：本选项如果成功，将改变之后游戏中的某项任务条件。\n注意：本次成功的贸易远征将会降低黑死病的余波的效果。"
 ufc_situations.2225.c:0 "去基辅罗斯地区一趟如何？这可是我们的商会领袖都不曾踏足的土地。"
 ufc_situations.2225.c.tt:0 "基辅罗斯是我们试探诺夫哥罗德贸易的前哨站。\n注意：本次成功的贸易远征将会降低黑死病的余波的效果。"
 ufc_situations.2225.d:0 "又要听东正教的教士们念经吗……"
 ufc_situations.2226.desc:0 "我们的商队顺利抵达[ShowLocationName('constantinople')]，得到了当地政府的授权，可以在这里进行贸易活动。"
 ufc_situations.2227.title:0 "旅行商人：行动成功"
 ufc_situations.2227.desc:0 "以下信件通过十错位凯撒密码以高卢-意大利-奥克语翻译而来：\n\n我们成功贿赂了拜占庭的大臣，找到并复制了希腊火的配方文件。间谍将于七日内返回，接头口令：穆阿维叶·伍麦叶。"
 ufc_situations.2227.a:0 "木炭，硫磺，硝石与……石油？"
 ufc_situations.2228.desc:0 "我们的商队顺利抵达[ShowLocationName('kyiv')]，得到了当地政府的授权，可以在这里进行贸易活动。"
 ufc_situations.2229.desc:0 "我们的商队被正教徒们赶出了城市！我们只能尽量挽回损失，但也无法覆盖我们的投入。"

 ufc_situations.2230.title:0 "旅行商人：新兴势力"
 ufc_situations.2230.desc:0 "不是我们推脱，在中亚地区据说有一只疯狗，人送绰号跛子帖木儿，手下操持着察合台汗国分裂后的一支所向披靡的游牧军队。但也有传言称他治军严明，司法有条不紊，商队络绎不绝。在这里经商具有极大的风险，可能是一去不返，也可能对接上丝绸之路中上游的滚滚财富。商会必须谨慎考虑此事。\n\n伊本·白图泰在辞行了金帐汗后，一路穿过了里海和咸海，经过了布哈拉与撒马尔罕两座大城市。这里是中亚的心脏，坐落着全世界最宏伟精美的都市，来往的行商络绎不绝。相比之下，察合台汗国的宫廷则是断壁残垣。\n\n在南下穿过崎岖难行的呼罗珊地区时，伊本·白图泰记载了阿富汗的帕尔万城。该地在喀布尔与巴米扬之间，以当地的一座雪山而著名。只要度过了这里，就可以对接到传说中富裕的印度。但这里也是一道天堑，从印度被掳掠来的奴隶十有八九都将冻死在这群山之间。"
 ufc_situations.2230.a:0 "帖木儿一定不是个莽撞的汗，河中的财富值得一探。"
 ufc_situations.2230.a.tt:0 "撒马尔罕的财富十分诱人，但离蒙古人越近，离天堂越远。"
 ufc_situations.2230.b:0 "不要冒险，乌兹别克的布哈拉是一个折中的方案。"
 ufc_situations.2230.b.tt:0 "布哈拉相对来说更靠近西亚一些——虽然说也没有靠近多少。"
 ufc_situations.2230.c:0 "与其面对蒙古人，还不如让我们去阿富汗爬山。"
 ufc_situations.2230.c.tt:0 "喀布尔会让我们更加安全，只要你愿意爬山的话。"
 ufc_situations.2230.d:0 "说好的雅利安人呢？这里全都是蒙古人！"
 ufc_situations.2231.desc:0 "我们的商队顺利抵达[ShowLocationName('samarkand')]，得到了当地政府的授权，可以在这里进行贸易活动。"
 ufc_situations.2232.desc:0 "我们的商队顺利抵达[ShowLocationName('bukhara')]，得到了当地政府的授权，可以在这里进行贸易活动。"
 ufc_situations.2233.desc:0 "我们的商队顺利抵达[ShowLocationName('kabul')]，得到了当地政府的授权，可以在这里进行贸易活动。"
 ufc_situations.2234.desc:0 "我们的商队被蒙古人劫持了，真是糟糕的决策！我们只能尽量挽回损失，但也无法覆盖我们的投入。"

 ufc_situations.2235.title:0 "旅行商人：德里之殇"
 ufc_situations.2235.desc:0 "德里苏丹国的崩溃并非毫无预兆，在伊本·白图泰旅居印度时，就可以预见性地认为德里苏丹国的崩溃是既定的事实。在德里苏丹国时，他被全穆斯林世界最富有之人——“疯苏丹”穆罕默德二世授予了教法法官的职务，但他发现伊斯兰教义几乎无法走出德里城，这在印度湿婆教盛行的民间几乎毫无吸引力。另一方面，“疯苏丹”本人的行径如同月亮一般阴晴不定。客居德里期间，伊本·白图泰时而受宠若惊，时而被怀疑犯有叛国罪，就算以朝觐为借口离开的尝试都被苏丹百般阻挠。解救伊本·白图泰的是一支来自中国的远征队，一些虔诚的佛教徒希望建设喜马拉雅大寺庙群，来到印度请求指导。然而，他在启程前往中国的旅程中遭遇了风暴，流亡到了马尔代夫。在这里，伊本·白图泰担任了九个月的大法官，并娶了当地国王女儿为妻。\n\n印度的财富是伊比利亚半岛上土生土长的商人们无法想象的，伊本·白图泰为他们描述了一个满载着香料、象牙、珍珠与黄金的富足帝国。然而，随着德里苏丹国的衰落，没有人能够保障这趟遥远的旅程的安全。即使这样，财富仍然使这些贪得无厌的商人们蠢蠢欲动。"
 ufc_situations.2235.a:0 "印度！只要到了印度我们就发财了！"
 ufc_situations.2235.a.tt:0 "印度遥远的路程与混乱的局势为我们的行程带来了诸多不确定性。\n注意：本次成功的贸易远征将会降低黑死病的余波的效果。"
 ufc_situations.2235.b:0 "等等，你刚才说什么，马尔代夫？"
 ufc_situations.2235.b.tt:0 "印度有什么好玩的，这马尔代夫听起来就很有趣！\n注意：本次成功的贸易远征将会降低黑死病的余波的效果。"
 ufc_situations.2235.c:0 "德里的政权都垮台了，没有人能够保护我们的商队。"
 ufc_situations.2236.desc:0 "我们的商队顺利抵达[ShowLocationName('delhi')]，得到了当地政府的授权，可以在这里进行贸易活动。"
 ufc_situations.2237.desc:0 "我们的商队顺利抵达[ShowLocationName('male_atoll')]，得到了当地政府的授权，可以在这里进行贸易活动。"
 ufc_situations.2239.desc:0 "印度兵荒马乱，而且路途太过遥远了，这对我们的商队而言代价过于沉重！我们只能尽量挽回损失，但也无法覆盖我们的投入。"

 ufc_situations.2240.title:0 "旅行商人：魂牵梦绕"
 ufc_situations.2240.desc:0 "商会的许多行政专员认为，伊本·白图泰在写到自己到达中国的故事时已经开始放飞自我了，以至于许多文字都十分令人怀疑。\n\n在马尔代夫担任大法官期间，他对伊斯兰教法的忠实触犯了这个刚皈依不久的小王国的民俗——比如他禁止女性在大街上袒胸露乳，这在伊斯兰世界中显然不文明。他的教条主义被他的政敌揪住不放，致使伊本·白图泰不得不辞职。在离开马尔代夫后，他执意前往中国，途经斯里兰卡、吉大港、爪哇与苏门答腊，最终到达了中国的泉州。\n\n东南亚也被伊本·白图泰描绘成了一片风水宝地，这里盛产象牙、槟榔、樟脑、丁香和锡。但相比于中国的富足，这些岛屿只能说一贫如洗。在中国的福建，伊本·白图泰见识到了举世瞩目的丝绸和瓷器，以及一种被称为西瓜的水果。另外，他注意到中国人食用青蛙、猪肉等不清真的食品。据伊本·白图泰回忆，中国许多大城市都有穆斯林社区，他在各个城市都能遇到前来做生意的穆斯林商人，如广州、杭州等。他描述杭州是全世界最大的城市，描述大运河比大海还要宽阔。至于他讲述的那些在大都会见天子的那些事情，大多数前言不搭后语，众人也就姑妄听之。\n\n这是伊本·白图泰去过最远的地方了，此后便是返程，直到黑死病开始蔓延，直到返回摩洛哥得知父母已死，直到参加信仰志愿者来到安达卢西亚的土地，直到来到联合果品商会。他那些栩栩如生的故事仍然历历在目，在那遥远的中国，令无数商人魂牵梦绕之地，那数不尽的丝绸、瓷器与果品，又有几人得见，几人堪回呢？"
 ufc_situations.2240.a:0 "就算只有万分之一的机会，也要去遥远的东方！"
 ufc_situations.2240.a.tt:0 "假如我们能够到达泉州，本次成功的贸易远征将会直接降低#G 50%#!的黑死病的余波的效果。"
 ufc_situations.2240.b:0 "这趟旅程我们完全没有把握，不过商人都是赌徒，不是么？"
 ufc_modifier_the_aftermath_of_black_death_half_descent:0 "降低#G 50%#!#R 黑死病的余波#!的效果。"
 ufc_situations.2241.desc:0 "奇迹发生了！我们的商队顺利抵达[ShowLocationName('minxian')]，得到了当地政府的授权，可以在这里进行贸易活动。"
 ufc_situations.2244.desc:0 "我们派往中国的商队至今杳无音讯，他们或许是死在了风暴之中，或许是遭到了劫掠，或许只是永远地留在了中国而不再回来。我们只能尽量挽回损失，但也无法覆盖我们的投入。"

 ufc_situations.2245.title:0 "旅行商人：别离横路"
 ufc_situations.2245.desc:0 "伊本·白图泰的游记写到这里就戛然而止了，伊本·白图泰有些落寞。他的父母在黑死病中死去，再也没能见到离别了二十多年的儿子回到家乡；他一生中娶过数十次妻子，希腊的女奴、大马士革的妇女、德里的妾室、马尔代夫国王的女儿……但他从来不曾真心爱过一人，也从未被一人真心爱过。他的心只属于那些永无止境的旅程，那一段段前途未卜、无忧无虑的旅程。但这联合果品商会领袖的位置困住了他的脚步，他肩上如今有了责任——那是幸存于黑死病中的数千名商人的挣扎求生。\n\n但是，伊本·白图泰不想让他的旅行就此止步。他的游记还要继续写下去，他要去未曾踏足过的地界，为商人们的未来开辟新的道路。"
 ufc_situations.2245.a:0 "出发，目标马里帝国！"

 ufc_situations.2250.title:0 "旅行商人：再启新程"
 ufc_situations.2250.desc:0 "商会招募到了最优秀的水手们，载着堆积如山的货物、充足的食物与淡水和雄心勃勃的商队成员们，沿着撒哈拉沙漠西岸南下。这是联合果品商会最近的一次贸易远征，与之前不同的是，这次是由商会领袖[GetCountry('UFC').GetGovernment.GetRuler.GetName]亲自带队前往。这位数十年前走遍世界的旅行家再一次踏上了属于他的旅途。只不过这次，他是名副其实的旅行商人。\n\n商团在卓洛夫登陆，沿着河流向东南方行进，沿途并没有值得停留的大型城市或绿洲，这十分令人失望，但至少免除了穿越沙漠的痛苦。此外，这些地方大多蚊虫肆虐、水质极差，人民愚蠢而自负，让商队十分反感。行进不到二十日，商队溯流到了水源的上游，而根据当地人的指引，不远处就是另一条河流尼日尔河，以及坐落于河流岸边的马里帝国首都[ShowLocationName('niani')]。\n\n相比于乡村地区，尼亚尼的繁华程度不同凡响，按伊本·白图泰的说法，这里简直是由黄金打造的城市。我们商队所带来的无花果、橄榄与精纺品得到了抢购，所交易所得都是货真价实的黄金。而其中最抢手的是古兰经，马里帝国刚皈依伊斯兰教不久，这里的教法学者们与伊本·白图泰相谈甚欢。伊本·白图泰还接受了马里帝国的曼萨[GetCountry('MAL').GetGovernment.GetRuler.GetName]的亲自接见。然而，当伊本·白图泰看到马里帝国曼萨的女儿像侍女和女奴一样衣不蔽体时，作为一名伊斯兰教法学家的他再一次心直口快地指出了这对教义的违反。如同在马尔代夫当年一样，商队被不甚愉快地请出了宫廷。"
 ufc_situations.2250.a:0 "这是皈依真主的野蛮文明的必经之路。"

 ufc_situations.2255.title:0 "旅行商人：西非漫游"
 ufc_situations.2255.desc:0 "马里的旅程很快就要结束了，商队卖出了至少八成带来的货物，赚来的黄金更是盆满钵满。据街坊传言，在尼日尔河流的上游还有数个大约有四五万人口的集镇，大多是马里帝国的一些附庸的行政与经济中心。其中杰内、廷巴克图和加奥都拥有远近闻名的清真寺。\n\n我们的商队还有一些边角料尚未出售，这一趟行程或许能够带来一些额外的利润。但距离我们与卓洛夫的港口停留的船只约定的日期只剩一个半月，我们无法走遍每个镇子，或许需要做一些选择了。"
 ufc_situations.2255.a:0 "去杰内的大清真寺做一趟礼拜吧。"
 ufc_situations.2255.b:0 "廷巴克图的黄金和象牙值得我们前往。"
 ufc_situations.2255.c:0 "我看好加奥这座城镇。"
 ufc_situations.2255.d:0 "要是延误了日子你们自己穿越撒哈拉走廊吧，我回去了！"

 ufc_situations.2260.title:0 "旅行商人：最后归途"
 ufc_situations.2260.desc:0 "伊本·白图泰感觉自己老了，他的气息开始紊乱，他的膝盖出现磨损，他的脚步逐渐沉重。他在归途中的尼日尔河上看到了一种被当地人称为“河马”的神奇生物，张开的大嘴吓得他心脏跳个不停。伊本·白图泰内心清楚，这可能是他最后一次旅行了。\n\n船队安安稳稳地从西非返回了伊比利亚半岛，当伊本·白图泰的双脚重新踏上马拉加的港口，他感到了一种前所未有的感觉。这种感觉温馨而平静，使他毕生躁动的心渐渐安稳。这是家的感觉。\n\n他的眼前隐约浮现着一个人的面容，那是他自二十岁离家远游时最后一次见到的母亲的脸。他毕生都在旅行，都在寻找着虚无缥缈的名利、声望与真理，却从未收获过一个人的真爱。回首这一生，自己抛弃一切去追寻永无止境的未来，却不曾想过自己从未珍惜过真正拥有的爱。他的母亲死在了黑死病中，归乡时竟不知家在何处。他本该走投无路从此漂泊，却在阴差阳错间留在了联合果品商会。不过伊本·白图泰不会后悔，他如今肩上挑着数千名商人的生计，他找到了一个属于自己的家。"
 ufc_situations.2260.a:0 "这是最伟大的旅行者最后的旅途。"
 ufc_situations.2260.a.tt:0 "这位全世界最伟大的旅行家终于停下了脚步，他的旅程结束了。他如今找到了自己的家，那个他曾经告别，追寻，失去的地方。如今的伊本·白图泰如同五十年前的那个孩子，与自己孤独的一生和解。"

 ufc_situations.2265.title:0 "旅行商人：停笔"
 ufc_situations.2265.desc:0 "伊本·白图泰的游记写到了最后一章，他波澜壮阔的故事也将就此停笔了。这本书全名《致思索城市奇观与旅行妙趣者之赠礼》，当是一本旷世奇作，讲述了他一生中所走过的117000公里的所见所闻，远超那位威尼斯的商人兼老骗子马可波罗。不过伊本·白图泰也时常自嘲，此时的他又何尝不是一个商人兼老骗子呢？\n\n伊本·白图泰的晚年生活基本都是在马拉加的商会总部中度过的，他偶尔也会到马拉加的清真寺把新上任的法官辩得七窍生烟——别忘了他可是经历过大风大浪的律法学家。马拉加商会的行政工作总是被布置得井井有条，不过也没什么值得操心的事情，自黑死病后商会的事务比以往精简了许多。等到夕阳西下的时候，伊本·白图泰会搬一把新打造的木椅，坐在马拉加城的街头面向港口的方向，等待着来自突尼斯的货船。在那里，藏着让商会重新繁荣起来的秘密。"
 ufc_situations.2265.a:0 "这个孤独了一生的灵魂，却在晚年找到了属于自己的家。"
 ufc_situations.2265.a.tt:0 "这本举世无双的巨作将暂存于马拉加总部。当我们拥有属于自己的领地时，我们将搬走这部巨著。"


 ufc_situations.4000.title:0 "主要事变：鉴往知来" #该事变应该发生于1366年
 ufc_situations.4000.desc:0 "历史是一个圈。我们周而复始，我们鉴往知来。\n\n学者被从阿尔罕布拉宫中驱赶了出来。他失魂落魄地离开格拉纳达城，一路颠沛流离到马拉加的港口。他决定就地购买离开格拉纳达的物资，因为明天就是他被限期离开格拉纳达的最后的日子。\n\n联盟、政变、虚假效忠、欺骗、家族内斗、叛乱、党争、伐异……学者短短三十五年的平生中早已经历了如此的尔虞我诈。他有些疲累，他想起他被迫辞官的父亲，想起被政敌排挤的兄长，想起自己二十五岁时遭到的牢狱之灾，想起自己因得罪了宰相而被格拉纳达驱逐出境……或许政治对他而言还是太过于沉重了。瘟疫仍在肆虐，王朝纷争与宫廷政变不断重演，历史似乎在一个圈中循环。学者的家族世代从政，却每代人的结局都是下野隐居。学者想知道自己的未来究竟在何方，但他首先需要看清自己的过往。\n\n学者抄起手中的那一株橄榄果，这繁荣的马拉加巴扎是联合果品商会最引以为傲的商贸中心。正如每个走投无路之人都会来到联合果品商会碰碰运气，学者的脑子中萌生了一个不成熟的念头。在返回突尼斯前，他或许可以尝试打破这个世代从政的家族的循环，他要试试当一名商业联络员。\n\n商会的面试非常顺利，学者的学识与人脉资源足以支撑起他在突尼斯与当地市场的联络活动。行政专员们请求他在登记簿上做了最后的确认。"
 ufc_situations.4000.a:0 "登记簿上多了一行完美的阿拉伯文书法：阿布·扎伊德·阿卜杜勒·拉赫曼·本·穆罕默德·本·赫勒敦。"
 ufc_situations.4000.a.tt:0 "作为一名学者，伊本·赫勒敦加入了联合果品商会。对于他而言，这是一种“兼职”。该特质将会降低他的个人以及担任商会首领时的全局内阁效率，但也会一定程度上缓解经济支出。该特质的基础倍率为2，你可以在不同的选项中鼓励或禁止他到处跑龙套的行为。"
 STATIC_MODIFIER_NAME_ufc_modifier_double_time_double_pay:0 "又去兼职！"
 STATIC_MODIFIER_DESC_ufc_modifier_double_time_double_pay:0 "虽然这名角色在经济上并非处于困境中，但或许是由于工作狂的性格，此人就是想在本职工作以外去兼任第二份工作。如果不加以控制的话，很可能会变成第三份，第四份……\n或许学术专家就是喜欢看着自己的title list长长的样子。"

 ufc_situations.4005.title:0 "鉴往知来：驱逐出境"
 ufc_situations.4005.desc:0 "旭日初升，当伊本·白图泰得知远近闻名的赫勒敦家族的学者昨日在商站联络员的登记簿上签下了自己的姓名时，他按捺不住想要一见的冲动。但消息灵通的商人们给白图泰带来的消息马上给他浇了一盆冷水：伊本·赫勒敦被阿尔罕布拉宫驱逐出境了，今天就要登上返回突尼斯的商船。离那批登记在册的商船出航还有不到一个时辰，白图泰只得带着亲信们赶往码头。\n\n伊本·白图泰与伊本·赫勒敦的首次会面就是在这船上船下的落差之间。当白图泰拖着六十年间行走了数万里路的疲惫的身躯赶到码头时，赫勒敦的行船已经收锚起航了；随从们为白图泰指出了赫勒敦，白图泰逆着阳光仔细辨认着水手中最为显眼的学者的面容。赫勒敦的乘船渐渐远去，码头上的白图泰和随从们在朝他呐喊着，他听不清，但他第一次从这个素未谋面的老人的声音中听到了这一生中都不曾见到的一丝触动——信任。\n\n联合果品商会留不住伊本·赫勒敦，毕竟违抗来自阿尔罕布拉宫的旨意和手眼通天的宰相哈提卜是不小的政治成本。但既然赫勒敦签下了自己的名字，他如今也是商会的正式成员。白图泰和商会首领们嘱咐去突尼斯的水手们为赫勒敦带去了果品、礼物，以及一份意义非凡的委任状。在突尼斯的商站，赫勒敦至少能坐一把结结实实的交椅。"
 ufc_situations.4005.a:0 "商人与政客最大的区别在于：商人的信任是兜售，而政客的信任是拍卖。"
 ufc_situations.4005.a.tt:0 "虽然伊本·赫勒敦暂时移居突尼斯，但其行政关系仍然隶属于马拉加的商会。他以往的表现深得[GetCountry('UFC').GetGovernment.GetRuler.GetName]的认可，因此在商会中被给予了相当多的信任，我们可以为其分配内阁席位，伊本·赫勒敦的人脉与团队将保证他为商会做出全局性的贡献。"

 ufc_situations.4010.title:0 "鉴往知来：适应"
 ufc_situations.4010.desc:0 "今天是伊本·赫勒敦在突尼斯商站上班的第一天。值得一提的是，“上班”这个词是赫勒敦自己发明的，用学术一点的描述来说，这个叫做“资本雇佣关系”，前人似乎从未意识到这一点。赫勒敦很喜欢研究这种社会学议题，他总是提出一些随处可见而未被定义的社会现象，甚么“消费”“投资”“劳动分工”等等；而身边的人们总是对此嗤之以鼻，这不过又是阿拉伯学者们的长衫罢了。\n\n突尼斯商站的气氛似乎……不是很好。黑死病留下的衰败景象仍然诉说着联合果品商会在这里的影响力的衰落，市场上零散地行走着稀稀落落的人群，阳光漫不经心地撒在荒芜的大地之上，码头工人们懒懒散散地看似忙碌着。赫勒敦有些沮丧，三十年的心血就像这突尼斯商站一样残破不堪。\n\n但赫勒敦需要适应他的新工作。在白图泰留给他的书信里，白图泰嘱托他继续进行学术和调研工作，商会联络人的事务大多是为商人们提供一些商业信息与政治情报，以进行更优的市场规划。如果赫勒敦能够发现一些经济学与社会学的规律并将其总结下来，这将极大有利于商会的学术性发展。赫勒敦非常乐于接手这份快乐的工作，相比于政治家，学者的身份或许更适合于他的天赋。"
 ufc_situations.4010.a:0 "赫勒敦所不知道的是，联合果品学术部的光辉岁月将就此开始。"
 ufc_department_law_academic_department_set:0 "学术部"
 ufc_department_law_academic_department_set_desc:0 "学术部致力于推进联合果品公司的科技创新。\n学术部是联合果品公司最早设立的中央直属部门之一，起源于伊本·赫勒敦时代。在担任联合果品商会的商队领袖前，伊本·赫勒敦在非斯、格拉纳达和突尼斯等城市都发展了少量学徒制的伊斯兰学者弟子，这些人成为了联合果品学术部的奠基人。联合果品学术部继承了伊斯兰学术黄金时代的传统，在公司兴衰的整个过程中几乎都保持了高效的资金投入和产出，对联合果品的发展功不可没。"
 ufc_initialize_academic_department:0 "探索建设"
 ufc_initialize_academic_department_desc:0 "目前关于联合果品公司的学术部设立仍处于讨论阶段，人员配置与研究项目都止步于一些试探性的试验。这对公司的发展及其有限，但至少不需要分配固定的资金来维持其运转。"
 ufc_ban_academic_department:0 "暂停活动"
 ufc_ban_academic_department_desc:0 "或许是因为保守思想的泛滥，又或者是因为董事会的不作为。无论如何，任何关于学术部的草案都被无限期搁置了。"

 ufc_situations.4015.title:0 "鉴往知来：试验场地"
 ufc_situations.4015.desc:0 "“文明及其福祉，以及商业繁荣，都取决于生产力以及人们为自身利益和利润而在各个方向所付出的努力。”——伊本·赫勒敦《历史绪论》\n\n作为一名学者，伊本·赫勒敦最酷爱的事情就是观察并总结规律；在突尼斯商站，一些细微的改革正在潜移默化地进行着。突尼斯商站总共有五十多名隶属于联合果品商会的雇工，包括商人、水手、奴隶、仆人与家眷等，而钻研怎样给五十多人更加高效地安排工作简直乐趣无穷。\n\n伊本·赫勒敦敏锐地察觉到，商会的利润与商人团们为了自身利益而各自努力的贸易活动的效率息息相关，而各自努力的方向与程度往往是不可预知的。从哲学上讲，一定存在一个最佳的分配方案，在每个人为了自身利益奔波时，使商会的利润得到最大化。谁来进货，谁来运输，谁来出售，这些都应该是贯穿数学与工程学的一套新学问——优化。\n\n而显然，这位学者把突尼斯商站当成了试验场地。在总部的人事部行政专员希望去学习交流一番，当然，出差的钱是总部要报销的。"
 ufc_situations.4015.a:0 "这对我们人事部的发展大有裨益。"
 ufc_situations.4015.b:0 "去突尼斯学习先进的管理技术？这不靠谱。"

 ufc_situations.4020.title:0 "鉴往知来：劳动分工理论"
 ufc_situations.4020.desc:0 "“如果有六个人或十个人，包括制造工具的铁匠和木匠，以及负责耕牛、犁地、收割成熟谷物和其他所有农业活动的其他人，为了获得食物而单独或集体工作，并通过合作获得食物，那么他们就能满足比自己多很多倍的需求……综合劳动所生产的粮食将超过工人的需求和必需品。”——伊本·赫勒敦《历史绪论》\n\n伊本·赫勒敦和他的弟子们经过漫长的观察与研讨，这一团队的经济学研究有了新的突破。他认为，#Y 超出需求的财富积累是由劳动分工导致的#!。虽然伊本·赫勒敦更愿意用此来解释人类发展的社会学现象，但商会更乐意于看到短期的经济增益——按照伊本·赫勒敦的理论，人事部应该进行专业化教育与训练，而非以往的商业通才培养，一些行政专员们开始称之为“培训”。经过“培训”的联合果品商会雇员将将其毕生投入到某一件事情中，或许是打听商业情报，或许是负责一整个市场的资源调度。\n\n高强度的劳动分工一定程度上提升了我们的贸易效率，伊本·赫勒敦也在商人们的口中逐渐知名了起来。这个突尼斯的商站联络员重新打响了作为学者的知名度，他的大弟子被商会总部召回，负责人事部的培训工作。而这些负责学术与教育的人员在联合果品公司的历史上形成了新的阶级，他们被称为：“教育专员”。"
 ufc_situations.4020.a:0 "这是人事部与学术部的首次合作，给他们放权！"
 ufc_situations.4020.a.tt:0 "解锁建筑：学术部驻地与学术部分部（分别为国外建筑与国内建筑）。这将同时为我们解锁“教育专员”阶级，代表着管理意识形态领域的知识分子。"
 UFC_academic_department:0 "学术部分部"
 UFC_academic_department_foreign:0 "学术部驻地"
 UFC_academic_department_desc:0 "学术部分部是联合果品公司学术部在各地方的分属机构。与大学这种学术机构相比，学术部分部更加具有威权主义色彩。其内的工作人员，无论是具有一定学术水平的教育专员，还是半学徒工制的研究人员，均服从学术部的直属调遣。"
 UFC_academic_department_foreign_desc:0 "学术部驻地是联合果品公司学术部在非控制区域的分属机构。一般负责国外驻地的科学交流与意识形态教育等。"
 UFC_academic_department_maintenance:0 "学术部分部维护费"
 UFC_academic_department_foreign_maintenance:0 "学术部驻地维护费"

 ufc_situations.4025.title:0 "鉴往知来：兼职邀请"
 ufc_situations.4025.desc:0 "伊本·赫勒敦回到突尼斯后的第二年，便收到了来自突尼斯的苏丹[GetCountry('TUN').GetGovernment.GetRuler.GetName]的邀请信，希望他能够进入哈夫斯的宫廷中担任廷臣。这不仅是由于伊本·赫勒敦在格拉纳达埃米尔国期间的声名在外，同时也是由于他和当前的突尼斯苏丹在数十年前曾是同一监狱中的狱友。这一消息从突尼斯商站以信件的方式寄给了联合果品商会总部，附上的是伊本·赫勒敦的手写信件，请求商会的意见。\n\n既然伊本·赫勒敦向马拉加总部报告了此事，那么我们无需怀疑伊本·赫勒敦对于商会的忠诚，否则这封请示书信不可能存在。现在唯一的问题即是是否批准伊本·赫勒敦的“兼职”：如果我们批准了他的兼职，那么他可能获得更好的薪酬待遇和更多的商业人脉，并且这对他的外交能力是一种锻炼；但与此同时，他将牺牲在突尼斯商站的工作时间，一些弟子也会跟随加入哈夫斯的宫廷，这对他在突尼斯的研究工作是一种分心，而商会的学术部的建设工作也会被暂时搁置。"
 ufc_situations.4025.a:0 "双倍工时，双倍工资！"
 ufc_situations.4025.a.tt:0 "又去兼职的效果将会额外增加0.5基础倍率。"
 ufc_situations.4025.b:0 "外交大使、编史人、学者、商站联络人、学术部负责人、社会试验员……还要再来吗？"
 ufc_situations.4025.b.tt:0 "又去兼职的效果将会额外减少0.5基础倍率。"

 ufc_situations.4030.title:0 "鉴往知来：史学编纂"
 ufc_situations.4030.desc:0 "不得不说，黑死病的余波之下，突尼斯商站清闲的工作给学者留下了许多清闲的时光来进行文字工作，其中最有挑战性的就是编纂一本涵盖了古今东西的历史学巨著，而之前他为我们展示的《历史绪论》只是这本巨著的序言与第一章。\n\n这本雄心勃勃的史学巨著被他命名为《历史教训之书与事件编年史：阿拉伯人、柏柏尔人及其当代伟大人物史》，以全新的视角解读从创世时代到伊斯兰前期各个民族的通史，包含阿拉伯人、柏柏尔人、波斯人及同时代王朝的政治社会演变。与以往的阿拉伯史学家不同，伊本·赫勒敦摒弃阿拉伯史学家的古典体例，即采信各种语录而不作引证的神学式历史研究，而是提供详实的历史细节并进行反思，从事实中发掘可验证的社会学规律。\n\n相比于自回到突尼斯后六个月即成的《历史绪论》，他在后文中所需要引证的内容会非常丰富，这需要占用他数年的时间。完成整本书的内容对于伊本·赫勒敦的团队来说仍然任重道远。"
 ufc_situations.4030.a:0 "阿拉伯人的书名都和他们的名字一样长。"
 ufc_situations.4030.a.tt:0 "当我们具有土地时，该著作将会作为艺术品得到搬迁。又去兼职的效果将会额外增加0.5基础倍率。"
 ufc_situations.4030.b:0 "好家伙，你真的有好好在做本职工作吗？"
 ufc_situations.4030.b.tt:0 "当我们具有土地时，该著作将会作为艺术品得到搬迁。又去兼职的效果将会额外减少0.5基础倍率。"

 ufc_situations.4035.title:0 "鉴往知来：三驾马车"
 ufc_situations.4035.desc:0 "消费需求、出口贸易和投资是财富积累的基石。——伊本·赫勒敦\n\n这一经济学结论被联合果品商会的行政专员们戏称为“三驾马车”。这一经济学结论在整个马拉加轰动一时，它不仅适用于一个国家，同时也适用于一个法人团体，比如我们自己。\n\n在从前，联合果品商会的经济总是在投资与出口贸易中循环，而消费需求是自伊本·白图泰时期才逐渐成为受关注的对象。即使如此，我们的商人们也总是在费尽心思发掘出口需求，却很少关心内部需求。或许商团们为自己消费也是拉动经济的必要方式。"
 ufc_situations.4035.a:0 "给自己买点好东西吧，再不享受就要老啦。"
 STATIC_MODIFIER_NAME_ufc_modifier_promote_consumerism:0 "促进消费主义"
 STATIC_MODIFIER_DESC_ufc_modifier_promote_consumerism:0 "消费可以带来经济增长，但是当人已经真正一穷二白的时候，消费主义是不能填饱肚子的。"

 ufc_situations.4040.title:0 "鉴往知来：金银平价"
 ufc_situations.4040.desc:0 "伊斯兰的货币体系必须遵循具有内在价值，因此货币应由黄金和白银制成。货币的含金量即是金平价（铸币平价），国家货币之间的汇率应该按照金平价确定。——伊本·赫勒敦\n\n联合果品商会的行政专员们开始使用金银本位这一词语来形容伊本·赫勒敦所倡导的货币思想，即任意货币都必须与黄金价格挂钩。施行金本位制可以稳定联合果品商会向外出口的价格稳定性，也明确规定了各种货币的结算汇率，这为商会进一步的扩大出口提供了可能性。另外，在这种货币思想的指导下，黄金储备这一概念被提上了风口浪尖。"
 ufc_situations.4040.a:0 "我们不收英国人铸的铜币，拿真金白银出来。"
 ufc_gold_standard_exchange_rate:0 "金本位平价"
 ufc_gold_standard_exchange_rate_desc:0 "金本位平价体系是伊本·赫勒敦所提倡的货币制度，即汇率直接与铸币含金量挂钩，国家信用不得为货币的价值担保。"
 ufc_situations.4040.b:0 "强行推行金平价本位制度会损害商会的外交信誉。"

 ufc_situations.4045.title:0 "鉴往知来：故友之死"
 ufc_situations.4045.desc:0 "学者落寞地行走于非斯的贸易集市间，初秋的太阳还有些猛烈，炙烤这北非荒芜的大地。他没能在大清真寺的辩论中保住那个人的生命，那个人曾经是他最坚实的好友，也曾是他最恶毒的政敌。八年之前，伊本·赫勒敦被伊本·哈提卜驱逐出了格拉纳达埃米尔国；而如今，伊本·哈提卜因对权力的贪恋而自食恶果。伊本·赫勒敦只能默默回忆着往事，伊本·哈提卜的书稿与诗歌是留给学者最后的宝贵财富，他需要带着这些遗物回到突尼斯。\n\n在集市上的一个擦肩让学者感受到了一体仁厚而饱经沧桑的浑厚身躯，驻足一看双方都转怒为笑。年迈的伊本·白图泰借审判伊本·哈提卜的机遇也来到了非斯，审判结束后顺路在带领团队视察一下非斯的市场。自八年前马拉加码头那次挥手道别后，两人只在伊本·白图泰的例常巡查中见过两次面，但这风尘仆仆而又刚毅的面容让伊本·赫勒敦难以忘怀。虽是如此，两人之间的书信往来还是非常频繁，突尼斯商站的事务报告与学术部的建设情况再马拉加均有留档。\n\n非斯的偶遇以旅行家对学者在审判席上驳驳辩词的赞扬开始，不久便转移到了邀请学者回归马拉加总部的事情上来。伊本·哈提卜的死代表着他在阿尔罕布拉宫的余党将很快遭到清算，而只要联合果品商会向埃米尔请愿就可以轻易撤销对伊本·赫勒敦的驱逐令。这是对于伊本·赫勒敦的绝佳机会，当然在这之前，他还需要返回突尼斯商站解决一些善后事宜。"
 ufc_situations.4045.a:0 "败也哈提卜，成也哈提卜。"
 ufc_situations.4046.title:0 "撤销驱逐令"
 ufc_situations.4046.desc:0 "联合果品商会请求撤销对伊本·赫勒敦的驱逐令，并为他所受的诬陷平反。"
 ufc_situations.4046.a:0 "接受请求。"

 ufc_situations.4050.title:0 "鉴往知来：学者归来"
 ufc_situations.4050.desc:0 "随着前宰相伊本·哈提卜的死去，他在阿尔罕布拉宫的余党很快作鸟兽散，商会请求撤销对伊本·赫勒敦的驱逐令也很快得到了通过。[GetCountry('GRA').GetGovernment.GetRuler.GetName]给伊本·赫勒敦翻案的同时也给他预留了一个廷臣的职务，但显然经历了宰相专权的[GetCountry('GRA').GetGovernment.GetRuler.GetName]只是给学者留了一个虚职而已。不过商会相信，这对伊本·赫勒敦最大的影响就是他的兼职履历会再添一行。\n\n翌日，三艘满当当的商船停泊在了马拉加港，我们的学者再一次踏上了这片阔别了八年的土地。第一船上下来的是伊本·赫勒敦和他的弟子们，这是商会未来学术部的主要建设团队。在和[GetCountry('UFC').GetGovernment.GetRuler.GetName]与行政专员们打好招呼后，学者带着他的队伍和水手们一同开始从第二艘船上卸货——那是满载着书籍卷册的大木箱，装满了知识与经年累月的心血。伊本·白图泰赶忙招呼养尊处优的行政专员们去帮忙，一个小时后方才结束了这一船的卸货。正当众人准备松一口气时，学者指了指另外一艘船。"
 ufc_situations.4050.a:0 "不是吧，还有一船？"
 ufc_situations.4050.a.tt:0 "伊本·赫勒敦回到了忠诚的马拉加总部。这将使他的兼职修正基础倍率减少0.5。希望他在马拉加总部的生活一切顺利。"

 ufc_situations.4055.title:0 "鉴往知来：扩建总部"
 ufc_situations.4055.desc:0 "起初，行政专员们对学者的归来并不十分买账，这意味着本来就不宽敞的马拉加总部要多誊出几间办公室给所谓的“学术部”来使用。本来人事部作为专门的部门已经开始挤占总部大厅的空间，伊本·赫勒敦团队的加入使得整个大厅无比拥挤。为解决这一问题，伊本·白图泰被行政专员们要求召开商会领袖会议，商量出资扩建总部的事宜。\n\n会议不是非常成功，商团首领们并不为总部的事情买账，人事部与学术部的事项与他们的发财之路没有直接的关联。即使一个博学多识的学者与一个见多识广的律法学家据理力争，最终能够争取到的资金也不过是新建两间茅草屋的水平。"
 ufc_situations.4055.a:0 "就这么多预算，大家看着办。"
 ufc_situations.4055.a.tt:0 "我们应尽快将联合果品商会总部升级到三级以完成此任务。若已经完成，则半年内自动触发下一事件。"
 ufc_situations.4056.title:0 "人事部：运行伊始"
 ufc_situations.4056.desc:0 "随着联合果品商会总部的扩建，人事部获得了属于它的办公地点。人事部坐落在总部大厅两百步开外的一栋小偏房里，由行政专员中的人事部专员负责处理事务。其主要职责包括筛选、培训、排班等有关人力资源的主要事宜。其中最重要的是关于人员的晋升工作，定期的考核将确定谁将可能从商团中晋升，谁又会被踢出行政专员这个肥差的行列。"
 ufc_situations.4056.a:0 "阶层流动是保持政治健康的核心要素。"
 ufc_start_human_resource_department:0 "运行伊始"
 ufc_start_human_resource_department_desc:0 "人事部的运行开始于马拉加总部的一次扩建工程。至少，一间像模像样的办公室是不可或缺的。"
 ufc_situations.4057.title:0 "学术部：运行伊始"
 ufc_situations.4057.desc:0 "随着联合果品商会总部的扩建，学术部获得了属于它的办公地点。学术部部坐落在马拉加的清真寺附近，由教育专员负责处理事务。其主要研究对象是哲学、文学、神学、数学和一些实用科学。目前学术部暂时由伊本·赫勒敦的弟子们组成的团队构成，伊斯兰教的教法在学术部是主流意识形态，这使得我们吸引来自基督教世界的通才而言仍然具有挑战性，但目前仍然没有人愿意挑战教法在意识形态上的绝对地位。"
 ufc_situations.4057.a:0 "作为商业共和国，我们或许应该放松宗教审查。"
 ufc_start_academic_department:0 "运行伊始"
 ufc_start_academic_department_desc:0 "伊本·赫勒敦的书稿在学术部的小屋中四仰八叉地堆叠成一座小山。"

 ufc_situations.4060.title:0 "鉴往知来：闭门造车"
 ufc_situations.4060.desc:0 "伊本·赫勒敦在马拉加的工作开始的还算顺利，但人们很快发现这个学者的工作方式似乎不甚合群。他总是最早来到学术部的，也总是最晚下班的那一个。他喜欢在学术部的小屋子里每天工作十个小时以上，大量时间里他都在一个人著书立说，偶尔和弟子们或其他教育专员交流讨论学术问题，连站起来走动走动都处于他的时间计划表里。\n\n在联合果品商会这个以人与人的交互为基础建构起来的组织里，这种毫无社交需求的人相对来说属于异类。在最近的丰收节庆中，当众人都在畅饮着奶与蜜相谈甚欢时，伊本·赫勒敦在简单的蹭吃蹭喝后又返回了他的工位上。虽然伊本·赫勒敦不认为这有什么问题，但无论如何，他这种内向的性格总会把学术部塑造成这种书呆子的工作状态。"
 ufc_situations.4060.a:0 "坚持自己的工作方法并没有错。"
 ufc_situations.4060.b:0 "鼓励他多和同事们聚聚会。"
 ufc_situations.4060.c:0 "还是要注意身体，为联合果品健康工作五十年。"

 ufc_situations.4065.title:0 "鉴往知来：朝觐丧女"
 ufc_situations.4065.desc:0 "学者日以继夜的工作最终还是让他的身体吃不消，伊本·白图泰决定给这个工作狂放个假。作为虔诚的穆斯林，伊本·赫勒敦尚未完成过朝觐的义务，恰好这个假期可以让他完成这次朝觐。但是学者本人似乎对旅行这件事不是很有兴趣，在临出发前，他还是悄悄顺上了最近正在整理的书稿。\n\n我们无法评价这种旅行的途中还要加班的做法，但显然真主不是很赞同——他的船在亚历山大港的外港沉了。他珍爱的一位女儿与他的书稿一同葬身鱼腹，所幸他和两个儿子都爬上了岸。在为女儿哀悼三日后，伊本·赫勒敦继续踏上了朝圣的旅行，丢掉书稿的旅行从此顺风顺水。\n\n值得一提的是，在离开埃及之前，马穆鲁克苏丹[GetCountry('MAM').GetGovernment.GetRuler.GetName]希望聘请伊本·赫勒敦为卡姆希耶经学院教授。伊本·赫勒敦又虚领了一个职位，他的兼职履历已经一页纸都写不下了。"
 ufc_situations.4065.a:0 "爱资哈尔大学的名誉教授要挂靠一个吗？"
 ufc_situations.4065.a.tt:0 "又去兼职的效果将会额外增加0.5基础倍率。"
 ufc_situations.4065.b:0 "看到了么，这就是放假还在加班的下场！"
 ufc_situations.4065.b.tt:0 "又去兼职的效果将会额外减少0.5基础倍率。"

 ufc_situations.4070.title:0 "鉴往知来：混个脸熟"
 ufc_situations.4070.desc:0 "伊本·白图泰像往常一样，搬着他的小木椅面朝马拉加的港口坐下。他曾经这样坐了好几年，朝着突尼斯的方向等待着未来，而那个“未来”如今已经在马拉加的学术部里兢兢业业地工作着。自学者从突尼斯归来后，伊本·白图泰还是改不了放工后面朝港口沐浴夕阳的老习惯，他喜欢看地中海的海鸥，喜欢看一眼无尽的大海，喜欢看自己踏足过的这片大陆。#Y 这个世界，究竟有多大呢？#!最伟大的旅行家一生都回答不了这个问题。\n\n伊本·白图泰突然感觉到有些寒冷，这是他在金帐汗国的冬天都不曾感受过的刺骨的冷。他知道发生了什么，他老了。自从他停止旅行后他的时间就如同长了腿一样向前奔去，伊本·白图泰本该是属于这个广袤的大地的，但如今他有了个家。\n\n伊本·白图泰不是特别懂政治，但至少他见过各个国家的老君主是怎样培养他的继承人。在彻底退休之前，伊本·白图泰需要暂时让伊本·赫勒敦从学术、书籍和教育专员们的簇拥之中抽离出来，与行政专员们和商人团们打打交道。显然，频繁的人际交往对于学者而言有些窘迫，但混个脸熟总是不会错的。所幸的是，随着专业化的推进，商会领袖如今只需要做一些顶层管理，而行政专员们会专注于将一切行政事物处理的井井有条。"
 ufc_situations.4070.a:0 "好烦！让我回学术部工作啊啊啊！"

 ufc_situations.4075.title:0 "鉴往知来：权力交接"
 ufc_situations.4075.desc:0 "伊本·白图泰的退休仪式与当年法蒂玛太皇太后的权力交接如出一辙。仪式性地递一份辞呈，仪式性地跑一通选举，仪式性地宣布一下继承人。但与上次亦有所不同，与伊本·白图泰在黑死病中的声名鹊起与临危受命相比，伊本·赫勒敦只能说小有所成，毕竟不是所有人都能对那些奇怪的社会学与经济学规律提起兴趣。\n\n行政专员们对于伊本·赫勒敦的才能大多有目共睹，也乐意让一个能够提高工作效率的学者来掌管商会的工作，这也意味着他们的权力能够更加集中。而商人团们则对此议论纷纷，只有突尼斯商站的代表坚定支持，更多的商队领袖对学者的商业才能保持怀疑态度。虽然伊本·白图泰添油加醋地吹嘘这位学者在阿尔罕布拉宫时的光辉事迹，但怀疑者仍然难以相信，那些空话连篇的经济学原理真的能够帮每个人赚到大钱吗？\n\n无论如何，权力的交接结束了，学术部长官如今又兼任了联合果品商会的首领，伊本·赫勒敦的兼职履历表上写满了密密麻麻的字。"
 ufc_situations.4075.a:0 "这是不是给人一种，钦定的感觉？"
 ufc_situations.4075.a.tt:0 "伊本·赫勒敦作为一届学者，其影响力虽在学术部中尚有一席之地，但商团的领袖们很难对这个书呆子有什么认同，这对我们的共和传统是不小的打击。展现你的政治手腕，与适当的人分享权力以提升共和传统。\n又或者，动动你学者的脑筋，#R 创造一个全新的方式，将商会利益与商人团的利益强行绑定#!——我们将迈入一个全新的未来。"
 STATIC_MODIFIER_NAME_ufc_modifier_condifence_risk:0 "信任危机"
 STATIC_MODIFIER_DESC_ufc_modifier_condifence_risk:0 "伊本·赫勒敦的执政是不受商人团们欢迎的，只有时间才能检验他的能力。"

 ufc_situations.4080.title:0 "鉴往知来：国家凝聚力"
 ufc_situations.4080.desc:0 "阿萨比耶是伊本·赫勒敦在《历史绪论》中提出的核心观点，其核心含义是群体凝聚力与团结精神。这种群体凝聚力是人类社会的基本纽带与历史发展的根本动力。伊本·赫勒敦认为"阿萨比耶"具有周期性，这意味着王朝的迭起兴衰。阿萨比耶在文明初创时——通常是蛮族或游牧文明——最为强盛，随着文明发展逐渐衰减，最终被更具凝聚力的文明所取代。伊本·赫勒敦的阿萨比耶概念解释了一部分罗马文明的衰亡、伊斯兰教的崛起与蒙古人的进击。\n\n这一概念在学术部中引起了轩然大波，并在整个西南地中海沿岸得到了诸多学者的肯定。另一方面，阿萨比耶的概念解释了王朝兴衰的循环往复，伊本·赫勒敦在《历史绪论》中直接指出“王朝如同个体般具有自然寿命”。这意味着没有人能够在既有的传统中生存下来。#G 唯有流水不腐。#!\n\n除此之外，这一论断时刻警戒着我们维持团体凝聚力。只要联合果品的人们能够永远团结，我们将在未来的逆流中屹立不倒。"
 ufc_situations.4080.a:0 "一篇慷慨激昂的学术报告也会鼓舞人心。"

 ufc_situations.4085.title:0 "鉴往知来：下放权力"
 ufc_situations.4085.desc:0 "在经历领导班子的更换后，伊本·赫勒敦的权力稳固不仅仅依靠学术部的嘴皮子，更要分给商人团们更多的权力。一些简单的减少税收、授予特权等条文的颁布可以有效地提升一些商会权力的合法性，让商人们信任商会的管理、统筹和基础设施对于维持商会内部政治的稳定至关重要。\n\n然而，在下放一些权力的过程中，部分商人请求了一些更为激进的方案。这会损害一些我们的集权化进程，来换取商人们的忠诚。"
 ufc_situations.4085.a:0 "凝聚力在当下至关重要。"
 ufc_situations.4085.b:0 "还想让我们让步更多？没门！"

 ufc_situations.4090.title:0 "鉴往知来：化敌为友"
 ufc_situations.4090.desc:0 "在掌管联合果品商会的一年以来，重返政坛的伊本·赫勒敦显然不愿意受制于权势过大的商团首领们。但伊本·赫勒敦不是喜欢斗争的人，他更擅长用脑子来解决问题。政治就是把敌人变少，把朋友变多。那为什么不想个法子化敌为友呢？\n\n商人团的首领们是掌握商会经济命脉的核心，但他们不直接掌握商会的决策权力，而政治与经济的权力不集中就会产生矛盾。我们可以将商会的决策机构从那群养尊处优的行政专员手中转移到一个由商队首领内部选举出的会议，让商队首领们从“参与”商会变为“拥有”商会。而想要拥有，就必须“注资”。\n\n将投资与权力画上等号，那么我们不再是一个商会。伊本·赫勒敦将这种新的权力分配方式称之为：公司。"
 ufc_situations.4090.a:0 "起草文件，准备开会！"
 ufc_situations.4090.a.tt:0 "解锁政府改革选项：股份制改革。该政府改革不占用改革槽位，提供中央集权进度、王室力量并降低阶层结余。\n实际上，企业化转型并不是一朝一夕提出来的，自伊本·赫勒敦的雇员专业化运动起一切就已经开始转变了。等待一些时间，联合果品公司的成立自然水到渠成。"
 UFC_shareholding_system_reform:0 "股份制改革"
 UFC_shareholding_system_reform_desc:0 "股份制改革是联合果品公司之所以能够成为公司的基础。资本，而非能力、血统或是人脉，成为决策权力的最终来源。拥有股权的人被视为联合果品公司的合法拥有者团体之一——虽然这不能保证此人有真才实学。"

 ufc_situations.4095.title:0 "鉴往知来：企业化转型"
 ufc_situations.4095.desc:0 "联合果品商会向联合果品公司的转变是自伊本·赫勒敦时期的劳动分工深化中潜移默化地完成的。相比于从前若干商队首领各自发展其私人资本，如今的这些人更愿意将其资本以“股份”的形式转移到商会的共有资金池以鼓励专业分工，各个股东则按照注资份额分配权力。这一过程又被称为联合果品商会的企业化转型，或股份制改革。\n\n作为模仿商业共和国模型而建构的商人共同体，自联合果品商会脱离阿尔罕布拉宫的掌控后，其权力核心始终掌握在少数几个商队领袖中。随着分工专业化的推进，这些商队首领转型为了注资股东，而其中具有管理能力与意愿者被任命管理行政专员与教育专员，其被称之为董监事或董事（法语：directeur）。自此，若干董事形成的董事会议成为了联合果品商会的权力机构。\n\n企业化转型意味着商会中央集权的进一步提升，商团阶层的首领不再为私人资本工作，而是为所注资的集体资本谋利。但与此同时，联合果品商会选贤任能的传统被塑造为董事会内部选举，商会首领往往出身于最有能力的董事会成员之中。"
 ufc_situations.4095.a:0 "毕竟这个世道，谁有股权，谁是老大。"
 ufc_situations.4095.a.tt:0 "\n增加权力再分配政策选项：董事会会议。"
 ufc_situations.4095.b:0 "我更喜欢原来的开会方式。"
 UFC_board_director_meeting:0 "董事会会议"
 UFC_board_director_meeting_desc:0 "董事会会议是联合果品公司的会议决策制度。董事会是由股东会议中的有能力与意愿参与公司管理的人员组成，他们的决策不再更多地受制于行政专员与教育专员们。"

 ufc_situations.4100.title:0 "鉴往知来：董事会扩大会议"
 ufc_situations.4100.desc:0 "联合果品公司于今日举行了第一次董事会扩大会议。邀请了行政专员代表、教育专员代表和为参与股权注资的商团首领代表参加。会议的主要议程是进一步整编商人团，推进商团专业化。\n\n按照议程要求，所有参与注资超过一千个意大利第纳尔等值货币的自然人被视为拥有股权，根据其能力、资源与注资份额综合核算，经人事部考核任免可以进入董事会、行政专员或教育专员行列。其余人等全部从属于商人团行列，不再存续原先的私人商团所属关系。\n\n从大局来看，伊本·赫勒敦所推行的专业化进程是不可避免的，这无非是我们激进改革还是等这一代商队首领慢慢做出抉择的区别而已。"
 ufc_situations.4100.a:0 "这将为我们注入新的资金。"
 ufc_situations.4100.b:0 "给商团们更多的准备时间。"

 ufc_situations.4105.title:0 "鉴往知来：董事会选举"
 ufc_situations.4105.desc:0 "作为学术部知识分子的代表，伊本·赫勒敦所引领的改革无疑做到了有史以来优秀的改革的最大优点：得罪的人少，分享的权多。当他的历史学、经济学与社会学研究只在行业内部引发了一丝波澜外，他的企业化改革才可以说令他声名鹊起。伊本·赫勒敦在商团们之间的名望日渐升高，这使他成为整个董事会中注资最少却权力最大的人。\n\n在今日的董事会内部会议中，我们通过了关于公司的最高领袖：董事长的任免流程的讨论议程。具体如下：当董事长职位空缺时，董事会内部会议可以进行一次选举，相对多数者当选。董事长可以无限期连任，即允许终身任职。因年龄、疾病或个人意愿而进行的请辞需要董事会内部会议批准。董事会随时可以对其进行不信任动议，绝对多数赞成此动议将立即罢免当前董事长。\n\n这一选举议程得到了通过。伊本·赫勒敦毫无疑问地接过了第一任董事长的职责。他对这一制度的设计颇为满意。\n\n只是，沉浸于改革成功的幸福之中的伊本·赫勒敦漏算了两件事。其一，倘若董事长贿赂了绝对半数以上的董事会成员会如何；其二，这个制度只有内部监督而毫无自下而上的监督。\n\n#R 联合果品公司迟早会为此付出代价。#!"
 ufc_situations.4105.a:0 "至少我们超越了希腊人的民主不是吗？"
 ufc_board_elective:0 "董事会选举"
 ufc_board_elective_desc:0 "董事会选举是由伊本·赫勒敦时期所倡导的联合果品公司的权力交接方式。虽然名义上每年都要召开董事会扩大会议以讨论董事会成员与董事长任命，但实际上除非多数董事对当前董事长提出不信任动案，否则董事长的席位并不会更换。相反，随着执政的不断成熟与团队的不断磨合，董事长的属性会每年缓慢提升。\n\n当且仅当不信任动案被提出时，在下一年的会议上当前董事长会被罢免。"
 ufc_no_confidence_motion:0 "不信任动案"
 ufc_no_confidence_motion_concept:0 "在下一届董事会扩大会议上罢免此人。"
 ufc_no_confidence_motion_desc_specific:0 "我们的董事长是庸碌无能之辈，我们需要真正能挑大梁的人站出来主持局面。"
 UFC_TOOLTIP_RAISE_NO_CONFIDENCE_MOTION:0 "提出不信任动案，在下次董事会扩大会议中，这名董事长将会被罢免。"

 flavor_ufc.1000.title:0 "董事会扩大会议：董事长选举"
 flavor_ufc.1000.desc:0 "或许是因为辞职、猝死或者不信任动议，目前我们的董事长席位虚位以待。在联合果品公司，权力真空是不可能存在超过一个月的。我们必须尽快完成新一任董事长的选举，无论是通过真才实干、金钱贿赂还是权利交易。"


 ufc_situations.4110.title:0 "鉴往知来：平稳航行"
 ufc_situations.4110.desc:0 "伊本·赫勒敦的董事会改革已经初见成效了，人们专业分工，各司其职，联合果品公司相比于商会时期的工作效率提升了20%以上。伊本·赫勒敦十分满意，他已经迫不及待地投身于那永无止境的学术研究中了。\n\n如今的联合果品公司，不再有以往的商人团内部的派系斗争——那些过家家的游戏如今演变为了董事会内部会议中的争吵。我们成功让“参与”变为了“拥有”，而只要一个人拥有一件珍宝，他就会用平生的爱意加以珍惜。\n\n联合果品公司像一艘稳当的大船，平稳航行在无风无浪的地中海上。然而，无风无浪意味着加速航行步履维艰。黑死病的余波尚未全部消散，人口的凋敝、需求的减少与东方贸易的断流始终是我们发展的桎梏。这个冬天或许还很漫长，但春天总会到来的。"
 ufc_situations.4110.a:0 "好啦，让我们的学者继续他忙碌而快乐的工作吧。"

 ufc_situations.4115.title:0 "鉴往知来：巡回执教"
 ufc_situations.4115.desc:0 "旅行对于伊本·赫勒敦而言简直是找罪受，但如果这趟旅程的目的是授课，那么学者的积极性比起专业的旅行家有过之而无不及。\n\n从马拉加到非斯，从凯鲁万到开罗，一道横贯南地中海的学术网缓缓落下。伊本·赫勒敦企图构建一个全新的学术灯塔，这将超越在蒙古人未曾到来前的巴格达智慧宫。越来越多的阿拉伯学术专家开始讨论除神学以外的诸多学科，包括文学、修辞学、数学、医学、建筑学等。而吸引这些学者最有效的方案是：到处做学术报告。\n\n因此，伊本·赫勒敦经常出差，这次要前往的地点是开罗的马德拉萨学院，在那里他曾经挂名了一份教职。希望能够带领新的学者来到联合果品公司就职。"
 ufc_situations.4115.a:0 "还要给他拨款是吗，学术会议真是经济黑洞。"

 ufc_situations.4120.title:0 "鉴往知来：两个时代的会面"
 ufc_situations.4120.desc:0 "伊本·赫勒敦的学术团队在旅行至大马士革时，遭遇了令人闻风丧胆的“跛子”帖木儿的军队。此时的帖木儿正在横扫整个中东地区，蒙古人的大军所向披靡，但他们似乎并没有就地建立新政府的意思，预计马上就会后撤回核心地带。马穆鲁克的统治者派遣了些许残兵败将做了仪式性的抵抗，但两周后大马士革就投降了。\n\n与百年前的蒙古人不同，这位帖木儿大帝似乎对于科学和文化相当尊崇，逊尼派信仰也使他并没有为难本地的穆斯林学者们。相反，伊本·赫勒敦的学术团队被邀请进入帖木儿的宫帐内。\n\n按照帖木儿的意愿，伊本·赫勒敦向这位中亚的新统治者做了长篇报告，讲述了马格里布地区和伊比利亚半岛上的政治局势，同时给联合果品公司做了广告。此外，伊本·赫勒敦为帖木儿作了一些苏菲主义与占星学的赞美，称他为“星宿际会之主”，以认同帖木儿的政权合法性地位。与此同时，联合果品公司的名号也在帖木儿汗的宫帐中传播开来，帖木儿汗热情地欢迎公司的商队前往撒马尔罕，并建立一个全新的贸易使馆。"
 ufc_situations.4120.a:0 "我们非常乐意互相建立使馆。"
 ufc_situations.4120.b:0 "这算是什么，商业互吹？"

 ufc_situations.4125.title:0 "鉴往知来：戛然而止"
 ufc_situations.4125.desc:0 "伊本·赫勒敦死了？！逃回马拉加的学术部人员报告道，伊本·赫勒敦在大马士革郊外遭到突厥部落的劫掠，整个学术旅行团几乎全军覆没。\n\n伊本·赫勒敦一生都不曾休息过，他总是火急火燎地完成每一项学术工作，然而死亡降临在了他尝试放慢脚步的时候。当他的学术旅行团从大马士革返回时，疲于行程的他们决定就地扎营，明早再向安塔基亚赶路。然而，半夜中一群突厥部落的匪帮突袭了他们的营寨，伊本·赫勒敦并没有在战斗中存活下来。\n\n伊本·赫勒敦的突然离世出乎所有人的意料之外，没有人曾经想到过这位名噪一时的学者竟突然客死他乡。然而一刻也没有人收拾他的遗稿和学术文件，董事会里的权力争夺马上开始了。"
 ufc_situations.4125.a:0 "天呐！"
 ufc_situations.4125.a.tt:0 "伊本·赫勒敦的死亡是一场意外。他本不该就这样离我们而去，还有许多研究本该等待着他的团队进行。随着伊本·赫勒敦的突然离世，联合果品公司群龙无首，董事会内部的权力斗争很快开始上演。"
 ufc_situations.4130.title:0 "鉴往知来：董事长选举"
 ufc_situations.4130.desc:0 "董事长选举发生在伊本·赫勒敦的哀悼会结束后的次日，联合果品公司作为一台运转的钟，权力真空就如同零件的锈蚀，一分一秒都容不下。\n\n按照伊本·赫勒敦生前制定过的规则，当董事长职位空缺时，董事会内部会议可以进行一次选举，相对多数者当选。可以想象，贿赂、交易与拉帮结派总是在这个团体中轮番上演。但至少这是第一次，而且出于突发情况，董事会内部的斗争似乎很快就结束了。"
 ufc_situations.4130.a:0 "让我们回顾一下选举结果。"

 ufc_situations.4135.title:0 "鉴往知来：尾声"
 ufc_situations.4135.desc:0 "伊本·赫勒敦的突然离世给联合果品公司的打击是巨大的：董事会内部开始了无休无止的斗争、学术部的建设工作直接暂停、人事部开始疯狂进行岗位任免与清洗……但我们必须承认，以往的商会权力交接制度相比于现在的董事会制度要更加脆弱，董事会的选举一定程度上削减了伊本·赫勒敦的突然离世所带来的权力真空与混沌。#G 毕竟，再昏暗的秩序也强于无政府状态。#!\n\n伊本·赫勒敦的遗体在叙利亚的一个偏远的村庄的荒地中被发现，在新任董事长[GetCountry('UFC').GetGovernment.GetRuler.GetName]的操办下，整个联合果品公司为伊本·赫勒敦举行了为期三天的葬礼。这位名震一时的穆斯林学者的遗体朝向麦加下葬，他为联合果品从商会到公司的转型做出了卓越的贡献。他的遗稿被学术部的直系弟子们收录，\n\n世人很难评价伊本·赫勒敦的一生，他没有法蒂玛太皇太后的大公无私，也没有伊本·赫勒敦的理想主义。他追名逐利，好大喜功。一边追寻着神秘主义，寻找着历史规律，一边又大搞政治投机，甚至在数十个伊斯兰学校挂名兼职。如果说伊本·赫勒敦真的为联合果品公司留下了什么精神遗产的话，那么就是请每个人遵从自己的本心。伊本·赫勒敦是一个庸俗之人，是所有庸俗之人中最高尚的那一个。\n\n历史学家伊本·赫勒敦盖棺定论了。他开创了联合果品公司的新时代，而联合果品公司的命运，自他之时就早已注定。\n——所谓鉴往知来。"
 ufc_situations.4135.a:0 "挣钱嘛，不寒碜。"
 ufc_situations.4135.a.tt:0 "结束主要事变：鉴往知来。"

 ufc_situations.5000.title:0 "次要事变：世纪之冬"
 ufc_situations.5000.desc:0 "自1350年起，欧洲持续了数个世纪的繁荣戛然而止。持续不断的饥荒与瘟疫——其中以1315至1317年的大饥荒与黑死病最为著名——使人口锐减至十四世纪初的一半。英法两国的百年战争持续不断，伊比利亚半岛上王位继承战争此起彼伏，南方的穆斯林王国更是身陷各种继承危机中。另一方面，天主教会的大分裂也在持续困扰着基督教世界。在东方，奥斯曼帝国的崛起与埃及马穆鲁克王朝的混乱使我们很难进行远达东方的贸易。以上的所有绝望与衰落造就了一个共同的结果：中世纪晚期经济大萧条。\n\n在十四世纪与十五世纪相交的这段岁月里，无数人都在艰难前行着——不仅仅有英格兰与法兰西的那些王侯将相们，更有千千万万个活在饥饿与疾病中的普通人。每个不起眼的小人物都有可能在历史上写下浓墨重彩的一笔。在这悲凉与衰败的世纪之冬，每个人都在推进着历史的车轮滚滚向前，直到迎来下一个温暖的春天。"
 ufc_situations.5000.a:0 "当冬天来临时，我们唯一的目标是：活下去"
 ufc_situations.5000.a.tt:0 "在这一次要事变中，我们将描写多个小人物的简短故事，他们或许是未来我们接触到的人物的遥远的祖先，又或许只是茫茫人海中的苍渺一粟。在这中世纪的末期，每个人都在艰难前行着。"

 UFC_SITUATION_MISSION_CENTURY_OF_WINTER:0 "次要事变：世纪之冬"
 UFC_SITUATION_MISSION_CENTURY_OF_WINTER_TT:0 "自1350年起，欧洲持续了数个世纪的繁荣戛然而止。持续不断的饥荒与瘟疫造就了一个共同的结果：中世纪晚期经济大萧条。\n\n在十四世纪与十五世纪相交的这段岁月里，无数人都在艰难前行着——不仅仅是那些王侯将相们，更有千千万万个活在饥饿与疾病中的普通人。每个不起眼的小人物都有可能在历史上写下浓墨重彩的一笔。在这悲凉与衰败的世纪之冬，每个人都在推进着历史的车轮滚滚向前，直到迎来下一个温暖的春天。"


 ufc_situations.5005.title:0 "世纪之冬：穆哈之死"
 ufc_situations.5005.desc:0 "还记得穆哈吗？哎呀不是也门的那个穆哈咖啡，是那个曾经富甲一方的老头啦。六十年前他失去土地来到联合果品商会求职，曾经用最后的一口食粮换了一身行头来参加面试的那个。据说他最近病逝了。\n\n穆哈在联合果品的生活顺风顺水，他总能在关键的历史抉择中找到最有利的那个选项。从水手到商团首领，从在穆罕默德五世的流亡中，他身先士卒支持了流亡政府；在伊本·白图泰的远征中，他率领舰队在亚历山大港保护来往船只。在积累的第一笔财富后，穆哈成为了第一批投资公司获得股权的人，最终进入的第一届董事会。穆哈是这个时代最优秀的赌徒。\n\n按照联合果品公司的法律，遗产可以继承，而董事会地位是不能继承的。穆哈的两个儿子分割了他的财产，却未曾继承他精明的头脑。如今的两个儿子坐吃山空，还在做着用最后的口粮钱置办一身行头的事情。岂不知没有赌局的下注，本身就是满盘皆输。"
 ufc_situations.5005.a:0 "所谓财富的传承就是如此脆弱。"

 ufc_situations.5010.title:0 "世纪之冬：奇货商人"
 ufc_situations.5010.desc:0 "当阿里干涸的喉咙接触到三天以来的第一口甘霖时，他唯一的祷告是别让他的孩子们再继承他这份工作了。\n\n联合果品公司的阿里是来自突尼斯周边村庄的一名商人，然而他的货物既不是橄榄也不是丝绸，而是“奇物”——希腊文明的陶罐，罗马时代的礼器，抄写着未知文字的古籍等等。其中一半是靠他的慧眼识珠淘来后加价售卖，另一半则要靠他自己。也就是说，阿里偶尔需要靠盗墓为生。\n\n阿里也曾是自耕农，他的田产因为地中海上来的一场暴风雨而被海水浸没，自此颗粒无收。走投无路的阿里在绝望地耕作着自己满是盐碱的土地时挖到了一根刻着奇怪文字的柱石。在突尼斯的联合果品贸易站里，这根柱石被博学者检定为迦太基古物，这使阿里获得了转行的第一笔资金。从此以往，阿里便拖家带口地放弃了田产，转而干这个剖坟掘墓的行当，专取一些奇货古器来卖。\n\n然而，剖坟掘墓这工作更不是常人能够胜任的，阿里这次冒险又一次险些被埋在黄沙之下。幸亏偶遇暴雨，雨水上涨，阿里才得以抓住第一块不那么陡峭的岩石——他已经在这个陷阱里困了三天之久。为了家庭的生计，他不得不冒这个险。"
 ufc_situations.5010.a:0 "哈夫斯苏丹的宫廷想必能给这批古器开个好价钱。"
 ufc_situations.5015.title:0 "世纪之冬：九死一生"
 ufc_situations.5015.desc:0 "阿里瘫坐在突尼斯贸易站的街头，夕阳温柔地轻触着他的残破的脸颊。今天又没有贵族照顾他的生意，这批土器入不了哈夫斯宫廷那刁钻的眼。阿里有些干不下去了，每隔那么一个月，阿里就要到打听到的墓穴里走一遭，去干那九死一生的买卖。\n\n家里的孩子在嗷嗷待哺，来自各个苏丹宫廷的需求尚不断绝，阿里的冒险日子就需要一天接着一天。阿里和突尼斯商站里的大伙们聊着，说到他那“探赜索隐”的工作，伙计们总是兴致勃勃地聊着哪个达官贵人的墓穴里藏着的机关埋伏，说到这里阿里只得苦笑，他知道那些都是劝人莫干这行的噱头，却是那历经百年的碎石塌方才是万险之要——他已经看过数十具埋在尘土中的白骨。\n\n无论如何，阿里的生意自然是得到公司支持的，毕竟不会抢到其他商人的生意。但公司所能提供的支持也是寥寥无几，几双便鞋几包工具而已，这对于阿里的工作可谓是杯水车薪。阿里从夕阳的斜影中爬起来，抖抖身上的灰尘，张罗着自己的古董摊位，拜别了商会的伙计们。夕阳西下，是时候回家了。"
 ufc_situations.5015.a:0 "但愿明日还能再见。"
 ufc_situations.5020.title:0 "世纪之冬：金盆洗手"
 ufc_situations.5020.desc:0 "阿里的生意越来越差了，他对此心知肚明，随着他的儿子一天天长大，阿里对于冒险的动力也在逐日衰退。这一年的冒险生活至少让阿里经历了四次九死一生的经历，他开始感到害怕。他怕见不到明天的太阳，也怕见不到明天的家人。\n\n阿里辞别了突尼斯贸易站的伙计们。他这两年已经攒下了置办一份田产的资金，为了自己的家人阿里决定继续过那一穷二白的苦日子。人事部将他的名字从名册上销去，在联合果品，只有传统商品值得统筹管理，而阿里这样的奇货需要自己的货源。伙计们也没有多做挽留，像阿里这样的退出者，在突尼斯商站也是屡见不鲜。\n\n回到家中的阿里开始准备那将自己囿于田野的事务，至少他可以天天看到孩子们可爱的面容。他只希望自己的子孙后代能平平安安地过这样的生活。"
 ufc_situations.5020.a:0 "阿里不知道，有些精神，是流淌在血液之中的。"

 ufc_situations.5025.title:0 "世纪之冬：热心织工"
 ufc_situations.5025.desc:0 "年轻的多米尼克是热那亚的城市中的一名普通的纺织工，他的父亲教会了他一门关于纺织的祖传手艺，但年轻的多米尼克做的并不十分出色。一年前他娶到了一位美丽的妻子，但这一年来两人并没有生下孩子。\n\n多米尼克不被邻里认为是个多么聪明之人，相反，他做事总是笨手笨脚的，但憨厚可靠的性格也赢得了周围人的善意与喜爱。或许是因为不精明的生意，又或是黑死病肆虐过的经济不景气，多米尼克的收入只能勉强涵盖这个没有孩子的新家庭的基本开支。\n\n为了改善家庭的生计，多米尼克在妻子的怂恿下把纺织工坊交给家人打理，自己去外边找一些力气活去做。这个憨厚的小伙子不太适合商业场中的勾心斗角，当一个水手却是生龙活虎。相比于纺织工坊里刺鼻的漂白剂，还是大海的味道更加舒服。\n\n多米尼克服务的商船属于一个与联合果品公司走得很近的热那亚商人。商人很喜欢这个憨憨的小伙子，但自己的生意半年后就要转让了，商人给多米尼克写了封去联合果品公司的推荐信，希望人事部不会介意一个来自热那亚的基督徒。"
 ufc_situations.5025.a:0 "多米尼克·哥伦布是吧，明天去港口报道。"
 ufc_name_colombo:0 "哥伦布"
 ufc_situations.5030.title:0 "世纪之冬：第一桶金"
 ufc_situations.5030.desc:0 "多米尼克·哥伦布第一次见到这么多钱，今天是水手们发薪的日子，联合果品公司最近设计了一个奖励机制，每年给大家认为表现最好的雇员额外发一个月的工资，而在水手中多米尼克自然博得了众人的喜爱。不怕吃苦、无欲无求、乐于助人是同事们给这个憨憨的小伙儿贴上的标签，当然，心眼少的多米尼克也自然多干了许多工作，即使是在无意识的情况下。\n\n拿到了丰厚的薪资的多米尼克自然是——把家里的妻子忘得一干二净。本来他准备给同事们开一顿酒宴的，但半路上才想起来他的一多半同事都是穆斯林。那买些什么回去好呢？您还真别说，多米尼克有自己的一套审美。身为热那亚人的多米尼克从小就喜欢艺术，他对那些文艺复兴热潮中的文学、绘画与雕塑热爱地如痴如醉，无论是欣赏宫廷赞助的华丽美术还是地摊上便宜出售的失败作都是爱不释手。只是家里人不总是赞同这些爱好，而如今拿到了联合果品公司的薪水，这下多米尼克可拥有自己的经济自主权了。\n\n结果可想而知：当多米尼克搬着死沉死沉的石头与乱涂乱画的纸张回到家里时，他的妻子拒绝让他进入房间。"
 ufc_situations.5030.a:0 "生不出孩子都是因为把老婆气的。"
 STATIC_MODIFIER_NAME_ufc_modifier_kindhearted_weaver:0 "热心织工"
 STATIC_MODIFIER_DESC_ufc_modifier_kindhearted_weaver:0 "多米尼克·哥伦布是来自热那亚的热心肠小伙，但他似乎并不受他的妻子喜欢——他将太多的资金花在他的“梦想”中了。"
 ufc_situations.5030.a.tt:0 "多米尼克·哥伦布在短时间内估计是生不出孩子了，短时间内。"

 ufc_situations.5035.title:0 "世纪之冬：荒岛野人"
 ufc_situations.5035.desc:0 "金曜日，我们只能用这个名字来暂时称呼这个野人，他是爬在一块木板上漂流进马拉加港口的。顺带一提，金曜日是阿拉伯历法中的每周的第五天，与金星对应，也就是基督徒口中的星期五。因为他是在雇员们在金曜日聚礼的时候被发现而叫了这个名字。\n\n野人的样貌十分粗放，衣着更是简陋，他甚至无法适应我们递给他的体面的服装，完全符合我们对于那群遥远的来自蒙古的恶魔的想象，但显然他的文明更加落后一些。“金曜日”刚到时处于稍有溺水的状态，简单的医学处理就保住了他的性命。在简单的进食与饮水后，“金曜日”的紧张与攻击性略显缓和。他的语言没有任何人能够理解，联合果品公司的学术部很快令专员对“金曜日”进行了收容与观察。\n\n他的语言即使最博学的教育专员也不曾熟知——虽然有语言学家推测是柏柏尔语，但他似乎能够通过手势与图案来分辨我们的意思并给出反馈，他具有文明的礼仪性行为、模仿行为与基本社交能力，能够表现出忧郁、愤怒等情感，这说明他并非在智力上存在阻碍。教育专员尝试教他一些阿拉伯口语与通俗拉丁语口语，并用绘画符号与实物来表达意义，他的学习效果比较迅速，相信董事会很快就可以用简单的语言进行交流。"
 ufc_situations.5035.a:0 "suspicious civilization person-001 “金曜日”，持续观察中。"
 name_ufc_vendredi:0 "金曜日"
 ufc_situations.5040.title:0 "世纪之冬：怒从心起"
 ufc_situations.5040.desc:0 "虽然学习通俗拉丁语的时候表现得不是很明显，但当“金曜日”听到一个卡斯蒂利亚人说话时，他表现出了异常的兴奋和攻击性。悲伤与愤怒的情绪和一些难懂的词汇——我们的教育专员认为是他们语言中的辱骂，当然联合果品公司对这种言论保留意见——开始从他整个人身上迸发出来。在教育专员强行将“金曜日”隔离后，他表现出了沮丧与不安，并努力尝试用刚学会的一些新词来表达憎恨。\n\n“金曜日”会站在马拉加的港口眺望海的另一边，为我们的教育专员用手点指，并在沙滩上用木棍画出一些关于家、住所和小人的图案。根据“金曜日”的表达与教育专员的推测，他的家乡应该是海上的一个未知的孤岛，且不会离岸过于遥远。卡斯蒂利亚人（也可能是葡萄牙人或阿拉贡人）可能对这座岛屿施加了屠杀或什么暴行，而此人很可能是一个幸存者。\n\n我们应该安排人手打探一下消息，看看伊比利亚半岛上那群无恶不作的基督徒最近有什么军事行动。"
 ufc_situations.5040.a:0 "派遣一位贸易大使，暗中打探此事。"
 ufc_situations.5040.a.tt:0 "在卡斯蒂利亚拥有至少30间谍网以推进剧情。"
 ufc_situations.5045.title:0 "世纪之冬：先民遗恨"
 ufc_situations.5045.desc:0 "“金曜日”告诉我们他的名字是，呃，“塔博纳”，是他们语言中黑曜石的意思；他是一名，呃，关切人，我们大概可以这样称呼他的族群；他们原先生活在，呃，特内里费岛上，我们大概可以这样称呼他的家乡。\n数年前，卡斯蒂利亚王国的一支海军征服了加那利群岛，而其中最大的一个岛屿就是他的家乡。\n\n加纳利群岛位于摩洛哥西边的海洋上。早在1341年，热那亚的一些航海家就发现了这片岛屿，但一直以来都没有国家宣称过它的主权。也不曾有人认为这里有什么价值。数年前，卡斯蒂利亚海军征服了这片无主之地。大量关切人被屠杀、强制移民、皈依、通婚与强迫劳动，而“金曜日”正是那场一边倒的战役中的幸存者。\n\n我们不知道应该怎样安排“金曜日”的命运，是把他送回他的家乡吗？送回那个如今都是侵略者的小岛，去埋葬他的家人与族裔的尸骨，去照看无人问津的关切木乃伊，去用濒死的关切语在礁石上刻下最后的文字吗？“金曜日”十分迷茫，就像无数个穷途末路之人来到联合果品公司一样，如今的他也是无家可归了。\n\n另一方面，自法蒂玛太皇太后时代脱离阿尔罕布拉宫的掌控后，联合果品一直以来都始终希望获得属于自己的土地以获得稳定的商品源。加纳利群岛的征服给我们带来了一个教训与启示——在遥远的大海上，我们或许能够找到更大的宝藏。"
 ufc_situations.5045.a:0 "“金曜日”再经过简单的训练就可以跟着商队运货了。"
 ufc_situations.5045.b:0 "让“金曜日”担当一名普通的水手，大海才是他的家。"
 ufc_situations.5045.c:0 "想干死那群基督徒吗？来信仰志愿者办公室报道。"
 ufc_situations.5050.title:0 "世纪之冬：西洋传说"
 ufc_situations.5050.desc:0 "“金曜日”在联合果品公司的生活还算顺风顺水，他如今已经可以顺利融入我们的社会，在联合果品公司开启他的崭新生活了。\n\n令人可惜的是，“金曜日”似乎没有在少年时接受过良好的教育，这使得他并没有表现出超出常人的敏捷思维。虽然他无法在文明的社会中打造出属于自己的一片天地，但至少作为唯一的关切人，“金曜日”在公司中人气相当高涨，而他也不反感周围同事这种“参观”式的审视。\n\n“金曜日”在闲暇之余，偶尔会被邀请到总部大厅里和那帮不学无术的行政专员们谈天说地，他曾经聊及他祖先的一些神话，据说在大海的西边还有一片广袤的大陆。只要我们穿过风暴、海怪与塞壬的大洋，就能探索到那片沉没着黄金与宝藏的遗迹。这些小故事大家多是一笑置之，毕竟相比于这些天花乱坠的传说，我们更愿意相信西边能够到达我们熟知的印度和中国。\n\n“金曜日”在联合果品公司的时光平静地流淌着，每个人都还想往常那样艰难生活着。#G 但至少，这次我们拥有了如何和原住民交流的经验。#!还有#R 殖民#!——我们想到了这个新词汇，这是联合果品公司未来的野心。"
 ufc_situations.5050.a:0 "我们如何相信他的故事？活下去就是最大的期望了。"

 ufc_situations.5055.title:0 "世纪之冬：异地而居"
 ufc_situations.5055.desc:0 "波拿巴特家族在佛罗伦萨已经撑不下去了，这个默默无名的小贵族已经实际上沦为了没有头衔与权力的市民阶层。\n\n波拿巴特家族在一百年前成为佛罗伦萨郊区的一个小领主，传承至今只剩下卡洛·波拿巴特和他的孩子。卡洛的父亲与兄长在黑死病中全部罹难，荒芜的土地和衰弱的城市贸易开始将这个本就拮据的小地主逼上绝境。当土地的收成供养不起他的侍从，卡洛只能开始变卖家产与地契，但这种事情更如抱薪救火，直到他卖出了自己渺小的头衔来给家庭带来最后的支持。\n\n卡洛如今也是有些白发苍苍了，为了家族的未来，或许是时候离开这片荒芜的土地了。听说热那亚控制的的科西嘉岛上，热那亚政府与联合果品公司合作建立了一个小型贸易站。那里或许有一些工作机会。波拿巴特家族的余财尚足够在这偏远的岛屿上置办一份地契，至少，也可以将这个微小的贵族头衔传承下去。\n\n至于未来，卡洛已经不知道自己能否见到明天的太阳了，相信后人的智慧吧。"
 ufc_situations.5055.a:0 "活下去难，体面地活下去难上加难。"



 ufc_situations.6000.title:0 "主要事变：双月之诗"
 ufc_situations.6000.desc:0 "永不停止探索，永不停止革新，永不停止变化——唯有流水不腐。\n\n老人的摊位已经许久不曾有人光顾了。原因很简单，老人卖的是各种手抄的书籍，而在清真寺与宫廷外鲜有读得懂阿拉伯文的人群。老人就这样一个人读着抄本，周围的闹市他视若无睹，而此时的老人已经饱经风霜，只有眼神中保留着一分浓郁的色彩，想必他年轻时也是个才华横溢的伊玛目法官。\n\n今天又是空荡荡的一天，没有任何变化。该收摊了，老人不紧不慢地收拾着，他的手碰到了一册用泛黄的埃及莎草纸装订出的书卷。他的手颤抖地缩了一下，又轻轻将这卷放在了箱子最底下。“总有一天会有人来买的，总有一天。”"
 ufc_situations.6000.a:0 "那本双月诗集，总有一天会再次找到它的主人。"

 ufc_situations.6005.title:0 "双月之诗：苇丛之子"
 ufc_situations.6005.desc:0 "苇荡寒风逆，天苍客旅人。[target_character.GetNameWithNoTooltip]和他的商队们行走在回马拉加的归途中。天气有些清冷，这在西地中海沿岸的冬天其实并不罕见。虽不至于成冰，但空气中每一点寒意还是给整个商队的前行带来了不少阻力。突然，商队里有人感觉到了，感觉到了孩子的哭声，似乎在河流入海口边上那枯败的芦苇丛中。有好事者打了个机灵，提了提麻木的身子赶去察看，果真有个被冻得发青的婴儿。真主怜悯，[target_character.GetNameWithNoTooltip]连忙跑来看这婴儿，是个刚出生不久的小男孩，没有人知道他的母亲在哪里。\n\n先知穆罕默德也是孤儿出身，在穆斯林的眼中，领养孤儿是被鼓励的，恰逢[target_character.GetNameWithNoTooltip]的一个家仆膝下无子，便让其领养了这个孩子。\n\n流水从婴儿的身边流过，空气中的寒意似乎有一丝温暖。商队们挺着风进了马拉加城，再过些日子，春天就要来了。"
 ufc_situations.6005.a:0 "忽闻云舞曲，送我入春城。"

 ufc_situations.6010.title:0 "双月之诗：车尘马足"
 ufc_situations.6010.desc:0 "小婴儿的身世无从得知，也不知其父系姓名，便先取了阿卜杜拉（意为：真主之忠仆）为名，再按照家仆的姓尚且先冠了姓氏，但父系上不以父子相称。\n\n小阿卜杜拉在奔波与劳累中牙牙学语，总是对一切都充满好奇心；又喜欢偷偷爬到、走到人们看不见的地方去，总是令人担心。家仆很偏爱这孩子，总是带着小阿卜杜拉奔走于集市与人群之间，和形形色色的人打趣说话，孩子也对各种语言充满了兴趣。\n\n总之，联合果品商会和各个贸易集市成了孩子认识世界的天堂，在他理解养父的含义之前，小阿卜杜拉说出的第一个词汇是“杜卡特”。"
 ufc_situations.6010.a:0 "这孩子长大后一定是个精明的商人！"

 ufc_situations.6015.title:0 "双月之诗：正字童子"
 ufc_situations.6015.desc:0 "联合果品商会所垄断的集市可以说是除清真寺外最是“往来无白丁”之所了，这里商人们的识字率至少在四分之一以上。普通的商人们会在商旗上画上所售之物来作为招牌，但这只是对于平头百姓而言易于理解。若是服务对象包括了王公贵族或是哪个大寺的伊玛目们，那么文字就是区分这些高级摊位最好的招牌，有时甚至一些简单的拉丁文也会为热那亚或是卡斯蒂利亚的买主指明方向。\n\n小阿卜杜拉就是在这样的环境中长大的，他喜欢辨认各个招牌上的文字，来对应现实生活中每个令人好奇的事物，虽然有时错误的写法和奇怪的方言总是让小脑瓜晕头转向。"
 ufc_situations.6015.a:0 "如果你的招牌被一个三岁顽童说写错字了，那么最好是请个学者检查一下。"

 ufc_situations.6016.title:0 "双月之诗：算术教育"
 ufc_situations.6016.desc:0 "小小阿卜杜拉晚上寄宿在养父的家中，而白天则穿梭于马拉加的总部与市场之间。闲来无事的商人便会带上他去市场里，在摊位上当一个吉祥物。\n\n模仿是孩子的天性，而社会化教育给了小阿卜杜拉无限的可能。很快人们就会发现，这个四岁的小吉祥物开始模仿大人们数数、算账。真是令人惊讶！"
 ufc_situations.6016.a:0 "这有什么了不起的，法兰西的孩子天生就会计算4*20。"

 ufc_situations.6020.title:0 "双月之诗：公平交易"
 ufc_situations.6020.desc:0 "当老人抬眼看见一个四岁大的孩子在逛他的书摊时，那浑浊了四十年的眼睛瞬间染上一丝碧澄。“你看得懂阿拉伯文？”老人托起佝偻的背，挑目看了看眼前这个稚嫩的孩子。小阿卜杜拉不知道，他懦懦地回答道，他只看得懂招牌上的字。老人笑着问到，“你的父亲在哪儿？是哪个清真寺的伊玛目吗？”小阿卜杜拉摇摇头，他不知道父亲是谁，只有从小就在身边的叔叔。老人不再言语，继续看他的书。小阿卜杜拉就扫视着书摊上看得懂抑或是看不懂的文字。\n\n“想要哪一本？长大后就能看懂。”老人轻轻言语着，孩子的眼神慢慢瞥向了角落中最不起眼的那一册——“两个……月亮……”孩子慢慢念着，这是这一摊晦涩的辞藻中他所能感知到最温柔的词汇。老人瞥了一眼书摊，猛一抬头，盯着孩子的眼睛。小阿卜杜拉吓得一激灵，被盯着让他很不舒服，怯怯指着那个泛黄的册子答应道：“这个……可以吗？”见老人还在盯着自己，孩子又马上低下头去。\n\n老人意识到自己对一个孩子有些失态了。他怕孩子本能地跑掉，于是又轻轻问道：“好孩子，你叫什么名字？”\n“阿卜杜拉”声音中有些害怕。\n“父姓呢？”\n“不知道，我说过我不知道父亲是谁。”\n老人顿了一下，语气缓和了许多，“真主保佑你孩子，你有多少钱？”小阿卜杜拉摸了摸手中一枚汗津津的银币，轻轻地举给老人看，那是一个四岁多的孩子在十天里跟着商人们跑来跑去赚来的钱。\n“好，这本双月诗集正好卖一个银币。”老人顿了一下，伸出苍老的手接过那一枚钱，又颤抖着把那本册子递给孩子。“公平交易！好孩子阿卜杜拉，真是个好孩子，阿卜杜拉·伍麦叶。”"
 ufc_situations.6020.a:0 "小阿卜杜拉接过册子，他还要许久才能看懂现在他看不懂的那些文字。"

 ufc_situations.6025.title:0 "双月之诗：潜移默化"
 ufc_situations.6025.desc:0 "那本双月诗集是小阿卜杜拉最喜欢的书了，它被时刻装在随身的麻布袋里，用厚厚的粗布包裹着。小阿卜杜拉每新认识几个字，次日就要去书上探寻一番。当真正认识两行文字时，第一次被诗歌的韵律感洗礼过的感觉更是令他激动不已。\n\n不知道从何时开始，同龄人玩伴们开始对自己毕恭毕敬——从前小阿卜杜拉才是经常被气哭的那一个。小阿卜杜拉不经意间感觉自己被起了什么外号，像是“伍麦叶之嗣”之类的。他问商人们谁是伍麦叶，穆斯林商人总是开始颂先知之名，而基督徒商人则是对这个名号嗤之以鼻。小阿卜杜拉也不必多问，他只知道自己的外号可能是伍麦叶什么的，而更多的精力要去用在探索他不知道的新事物——比如哪个商人又买进了什么奇珍异宝，比如哪个地方又经历了新的饥荒，再比如马拉加的街头似乎有个卖抄本的老头去世了，名字被商会从名册上除去，世间再无人提及。"
 ufc_situations.6025.a:0 "当人们以姓相称时，伍麦叶第一次体验到了尊重。"

 ufc_situations.6030.title:0 "双月之诗：急转直下"
 ufc_situations.6030.desc:0 "科尔多瓦，安达卢西亚曾经的都城，商会所控制的市场仍然诉说着那段辉煌的过往。六岁的伍麦叶喜欢探险的性格让他六年以来的好运气走到了终点——他走丢了。伍麦叶朦胧之中想起自己跟着联合果品的商队在市场的一股人潮中走散，不知为何自己忽的被迷了双眼；当他睁开双眼时，他已经身处一个被火舌包围着的砖石作坊中了。联合果品公司的养父与伙伴们不知道去了哪里，而陪伴着他的只有紧握着的麻布袋。\n\n这里是一个伪装成孤儿院的黑砖窑。伍麦叶成了一名童工，每天要起早贪黑做工，否则就要挨鞭子。他在联合果品时曾见过被贩卖的基督奴，他幼小的心灵不清楚这些人究竟犯了什么错误才会做如此卑贱的奴隶，而如今的他自己也体会到了这种感觉。砖窑的主人是一个五大三粗的中年人，是个科尔多瓦郊区的小市民，每天最大的乐子就是向他手下不好好工作的孤儿啐一口吐沫。\n\n伍麦叶想回家，但他不知道自己的家在哪里。此时已过深夜，儿童们还在做着烧炉的工作，升腾的烈焰烤得这六岁的孩子心头冰冷。最近卡斯蒂利亚王国与南方穆斯林的关系急转直下，一个迷失他乡的孩子又能在这场风暴中硬撑多久呢？小伍麦叶只能紧紧抱着他的麻布袋睡去，明天又是黑暗的一天。"
 ufc_situations.6030.a:0 "可这炭火堆是冬天最后的家了。"

 ufc_situations.6035.title:0 "双月之诗：茕茕孑立"
 ufc_situations.6035.desc:0 "小伍麦叶在砖窑的日子里，劳动并非一个孩子肩上最沉重的包袱，相反，对他最大的压迫是孤立。\n\n首先，小伍麦叶很少和其他孤儿们说话。这大多是因为语言不通，当砖窑老板下达命令或者其他孩子们说着通俗拉丁语方言时，小伍麦叶只能静静在一旁倾听，努力根据语境猜测每个词汇的含义。\n其次，是生活习惯与文化。小伍麦叶耳濡目染的文化风格和这个基督教社群略有参差，他必须学着放弃一些教法礼拜、饮食风格来融入这个集体，孩子甚至为自己起了一个天主教的名字。\n第三是性格使然。相比于活泼好动的孩子，小伍麦叶更喜欢安静的环境，他的麻布袋里装着一些绘本和诗集，韵文和歌唱对于孩子而言别有一番乐趣。然而，小伍麦叶爱玩的天性比起像一阵小旋风的孩子们有过之而无不及。\n总之，小伍麦叶每天要处理的就是如何活下去，并解决自己的孤独。他对自己能否受到孩子们欢迎怀有疑虑，但至少只要他能够展现与众不同之处，迟早会找到伙伴。"
 ufc_situations.6035.a:0 "毕竟，小伍麦叶是这群孩子们中唯一识字的人。"

 ufc_situations.6040.title:0 "双月之诗：形影相吊"
 ufc_situations.60405.desc:0 "在砖窑主人的评价里，七岁的小伍麦叶是个憨厚老实的孩子——但这是他装出来的。每当得到了砖窑主人的奖赏，孩子的心里和抹了蜜一样甜，外表却要装成不置可否的样子。小伍麦叶很喜欢这种感觉，这无疑是一个七岁的孩子内心中最是妙不可言的事情。\n\n然而，除此之外，小伍麦叶的生活中大多是沉浸在炉灰与粉尘之中的。每天七岁的小伍麦叶要做十二个小时的工作，从清理炉灰到搬运砖石，劳动对于七岁的孩子而言已经是压在肩头的一座大山。在工作外的时间里，小伍麦叶最大的期望就是每天唯一的一餐后的那段游戏时间，然后沉沉睡去。\n\n然而，即使是游戏时间，小伍麦叶也发现自己处于危机之中。其他的孤儿们更喜欢相互玩耍，而他自己更多时候是热脸贴着冷屁股。虽然其他孤儿们还不太能理解什么是孤立，但小伍麦叶总是形单影只的那一个。小伍麦叶能意识到问题出在哪里——他是一名所谓的穆斯林，是南方来的“糟糕的族群”。但小伍麦叶理解不了的是，他们每天都吃着一样的糟糠，干着一样的苦力，信仰与文化究竟是怎样把孩子们分割开来的呢？"
 ufc_situations.6040.a:0 "这是孩子第一次理解“阶级”这个词的含义。"

 ufc_situations.6041.title:0 "双月之诗：信仰崩塌"
 ufc_situations.6041.desc:0 "在黑砖窑伪装着的孤儿院里，小伍麦叶必须接受信仰与文化的考验。周围的小伙伴们都是土生土长的卡斯蒂利亚的基督徒，而作为一名在联合国品公司的市场里长大的孩子，伍麦叶必须伪装自己的文化与信仰来使他表现得更加合群。\n\n文化并非是什么难题，经过后伍麦叶王朝数百年的统治，伊比利亚半岛上的文化观念十分相近，而那些贵族的服饰与器具的差异在孤儿院里几乎无需考虑。相比之下，宗教礼仪与生活习惯对伍麦叶的生活影响很大。无论是清规戒律、日常礼拜还是苏菲派的精神追求，小伍麦叶从小耳濡目染的那些穆斯林教法与习俗潜移默化地塑造着一个孩子的生活习惯。然而没有伊玛目的解经，他随身带着的是一本诗集而非古兰经，这个七岁的孩子只能自己解释教条，来适应与基督徒一起的生活。在这年的圣诞节前夜，许久未沾荤腥的小伍麦叶终于喝到了漂着猪油的汤。他没有感觉有什么“不干净”的，只感到一个正在成长期的青少年对一点点油脂的渴求。\n\n然而，没有人为小伍麦叶灌输宗教教义，那些墨守成规的规矩就会被一个天真的孩子怀疑。至大的安拉，或是基督徒口中全知全能的上帝，他究竟为何不对这个，不，是这群无辜的孩子赐予怜悯？每隔两三个月，伍麦叶都会看到这里有瘦骨嶙峋的十几岁的少年少女被奴役至死，残破的躯体被丢在山谷中草草掩埋，劳累、饥饿与精神崩溃让这里笃信神明的孩子们一个接一个地离开了这个世界。他们真的去往天堂了吗？小伍麦叶不知道，他只知道死亡很可怕。"
 ufc_situations.6041.a:0 "对小伍麦叶而言，活下去不能依靠神，只能依靠自己。"

 ufc_situations.6045.title:0 "双月之诗：苦中作乐"
 ufc_situations.6045.desc:0 "小伍麦叶八岁了，他本就带一些棕红的柏柏尔人色彩的皮肤在炉灰的浸染下更加土气，双手也失去一个本该属于孩子的稚嫩。在科尔多瓦城郊的这座砖窑里，小伍麦叶依旧过着苦命的生活。\n\n然而值得一提的是，小伍麦叶在孤儿们之间的人气突飞猛进地提升。这完全是由于小伍麦叶发明了一种新游戏，在男孩子之间非常流行。每到餐后的休息时间，小伍麦叶就和伙伴们聚拢在一起，用石头和树枝在砂地上画出他们想象出的伊比利亚半岛的地图（实际上与现实完全不符），然后各自扮演着国王与埃米尔调遣步兵与骑兵进行战斗推演。相对于目不识丁的伙伴们，在六岁前学过一些简单的算术知识的小伍麦叶简直就是孩子们中最耀眼的存在。\n\n然而，不久后这个孩子们最后的快乐就被砖窑的主人剥夺了，理由是影响工作效率。"
 ufc_situations.6045.a:0 "当你感受不到快乐，那么你一定在为别人的快乐负重前行。"

 ufc_situations.6046.title:0 "双月之诗：战略大师"
 ufc_situations.6046.desc:0 "小伍麦叶在他创作的游戏《安达卢西亚风云》中总是扮演者一位战略大师的角色。在他的游戏里，土堆之上画出的地图是战略地图，而贵族之间的战争则由淘气的男孩们亲自扮演。\n\n伍麦叶没有其他男孩们那样强壮，但比起长时间扮演那些碌碌无为的国王与埃米尔，他有时也想成为一名披坚执锐的战士——那是一个八岁的男孩与生俱来的梦想。\n\n他要去和其他男孩们比拼体力吗？"
 ufc_situations.6046.a:0 "做好大脑就可以了，身躯会自己行动。"
 ufc_situations.6046.b:0 "一名指挥官也应该熟悉战争的细节。"

 ufc_situations.6050.title:0 "双月之诗：恶有恶报"
 ufc_situations.6050.desc:0 "一直以来，小伍麦叶都在计划两件事情，长远的是怎样逃出去，而眼前的则是羞辱一下砖窑主人那个死胖子。而转机发生在科尔多瓦的本地贵族的查税员来砖瓦工坊中收税的那一天。\n\n当粗胖而狡猾的砖窑主人向查税员虚瞒错报时，他并没有料到孩子们之间会有一个会算账的，竟还是平时最为憨厚老实的小伍麦叶。小伍麦叶不时向查税员提醒砖窑主人的瞒报与漏算，这可把这个脑满肠肥的小市民气得不轻。正想把叽叽喳喳的孩子们关进后院时，查税员对这个真正的机灵鬼产生了兴趣，示意要他留下来。报税过程在这个九岁的孩子的监督下继续，也因此砖窑主人今年多上缴二十个第纳尔。\n\n报税结束后，出于好奇，也为了这孩子不被主人报复，查税员提出以十一个银币的价格把这孩子带回贵族官邸，砖窑主人自然是同意把这个“害群之马”扫地出门。虽然小伍麦叶也想解放更多的孩子们，但就连本地贵族也对雇佣童工一事睁一只眼闭一只眼。\n\n“蒙真主或是那上帝庇佑——如果你真的全知全能的话。总有一天我要把所有人都救出来。”小伍麦叶这样赌气地想着，虽然两年前他是最被孤立的那个人。他坐上了回到官邸的马车，紧紧抱着他的麻布袋，正如他来时那样——那里放着那本皱巴巴的《双月诗集》。他所不知道的是，在这些孤儿们长大成人之前，他们的结局大多是在这里将生命燃烧殆尽，所能求得自由之人十不存一。"
 ufc_situations.6050.a:0 "可自由的秘密，就在他胸口紧抱着的麻布袋之中。"

 ufc_situations.6055.title:0 "双月之诗：寄人篱下"
 ufc_situations.6055.desc:0 "拉曼却的阿尔卡萨尔德圣胡安堡男爵的宅邸，小伍麦叶的马车停在了这里，这里是他未来几年的新家。虽然拉曼却泛指围绕着托莱多周围相当大的土地，而男爵只是一个市镇之主，但小伍麦叶只能记住这个名字，因为拉曼却是阿拉伯语中的旱地的意思。\n\n第一眼见到小伍麦叶时，拉曼却男爵以为他是个本地某个贵族或者市民家庭走丢的孩子。首先，小伍麦叶常年被砖窑的灰尘染得灰头土脸，掩盖了那一身来自柏柏尔人血统的棕色皮肤；其次，小伍麦叶在卡斯蒂利亚的四年中学到了不少伊比利亚通俗拉丁语，甚至给自己起了个基督徒的名字。若不是拉曼却男爵检查小伍麦叶的行李中有一本书写着阿拉伯语的书册，他断然不会相信这是个来自格拉纳达的孩子。\n\n当得知孩子的“伍麦叶”的绰号时，拉曼却男爵倒吸了一口凉气。这位伊比利亚的落魄贵族自然明白这个名字的含义，但想到对方不过十岁，男爵自然放松地使用起了这个绰号，因为小伍麦叶并非严格意义上的穆斯林。小伍麦叶没有延续伊斯兰的传统进行每日五次礼拜，而是学着基督徒一样做餐前祷告。拉曼却男爵也因此没有在宗教礼仪上为难孩子，“伍麦叶”的名字也自然被允许保留了下来——毕竟一个非伊斯兰教的伍麦叶又有什么可怕的呢？\n\n小伍麦叶的聪慧给拉曼却男爵的家族留下了深刻印象。他会基本的算术，懂得两门语言并识得文字，甚至偶尔会像吟游诗人那样说两句韵词，这可不是平民的孩子能够掌握的素养。拉曼却男爵决定让他给的儿女聘请的家庭教师加个班，毕竟没有人会眼睁睁看着一个聪明的孩子错失受教育的机会。"
 ufc_situations.6055.a:0 "小伍麦叶的麻布袋鼓鼓囊囊了起来，那是这周的作业练习。"

 ufc_situations.6060.title:0 "双月之诗：贵族教育"
 ufc_situations.6060.desc:0 "在拉曼却男爵的提议下，十岁的伍麦叶开始系统性地接受教育。虽然他接受的是一个落魄贵族的家庭教育，但这已经是平民的孩子能够触及的顶点了。\n\n落魄贵族也是贵族，虽然名义上伍麦叶担任的是拉曼却男爵的少年男仆，但他与此同时接受的实打实的贵族教育。教育首先覆盖的是贵族礼仪与行为规范。除贵族们之间交往所需的礼节外，一些卡斯蒂利亚本地礼节与基督教礼节都是需要掌握的内容，而伍麦叶有一些安达卢西亚人的行为习惯，他必须尽力改变自己过去的言语与行为方式。\n\n除礼拜日外，伍麦叶每天都要与拉曼却男爵的家庭教师共度半个小时。此外的大多数时间是与男爵的管家在一起处理家务。从晚饭后到睡前是伍麦叶的自由活动时间，他最喜欢做的就是读书，他尤其对《熙德之歌》这类可以游唱的史诗情有独钟，不仅仅是朗朗上口的韵律，还有那些涉及到伍麦叶所熟悉的旧日文化。\n\n礼拜日是男爵一家前往教堂的日子，而伍麦叶会随行跟着。他也曾一两次进入天主教的教堂中与牧师沟通，但最终多是自感无趣而离开。男爵以为小伍麦叶抗拒信仰也并不强求，他猜测只是因为伍麦叶混沌的过往使他对宗教事务甚是冷淡。"
 ufc_situations.6060.a:0 "小伍麦叶并非对信仰不感兴趣；相反，他对不信仰很感兴趣。"

 ufc_situations.6065.title:0 "双月之诗：狩猎事务"
 ufc_situations.6065.desc:0 "在拉曼却男爵的财产中，管理狩猎场是小伍麦叶的一项职责，具体的事务是在管家的指导下喂养那些忠心耿耿的猎犬们。\n\n对于落魄贵族而言，狩猎非但不能算作一种娱乐消遣，反而更像是为数不多的获取肉类食品的手段。他的田产与手工业的赋税少得可怜，隔三差五地能闻到肉腥味全依赖着广袤的狩猎营地。按照教义与习惯，一开始伍麦叶对这些野味也是百般推辞拒绝，直到许久不识肉味的他在饥饿与本能的促使下接受了男爵的一份烤鹿肉。\n\n驯养猎犬的小工作也是妙趣横生，小伍麦叶发现自己很适合与动物们打交道，相比于与诡变莫测的人心，狗狗们的行为更加可以预测。伍麦叶不错的工作让男爵赏赐他一只属于自己的小狗，而这只猎犬寻回的猎物归小伍麦叶所有。\n\n不得不说，与狗狗们的交流对伍麦叶的情感与体质的发育都有不错的帮助。男爵也很乐意见到这个被拯救的小男孩逐渐回归正轨。只有一点他十分好奇，为什么伍麦叶给自己的小狗起名叫佩罗。"
 ufc_situations.6065.a:0 "佩罗就是当地方言里的狗。有人会把自己的狗起名叫“狗”吗？"

 ufc_situations.6070.title:0 "双月之诗：欢喜冤家"
 ufc_situations.6070.desc:0 "在男爵家中寄宿的日子总是充满了幸福，让我们介绍一下小伍麦叶的小伙伴们吧！\n\n首先是拉曼却的圣玛丽安堡男爵，被伍麦叶简称为拉曼却男爵。男爵是一位略有野心但心地善良之人，他偶尔会对领地内的农民减税，对偷猎行为睁一只眼闭一只眼，尽可能地减少对过往商贩的盘剥。男爵不甘心区区为一个市镇之主，却无奈于自己家道中落。他总是寄希望于儿子能够中兴他的家业，至少也能在本地贵族圈子中出人头地。\n\n男爵的老管家，一位七十一岁的老头子，忠诚而又保守的本地人，据说老人在男爵继承其父亲的爵位前就跟随在男爵的身边。\n\n一位精明能干的秘书，也就是当年将伍麦叶从黑砖窑中拯救出的查税员。他基本一人包揽了男爵账目下少得可怜的资产的管理任务，有时上午秘书还在男爵的书库里处理公文，下午就要全副武装去猎场里驱赶那些偷猎者。\n\n爱德华多，男爵的长子，也是男爵的唯一合法继承人。爱德华多尚未成年却已身长七尺，有着令人讨喜的平稳性格，喜欢专心于做自己手头的事情。此人虽不至愚钝，但并不像小伍麦叶那样充满活力，总是一副得过且过的样子。伍麦叶名义上是爱德华多的仆从与伙伴，但玩耍的邀约总是由伍麦叶发起。伍麦叶也曾经向他推荐过自己的《安达卢西亚风云》游戏，但爱德华多并不十分感兴趣。\n\n胡安娜，男爵的小女儿。小胡安娜生了一副漂亮的圆脸，它太圆了如同满月一样。相比之下，胡安娜比她的哥哥要机灵许多，经常得到家庭教师的赞美之词。胡安娜对语言和礼仪的掌握能力很强，她甚至开始学习一些阿拉伯语。然而，胡安娜是被男爵禁止与男孩子们一起玩的，她每天的日常活动就是学习和弹奏一把叫做吉藤琴的小型鲁特琴。那琴声从宅邸二层的书房中飘出，给小伍麦叶的日常带来一份新鲜的色彩。\n\n伍麦叶不会想到，他与这一家人的爱恨纠葛才刚刚开始。"
 ufc_situations.6070.a:0 "性格决定命运，伍麦叶很快就会明白这个道理。"

 ufc_situations.6075.title:0 "双月之诗：游荡诗人"
 ufc_situations.6075.desc:0 "人们总是用“吟游诗人”来描述那些才华横溢却出身贫寒的卖艺者们，而少年的小伍麦叶表现出了吟游诗人的绝大部分特质——除了音乐方面。当人们对伍麦叶十二岁时写下的韵文赞不绝口时，他们发现这孩子五音不全。\n\n伍麦叶从来没有接受过任何形式的音乐教育，他不懂任何一门乐器，也不曾有过学习任何一门乐器的机会。吟唱《双月诗集》中的那些韵文会让他陶醉其中，而身边的人则懊恼不已，因为小伍麦叶哼出来的调子实在是不堪入耳。当老管家郑重其事地警告伍麦叶不要再折腾他的年迈的听觉时，伍麦叶只能唯唯诺诺地不再唱出自己编写的歌谣。\n\n又是一个明媚的春天的清晨，胡安娜的书房中仍然传来悠扬悦耳的琴声，而伍麦叶只能一边给秘书打下手，一边忍住自己吟唱的冲动。在闲时，伍麦叶便会偷偷溜进书房中，去模仿卡斯蒂利亚人的史诗与安达卢西亚的诗歌。伍麦叶自嘲地给自己起了个绰号——游荡诗人，即闭上了吟唱的嘴，行踪不定的小诗人。"
 ufc_situations.6075.a:0 "天才也有他的短板。"

 ufc_situations.6080.title:0 "双月之诗：情窦初开"
 ufc_situations.6080.desc:0 "《双月诗集》中其实有不少晦涩难懂的词句，一部分是因为伍麦叶相当一段时间里都脱离阿拉伯语环境，另一部分则是因为一些诗歌描述着一些风流雅事。不知道是哪一天，伍麦叶突然理解了其中的一些词句。他开始模仿那些描写少年少女的懵懂情愫的诗句，开始为赋新词强说愁。\n\n胡安娜，拉曼却的小女儿，她实在是太漂亮了！她的眼睛像椰枣的核一样温婉深邃，她的脸像椰子一样圆，她的发丝像椰浆一样顺滑——虽然她自己都不知道自己有多美丽。伍麦叶似乎是恋爱了，他会在家庭教师授课时偷偷询问胡安娜的情况，他会在犬舍旁偷偷向二层阁楼上方张望，他会在赋闲时偷听从她的房间中传来的琴声——虽然他是个音痴。\n\n这是伍麦叶的十二岁，那个春天伊比利亚的花开的异常浓郁。但伍麦叶不曾思考过他们之间的出身，宗教与文化差异，任何一项都可以瞬间破灭他那天真的梦幻泡影。"
 ufc_situations.6080.a:0 "幸运的孩子已经获得了本不属于他的幸福，但他还在奢求什么呢？"

 ufc_situations.6085.title:0 "双月之诗：阶层隔离"
 ufc_situations.6085.desc:0 "伍麦叶在拉曼却男爵宅邸的生活可谓是平淡如水。每周与家庭教师会面，在犬舍里喂养猎犬，给查税员的账目计算打下手，自己呆在房间中写诗，和爱德华多一起做简单的贵族式军事训练——这些几乎覆盖了伍麦叶的日常生活中的绝大多数活动，但唯独一项快乐让伍麦叶求而不得。\n\n伍麦叶喜欢玩游戏，不是男孩子们跑跑跳跳的游戏，而是那种画在棋盘上的游戏。还记得伍麦叶小时候自己在砂土上画的《安达卢西亚风云》游戏吗，那个扮演国王与埃米尔指挥战争的游戏，如今已经在伍麦叶的小脑袋中迭代了数个版本。伍麦叶已经学会了用一种黑色的石头来绘制地图，再用可擦涂的砂砾来代表瞬息万变的战场。如今他的游戏已经支持五六个孩子一起玩耍，但问题在于，他没有这么多伙伴。\n\n由于身份差异，拉曼却男爵严禁爱德华多与乡下的野孩子们来往，而伍麦叶作为爱德华多的小男仆，男爵也不愿他与那些平民的孩子们同流合污。尽管伍麦叶数次向男爵请求，男爵最终只允许伍麦叶在礼拜日的下午与那些平民的孩子会面。而这段时间成为了伍麦叶最快乐的时光。"
 ufc_situations.6085.a:0 "在孩子的眼中，没有人比某些人低人一等。"

 ufc_situations.6090.title:0 "双月之诗：风兮舞雩"
 ufc_situations.6090.desc:0 "伍麦叶十五岁的春天，男爵一家举行了一场短途旅行。"

 ufc_situations.6095.title:0 "双月之诗：独行之客"

 ufc_situations.6100.title:0 "双月之诗：冒名顶替"



