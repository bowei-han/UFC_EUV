 ufc_situations.2205.title:0 "旅行商人：新月沃土"
 ufc_situations.2205.desc:0 "在伊本·白图泰完成朝觐后，他的下一个目标是伊利汗国。当时的伊利汗国尚且掌握着波斯地区的大部分领土，沿途历经纳杰夫、巴士拉、设拉子和伊斯法罕，最终抵达中世纪伊斯兰文明的学术灯塔——巴格达，以及丝绸之路西段的起点——大不里士。\n\n蒙古人懂得战争，却不怎么懂得统治。一百年前，巴格达被忽必烈的大军夷为平地，这座自伍麦叶哈里发覆灭后经久不衰的中世纪伊斯兰文明的学术灯塔轰然倒塌。伊利汗国的可汗显然不懂得怎样经营这座蕴藏着巨大潜力的城市，竟草草将都城迁离了这里。但与此同时，这也为我们的商业创造了巨大的空间。这里的蒙古商人想必要么随伊利汗而去，要么随黑死病而去。\n\n相比于巴格达的断壁残垣，直接开城投降的大不里士显然迎接了更好的命运——至少它没有被屠城。这里是传统丝绸之路的重要中转站，其丝绸贸易足以使我们在欧洲赚个盆满钵满。\n\n然而，并非所有消息都是令人鼓舞的。伊利汗国动荡的政局无法保证我们的商队能够得到足够的安全保障，据说在更遥远的波斯东北地区，有个跛子正在骑着骏马狂飙突进。丝绸之路的危险性只会越来越高……"
 ufc_situations.2205.a:0 "巴格达的潜力一定值得我们前往。"
 ufc_situations.2205.a.tt:0 "重建巴格达任重道远，我们的商队愿往之。"
 ufc_situations.2205.b:0 "我们愿意赌一把大不里士的丝绸贸易。"
 ufc_situations.2205.b.tt:0 "大不里士没有经历过蒙古人的屠戮，但到达那里需要翻山越岭。"
 ufc_situations.2205.c:0 "横冲直撞的跛子？谁爱去谁去。"
