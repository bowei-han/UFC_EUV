 ufc_situations.2220.title:0 "旅行商人：一路向北"
 ufc_situations.2220.desc:0 "“（奥尔汗）是突厥人中最伟大的苏丹，其财富、领土与军力最为雄厚。他拥有近百座堡垒，终日巡行其间，每驻守一座堡垒数日，以整顿军政、察看城防。据说他从未在任何一座城池停留满一个月。”——《伊本·白图泰游记》\n\n在从东非海岸返回后，伊本·白图泰曾进行了第三次朝觐，之后穿越安纳托利亚，来到了黑海沿岸。奥斯曼贝伊国是众多罗姆苏丹国的继承者中最为耀眼的，这里拥有精美的集市和宽阔的街道，四周环绕着花园与潺潺的泉水。\n从安纳托利亚北部的锡诺普港出发，伊本·白图泰曾乘船跨越黑海来到了克里米亚半岛，并分别造访了卡法城——那个后来被黑死病诅咒的城市，并最终在金帐汗的行宫中拜访了大汗。白图泰随着大汗的队伍来到阿斯特拉罕。这座城市是游牧部落的商业中心，坐落在一条河流的黑海入海口的三角洲内，这条河流在罗斯语、斯基泰语与波斯语均中称为“湿润之河”，河运十分方便。\n在阿斯特拉罕的不远处，另一座被称为“萨莱”的城市是金帐汗国的首都。然而，据东欧的商人们的小道消息，金帐汗很可能坐拥着两个不同的萨莱城，分别是老萨莱与新萨莱。然而，伊本·白图泰却没有这里曾经有两座“萨莱”城的记忆。我们或许需要再去一探究竟。\n当然，按照惯例，对此行打退堂鼓的商人也不在少数。路途遥远尚且不论，黑死病尚未结束的传言也令人胆寒，更别提金帐汗国混乱的政治局势，还有一个传言在东边横冲直撞的跛子……"
 ufc_situations.2220.a:0 "我们应该去和奥斯曼贝伊国打好关系。"
 ufc_situations.2220.a.tt:0 "布尔萨的海上丝绸是值得贸易的商品，至少这里不在游牧汗国的手里。"
 ufc_situations.2220.b:0 "阿斯特拉罕是整个草原经济的命脉。"
 ufc_situations.2220.b.tt:0 "阿斯特拉罕的发展值得信赖，整个里海的航运都始发此地。"
 ufc_situations.2220.c:0 "我们要去探究一下“两个萨莱”的秘密。"
 ufc_situations.2220.c.tt:0 "如果想前往罗斯地界，新萨莱是一个不错的选择。"
 ufc_situations.2220.d:0 "跟突厥人和蒙古人打交道？饶了我吧。"
