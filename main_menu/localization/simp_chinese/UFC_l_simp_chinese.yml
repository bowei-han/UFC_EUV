 ufc_situations.2210.title:0 "旅行商人：穆哈咖啡"
 ufc_situations.2210.desc:0 "在造访巴格达和大不里士后，伊本·白图泰曾起身前往麦加，进行了第二次朝觐。完成朝觐后，他沿着红海海岸乘坐小船航行至也门。在这里，伊本·白图泰描写了自己造访穆哈、萨那和亚丁港的所见所闻。\n\n穆哈，欧洲人称为摩卡，是红海岸边的一座小港口城市。当伊本·白图泰到来时，他曾见到商人们在贩卖一种棕黑色的豆类，据说是从对岸的埃塞俄比亚帝国传来的。人们将其磨碎成粉，以热水冲泡，其味道香郁，饮用后精神百倍。当地的苏菲派修道院的乌理玛对此情有独钟，作为教法学者，伊本·白图泰自然对此事要辩论一番，然最终被一些医学学者说服。无论如何，这种独特的饮品自白图泰离开也门后再也未曾见过，倘若我们能够说服各国埃米尔允许此物，这将为我们打开无数的市场。\n\n相比之下，萨那和亚丁则是比较保守的选择。这些地区商业贸易及其繁荣，在这里开展一些商业活动定然是比较稳健的选择。\n\n然而，也门地区山地崎岖，更有什叶派异端在此盘踞，此去并非毫无风险，我们必须评估这一可能。"
 ufc_situations.2210.a:0 "我们要去穆哈看看咖啡是什么东西。"
 ufc_situations.2210.a.tt:0 "咖啡的秘密非常值得我们前往。\n注意：本次成功的贸易远征将会降低黑死病的余波的效果。\n注意：我们必须得到咖啡的秘密！\n注意：该选项将影响未来的一些任务。"
 ufc_situations.2210.b:0 "摩西施展分开红海的奇迹后是不是于萨那(Sanaa)登陆？"
 ufc_situations.2210.b.tt:0 "萨那城的商业活动更加稳定。\n注意：本次成功的贸易远征将会降低黑死病的余波的效果。"
 ufc_situations.2210.c:0 "传统港口城市亚丁更值得我们去。"
 ufc_situations.2210.c.tt:0 "亚丁湾是商人们最为保险的选择。\n注意：本次成功的贸易远征将会降低黑死病的余波的效果。"
 ufc_situations.2210.d:0 "近日有童谣说，也门要战斗，我看还是别去了吧。"
 ufc_situations.2211.desc:0 "我们的商队顺利抵达[ShowLocationName('taizz')]，得到了当地政府的授权，可以在这里进行贸易活动。我们的商人偷运回了数株小果咖啡幼苗，我们应当在低温保存一些的同时尝试培育，但由于技术缺失，短时间内不抱有太大的希望。"
