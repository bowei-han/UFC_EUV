 character_title_ufc_cooperation: "董事长"
 UFC_town_hall:0 "联合果品商会大厅"
 UFC_town_hall_desc:0 "联合果品商会的总部坐落马拉加城堡内集市的边沿。每当夕阳渐渐划过马拉加山脉，沉于西边一望无际的大海时，那些从港口、格拉纳达和阿尔梅里亚归来的车队便陆续回到这个货物与账目的集散地。\n劳累了一天的商人们都心知肚明的是，虽然马拉加的集市熙熙攘攘，但无论如何都无法与格拉纳达城市的宏伟建筑群相媲美。然而华美的宫殿与贵族生活不是这群忙碌的商人们目前需要考虑的问题，奈斯尔王室可以收取微薄是商会贸易税，但他们必须保证这份蛋糕永远不会被少数人所享用。当一位平民走投无路时，联合果品商会永远是他赖以生存的最后的救命稻草。\n\n这里鱼龙混杂，这里包罗万象。"
 UFC_town_hall_maintenance:0 "联合果品商会大厅生产方式"
 UFC_trade_post:0 "商会贸易站"
 UFC_trade_post_desc:0 "联合果品的贸易站的格局，是和别处不同的：都是当街一个占满整个巷子的大巴扎，货摊上预备着来自地中海各地的水果、布匹、香料，可以随时买卖。"
 UFC_trade_post_maintenance:0 "商会贸易站生产方式"
 UFC_shipwright_guild:0 "商船集散中心"
 UFC_shipwright_guild_desc:0 "这里雇佣了热那亚的专业造船工和最勇敢无畏的地中海水手们。联合果品商会的每艘商船都从这里下水，当然，如果你想在这些商船上做一些武装自卫措施也未尝不可——当然，数量的最终解释权归商会所有。"
 UFC_recruitment_centre:0 "信仰志愿者办公室"
 UFC_recruitment_centre_desc:0 ""al-ghuzat al-Mujahidin"，即圣战战士，信仰的志愿者，是[GetCountry('GRA').GetName]军事的中坚力量。该团体最早由奈斯尔王朝穆罕默德一世创立，以庇护来自摩洛哥的马林王朝反对派，埃米尔国招纳他们用以抵抗北方基督徒的入侵，在信仰志愿者眼中这是接受保护所应尽的宗教义务。这些人军队内部保持了独立的领导权，直接对将军负责，而将军常常是摩洛哥苏丹的潜在宣称者。\n然而，对于摩洛哥苏丹而言，这何尝不是一种双赢，至少他的反对派们不会在非斯的宫殿和市场上胡作非为。因此，这种略带默契的军事形式在[GetCountry('GRA').GetName]内部保留了下来。\n对于商会而言，收买一些这些信仰志愿者的领队并非难事。只要势力不及干涉埃米尔国的王室内政的地步，奈斯尔王室也会对这些“自卫”行为睁一只眼闭一只眼。"
 UFC_raw_material_collection_center:0 "原材料采集中心"
 UFC_raw_material_collection_center_desc:0 "售卖高价值的原材料是诸多国家乐见其成的事情，但产出的商品能否卖出去就要靠联合果品商人们的主观能动性。如果商会能够支持原材料的销售，想必这里的劳工可以更具有动力。"
 UFC_board_taxation:0 "贸易保护税"
 UFC_board_taxation_desc:0 "联合果品商会没有土地，它的一切财政来源来自于一些商会直属商团的贸易收入，以及对那些“外包”商团收取例如“加盟费”、“管理费”、“咨询服务费”等奇奇怪怪的苛捐杂税，综合称“贸易保护税”——虽然听起来做的事情似乎和那群北非海盗没什么区别。"

 flavor_ufc.0.title:0 "联合果品公司"
 flavor_ufc.0.desc:0 "抛弃传统，塑造未来。\n\n飞船在太空中以亚光速运行着，其上承载着来自太阳系的第三颗行星上的移民。他们离开了旧日的家园，向着“新大陆”航行。\n孩子们静静躺在休眠仓内，他们的意识共同连接到了一个虚拟课堂上。他们的讲师是阿卜杜拉·伍麦叶，一个面容慈祥的白胡子老人的全息投影。这是孩子们最喜欢的历史课，在那遥远的家乡，曾有一段波澜壮阔而风云诡谲的奇幻故事，一段关于传统与未来、剥削与革命的故事。\n然而，理解这些残酷的社会学概念对孩子们而言非常具有挑战性，因此伍麦叶将孩子们的思维信号接入了一部游戏之中，在这里模拟着那颗蓝色的星球上发生的那段往事。\n\n故事的开始，要从到数百年前，伊比利亚半岛上一个新兴的商人公会说起。"
 flavor_ufc.0.a:0 "就这样，故事开始了。"
 flavor_ufc.0.a.tt:0 "欢迎来到联合果品公司模组。本故事纯属虚构，与真实历史无关。如与现实存在雷同，无需怀疑，就是作者在借古讽今。"

 flavor_ufc.1.title:0 "[target_character.GetNameWithNoTooltip]的联合果品商会"
 flavor_ufc.1.desc:0 "她已经许久不知道孤独这个词汇的含义了。阿尔罕布拉宫的深宫，在静谧的油灯之下，本月商会的账目正在过目于这位七十六岁的太皇太后。来自[ShowLocationName('malaga')]的消息总是能给这副在岁月的历程中早已褶皱不堪的面容带来些许欣慰的笑意。这个月给王室的分成至少可以抵消五分之一的宫廷支出。\n\n老法蒂玛已经说不清自己从何时开始成为联合果品商会的名誉领袖，是兄长离世时嘱托给她的吗？或是儿子离世时的遗愿？她想不起来。\n\n十一年前，她的儿子伊斯玛仪一世遇刺；三年前，她的孙子穆罕默德四世遇刺，年仅18岁。期间她亲手阻止了一次又一次的政变企图，同时也亲眼见证了自己亲族一次又一次的悲剧。如今是年仅十五岁的优素福登基后的第三年，外忧内患依旧拷打着这个脆弱的家族。再尽一份力，再尽一份力气罢。\n\n随着联合果品商会的信件一起寄来的是四五个陶罐载着的糖渍果脯。老法蒂玛笑着尝了一小口，那是马拉加蔗糖的沁人心脾的甜味。老法蒂玛小心翼翼地盖上盖子，明天还要给孙子和那帮大臣们尝尝。"
 flavor_ufc.1.a:0 "联合果品公司的百年孤独，自一位百年老人的孤独岁月伊始。"
 flavor_ufc.1.tt:0 "安达卢西亚的土地总是承蒙着女性的恩泽，七十岁以上的那种。"
 flavor_ufc.1.hist:0 "在女性被边缘化的安达卢西亚政治里，[target_character.GetNameWithNoTooltip]的影响力却是举足轻重的。她漫长而跌宕起伏的一生，始终与宫廷阴谋、权力博弈以及王朝守护紧密相连。她是埃米尔穆罕默德二世之女，两位苏丹的妹妹，伊斯玛仪一世的母亲，以及另外两位埃米尔——穆罕默德四世和优素福一世的祖母。她嫁给了她的叔父，并在政治斗争中以母系血脉维持了奈斯尔王室的合法性。\n\n法蒂玛博学睿智、热爱知识，自幼便接受了父亲的精良教养，毕生致力于研究学者与乌里玛的生平与著作。她是那个时代最具有智慧的女性之一，从学术成就到政治手腕上无不精通。\n\n法蒂玛从未体验过退休的老年生活。在八十岁高龄时，她凭借着远见卓识和人脉网络主持修建了nazaries宫殿群，并修缮了阿尔罕布拉宫。法蒂玛逝世时已逾九旬，葬于阿尔罕布拉宫皇家陵园。宰相兼编年史家伊本·哈提卜为她创作了41行悼词，余音绕梁，不可断绝。"
 STATIC_MODIFIER_NAME_ufc_modifier_fatima:0 "法蒂玛太皇太后的野望"
 STATIC_MODIFIER_DESC_ufc_modifier_fatima:0 "我奶奶是老英雄，越活越奋勇！"
 ufc_trade_association:0 "联合果品商会贸易圈"
 ufc_trade_association_desc:0 "联合果品商会影响力能够到达的地区，总是伴随着商队与船员们家长里短的交谈：一批来自热那亚的货物很可能在摩洛哥卖上个好价钱，而格拉纳达的丝绸在纳瓦拉的宫廷中非常流行。\n\n可以说，联合果品商会是整个地中海西岸两个文明交互的枢纽。只要商会的影响力存在一天，基督徒与穆斯林彼此之间的争斗就会稍微缓和一天。"
 merchant_fenderal_impact:0 "贸易影响力"
 merchant_fenderal_impact_desc:0 "贸易影响力是联合果品对于维持贸易体系的掌控能力。在商会时期，它代表了我们作为伊斯兰世界与基督徒文明之间的中间商对地区政治局势的平衡能力；在公司时期，它代表了本部对于旧大陆市场与子公司之间的控制能力；在合作社时期，它代表了中央政府对于分布式生产与商品交换的干预能力。\n在不同阶段，贸易影响力对联合果品公司的影响上不同的，它将成比例反映在我们的#Y 主要政府改革#!中。"

 UFC_LEADER:0 "联合果品商会领袖"
 opinion_ufc_trade_association:0 "联合果品商会贸易圈"
 ufc_gra_payment:0 "阿尔罕布拉税款"
 ufc_gra_payment_desc:0 "联合果品商会的第一桶金来自阿尔罕布拉宫，但不能每一桶金都送去阿尔罕布拉宫。我们必须尽快说服法蒂玛太皇太后缩减奈斯尔王室从商会利润中攫取的大部分资金。只有资本再投入才能保证商会的繁荣。"
 ufc_gra_price:0 "阿尔罕布拉税款"
 ufc_gra_payment_payee:0 "阿尔罕布拉税款受益国"
 ufc_gra_payment_payee_desc:0 "[GetCountry('GRA').GetName]是阿尔罕布拉税款受益国"
 ufc_io.influence_small_ascend.tt:0 "这将使联合果品商会贸易圈的贸易影响力增加#G 5#!。"
 ufc_io.influence_small_descend.tt:0 "这将使联合果品商会贸易圈的贸易影响力降低#R 5#!。"

 rise_of_the_ufc:0 "白手起家"
 rise_of_the_ufc_desc:0 "他生于一枚杜卡特，却又因一枚杜卡特而死。\n联合果品商会起源于奈斯尔王室的法蒂玛与商队的长期合作。她漫长的一生中曾三次将自己的子孙送上[GetCountry('GRA').GetName]的王位，期间操办典礼仪仗，多是最为心腹的商队首领们出力。为了满足各个市场里王室、贵族以及市民的需求，来自格拉纳达、非斯、热那亚甚至是塞维利亚的商人团们之间建立了长期的合作关系，由此打下了坚实的信任基础。纵使再征服运动和伊比利亚诸王之间的冲突不断，商会内部总能保持一种微妙的平衡。\n\n天下并非国王与埃米尔之天下，而是天下人的天下。"
 hint_rise_of_the_ufc:0 "[GetSituationByKey('rise_of_the_ufc').GetNameWithNoTooltip] 提示"
 hint_rise_of_the_ufc_text:0 "该[situation|e]讲述了联合果品公司的白手起家的故事。作为商会阶段的联合果品公司，我们没有土地和原材料，也没有组织生产的能力。特定的[events|e]和[actions|e]或许能够帮助我们解决白手起家时的各种难题。善加利用我们的外交手段和贸易站，扩张我们的贸易圈并保持良好的外交关系。只要我们能够积累足够的资本，联合果品公司定会找到出路。\n\n并非所有创造奇迹之人，与生俱来即是一个奇迹。"
 ufc_custom_trigger_abudula_ummayad_rules:0 "联合果品商会的统治者是阿卜杜拉·伊本·伍麦叶"
 flavor_ufc.2.title:0 "白手起家"
 flavor_ufc.2.desc:0 "它生于一枚杜卡特，却又因一枚杜卡特而死。\n\n联合果品商会起源于奈斯尔王室的法蒂玛与商队的长期合作。她漫长的一生中曾三次将自己的子孙送上[GetCountry('GRA').GetName]的王位，期间操办典礼仪仗，多是最为心腹的商队首领们出力。为了满足各个市场里王室、贵族以及市民的需求，来自格拉纳达、非斯、热那亚甚至是塞维利亚的商人团们之间建立了长期的合作关系，由此打下了坚实的信任基础。纵使再征服运动和伊比利亚诸王之间的冲突不断，商会内部总能保持一种微妙的平衡。\n\n这是因为，天下并非国王与埃米尔之天下，而是天下人的天下。\n人们在这里堆金积玉，人们在这里苟且偷生。"
 flavor_ufc.2.a:0 "生命，自会找到出路。"
 flavor_ufc.2.a.tt:0 "拿上属于你的那枚金币，商船就要启航了！\n开启局势：[GetSituationByKey('rise_of_the_ufc').GetNameWithNoTooltip]"
 UFC_situation_rise_of_ufc_mission_progress:0 "白手起家局势任务进度"
 UFC_SITUATION_CURRENT_MISSION_ONE_TT:0 "主要事变："
 UFC_SITUATION_MISSION_1:0 "主要事变：松弛枷锁"
 UFC_SITUATION_MISSION_1_TT:0 "虽然联合果品商会的初创资金来源于格拉纳达王室，但商团们不能无止境地为阿尔罕布拉宫分红，否则我们的未来发展将无从谈起。我们需要在接下来的诸多事件中说服[GetCountry('UFC').GetGovernment.GetRuler.GetName]太皇太后缩减我们对阿尔罕布拉宫的税款。\n我们每月需要支付总收入的50%，并乘以税款比例作为每月上缴的税款。当前的阿尔罕布拉税款比例为#R [GetInternationalOrganization('ufc_trade_association').MakeScope.GetVariable('ufc_gra_payment_multiplier').GetValue]#!\n\n当我们的税款比例降低至#G 0.05#!以下时，我们将触发相关事件。"
 UFC_SITUATION_MISSION_2:0 "次要事变：百年战争"
 UFC_SITUATION_MISSION_2_TT:0 "英法百年战争为[GetCountry('UFC').GetName]的牟利提供了前所未有的机遇。弗兰德斯的羊毛，波尔多的补给，尼斯的船具……只要有需求的地方，就有来自联合果品的供给。"
 UFC_SITUATION_MISSION_BLANK:0 "暂无"
 UFC_SITUATION_MISSION_BLANK_TT:0 "当前暂无次要事变。"
 UFC_SITUATION_CURRENT_MISSION_TWO_TT:0 "次要事变："
 UFC_SITUATION_CURRENT_MISSION_THREE_TT:0 "阶段任务"
 UFC_MISSION_TEST_TT:0 "当前任务：建造10艘舰船"
 UFC_MISSION_TEST_FLAVOR_TT:0 "海运总得有船吧！"
 UFC_SITUATION_MISSION_TRAVELED_SALESMAN:0 "主要事变：旅行商人"
 UFC_SITUATION_MISSION_TRAVELED_SALESMAN_TT:0 "从马拉喀什开始，途经麦加、大不里士、君士坦丁堡、新萨莱、撒马尔罕、德里、北京，最后回到原点，距离最短的线路是哪一条呢？\n这对于一名旅行者而言或许是不值得在意的问题，但如果这位举世无双的旅行者成为了一名旅行商人，这一问题就需要好好思考了——他的商队需要再次踏上他曾经走过的道路，而这条道路上，遍地却是当年不曾见的白骨与尸骸。\n黑死病实际上对于商业的打击远远比传统经济的打击要大得多，人口、货源与市场需求的断绝使整个商业体系长期处于瘫痪状态。伊本·白图泰，一个伟大而又庸俗的人。他能帮助联合果品商会挺过黑死病的威胁，并走出黑死病的余波吗？\n启用黑死病余波机制，它代表了地中海商业体系的崩溃与重建。目前的黑死病余波的系数为#R [GetSituation('rise_of_the_ufc').MakeScope.GetVariable('rise_of_the_ufc_blake_death_influence').GetValue]#!\n\n注意，这一数值将显著削弱我们的商业收入。我们必须尽快改变现状。"

 flavor_ufc.3.title:0 "被驱逐的信仰志愿者"
 flavor_ufc.3.desc:0 "由于被怀疑刺杀了[GetCountry('GRA').GetName]的前任埃米尔穆罕默德四世，以及优素福一世对摩洛哥马林王朝的示好，近期巴努·阿卜·乌拉家族所领导的信仰志愿者军队遭到了阿尔罕布拉宫的驱逐。这些曾受到格拉纳达雇佣的北非士兵们流落到了马拉加港，不久后就要离开格拉纳达的地界了。\n\n商会的行政专员们讨论认为，这些前信仰志愿者军队对于商会的发展具有战略价值，如果可以收买巴努-阿比-乌拉家族使其为商会效力，将使我们在未来的博弈中多一份筹码。虽然法蒂玛太皇太后无权干涉宝贝孙子的决定，但用一些小小的贿赂让阿尔罕布拉宫对此睁一只眼闭一只眼还是不难做到。"
 flavor_ufc.3.a:0 "就这么办。"
 flavor_ufc.3.b:0 "我们不会为阿尔罕布拉税款再多出一分钱。"
 flavor_ufc.3.hist:0 "1338-1340年间，巴努·阿卜·乌拉家族由于因涉嫌策划刺杀了优素福一世的兄弟而遭到驱逐。以此为契机，马林王朝-格拉纳达的联盟于1340年对卡斯蒂利亚王国宣战。"
 ULLAR:0 "乌拉"
 flavor_ufc.3.a.tt:0 "我们的阿尔罕布拉税款将增加#R 5.00%#!。"
 flavor_ufc.3.b.tt:0 "放弃这一机会。"

 flavor_ufc.4.title:0 "内部剥削"
 flavor_ufc.4.desc:0 "在马拉加联合果品总部的行政专员们，大多都是来自格拉纳达的贵族，没有经历过太多商团们的风风雨雨。与此同时，行政专员们利用特权剥削商团的事情也屡见不鲜，就在昨天，一位来自热那亚的行商因为没有按照礼仪对待格拉纳达贵族——那是联合果品商会守则上一行小小的文字——而被行政专员们所排挤，很快他的名字就在联合果品的名单上被除名。这意味着，这名商人的所有在商会的资产被剥夺，本人被驱逐回热那亚。\n\n幸运的是，这个商人不是本地人，否则按照本地法律非刑即死；不幸的是，这个商人不是本地人，热那亚没有任何法律可以保护他的财产。"
 flavor_ufc.4.a:0 "就算是天堂也有守门人——这该死的官僚主义。"
 flavor_ufc.5.title:0 "没有人是主角"
 flavor_ufc.5.desc:0 "戴着头巾的女人风风火火地闯进马拉加联合果品总部。行政专员从来不曾见过女性来办理商会登记手续，这是一个向来由男性主导的社会，女人们往往只是跟在商人们身边默默无闻的眷属。\n\n女人来自凯鲁万，在伊斯兰社会中，柏柏尔人的女性往往更加独立，而女人从小就是这样，她靠着自己的力气度过了人生的前二十年，而后面的日子则更加吃力——她还需要照顾一个跛脚的丈夫。在她的人生经历中，她自己就是主角，是顶天立地的人，是克服一切困难艰难生存的人。但当她卖掉了最后一份产业给丈夫治疗腿疾后，她的家庭失去了经济来源。凭借着家乡的些许人脉，女人希望能够加入联合果品作为风里来雨里去的行商，这是一个走投无路的女人能够筹到钱的最后选择。\n\n然而，目中无人的行政专员们并没有给这个出身卑微的女人提供任何例外机会——要么带她的瘸腿丈夫来以丈夫的名义登记，要么滚出马拉加。\n\n现实给女人浇了一盆冷水，或许在这个世界上，没有人是主角。"
 flavor_ufc.5.a:0 "为什么要触犯社会的规训呢，可怜的孩子。"
 flavor_ufc.5.b:0 "这不是我们应该标榜的公平，给行政专员们上一课。"
 flavor_ufc.6.title:0 "活着"
 flavor_ufc.6.desc:0 "穆哈已经两天没有进食了，他的产业被地主以不公平的交易兼并，失去自给能力的穆哈最终找到了联合果品商会，这个走投无路之人最后的避难所。\n\n然而，商会也从不是无家可归之人的收留地，凡是饥寒交迫而乞事之人，会在马拉加的街头远远地就被驱逐出去。穆哈本想用最后的钱财买点粮食，但他和自己的本能搏斗了十分钟后方才忍住了。他要去把最后的一笔钱财投资给裁缝铺——忍住两天不曾进食的饥饿也要置办一身体面的行头，如此才能进的了商会行政专员的法眼。\n\n穆哈赌对了，凭借着体面的衣着和三寸不烂之舌，商会给了他一个运输装卸的工作，明天就可以受雇。当穆哈激动地强挺着走出商会总部的大门时，他眼前一黑地昏倒了过去。"
 flavor_ufc.6.a:0 "商人都是赌徒，他已经是杰出的赌徒了。"
 flavor_ufc.6.a.tt:0 "联合果品商会就是由无数个这样的小人物组成的，没有人是主角，而每个人都是主角。"
 flavor_ufc.7.title:0 "亦敌亦友"
 flavor_ufc.7.desc:0 "马格里布的穆斯林封建主们之间的关系总是令人摸不着头脑，国家与国家之间的关系仿佛是两个永远也长不大的孩子，它们会因琐碎的小事而大打出手，也会因为共同的敌人而并肩作战，甚至一方家族的内乱都可以掀起漫布整个伊比利亚与北非的滔天巨浪。\n\n格拉纳达的奈斯尔家族与摩洛哥的马林王朝就是这样不清不楚的关系。但至少目前，卡斯蒂利亚的阿方索仍然给足了双方压力，致使这两个政权暂时联合在了一起。但可以预见的是，这种友谊一定不会长远，至少奈斯尔对于直布罗陀有着不容放弃的宣称权。"
 flavor_ufc.7.a:0 "密切关注此事。"
 flavor_ufc.8.title:0 "引狼入室"
 flavor_ufc.8.desc:0 "船长安德里亚·多利亚躲在颠簸在海浪上的商船上颤抖着。或许是因为海浪，或许是因为激动，又或许是……别的什么不可名状的原因……他不停颤抖着。身后是刚刚逃离的卡法城港口，金帐汗国的可汗已经围困城堡数月了。数日前，城中爆发了一轮罕见的瘟疫，这让守城方和攻城方进入了一种恐惧中——高烧、无力和那标志性的黑疮，空气中浸染着一种无力感。卡法市民行走于大街之上，转眼间就会倒地而死；蒙古士兵士气低落，死亡的恐惧笼罩了整个军营。\n\n凭借着贿赂蒙古海军，安德里亚·多利亚船长和他的水手们冲破了黑海上的封锁线，全速朝着家乡热那亚驶去。回想起卡法城中的景象，船长仍有些心有余悸。他颤抖着，在航海日志上写下“那是用黑鼠和跳蚤向邪神献祭。”船长回了回神，他想起不久之前，这句话似乎和一摊神志不清的达契亚奴隶的临终遗言颇为相似……\n\n船长抖擞了一下精神，去招呼水手们了。他坚信，只要能够逃出来，只要能到达热那亚，一切罪恶、痛苦和地狱般的绘景都将成为过往云烟——直到他的水手们开始咳嗽，身上开始长出黑斑。\n\n船员们没有回到热那亚城，船只在西西里的墨西拿港停靠。他们再也回不了家了。"
 flavor_ufc.8.a:0 "是你把瘟疫引到这儿来的？！"
 flavor_ufc.9.title:0 "静默"
 flavor_ufc.9.desc:0 "联合果品商会向来与热那亚共和国的关系相当暧昧。为了扩张热那亚商人在西地中海的商业渠道，并抑制威尼斯人在北非的扩张，商会和热那亚的商人和水手们缔结了不少契约与协议，如互设商站、雇佣水手、共享情报等等。\n\n但从这周开始，热那亚水手们似乎都翘班了，平时频繁来往的书信也迟迟没有回复。穆斯林商人们气急败坏地辱骂着言而无信的基督徒，定是可恶的热那亚人撕毁了与商会的契约；但很快，商人们的情报网给他们带来了更坏的消息：热那亚水手们不是不想来，而是不能来了。\n\n地中海沿岸的海浪声格外的响，而盘旋着的海鸟的鸣声则比以往更轻。商会的货物囤积在货船之上，货船静静地飘在马拉加的港口边上。今日的马拉加港格外安静。"
 flavor_ufc.9.a:0 "很快，商人们就不必为此发愁了。"
 flavor_ufc.9.a.tt:0 "#R 一个新生的婴儿，出生就面对了死亡。#!"
 flavor_ufc.10.title:0 "直布罗陀战役"
 flavor_ufc.10.desc:0 "与远在东方的金帐可汗围攻卡法城异曲同工，[GetCountry('CAS').GetName]的国王[GetCountry('CAS').GetGovernment.GetRuler.GetName]目前正在直布罗陀城堡前身陷战争泥潭。穆斯林的守军寸步不让，而卡斯蒂利亚的步兵面对着背海的城堡无可奈何。穆斯林信仰志愿者们的援军随时都可能对卡斯蒂利亚军队形成夹击，[GetCountry('CAS').GetGovernment.GetRuler.GetName]必须尽快做出决断了。\n\n[GetCountry('CAS').GetGovernment.GetRuler.GetName]对自己的军事能力颇为自信。他回想起自己登基的那一年，[GetCountry('CAS').GetGovernment.GetRuler.GetName]用残酷的手段处决了所有王位的觊觎者们，包括暗杀他的叔父独眼王胡安。不久之前，他在萨拉多河战役中重创了马林王朝的士兵，使摩洛哥的实力退缩到了直布罗陀海峡的城堡里。[GetCountry('CAS').GetGovernment.GetRuler.GetName]坚信，这次军事行动一定会如往常般顺利。\n\n另一方面，摩洛哥与格拉纳达的信仰志愿者们正在迅速动员军队，增援固守于直布罗陀城堡的守军。队伍懒懒散散地行进着，这些信仰志愿者们大多是拿钱办事的雇佣军，数天之前，瘟疫席卷了伊比利亚和北非，他们的士气也并不高涨。\n\n在这批行军的部队中有个年近半百的中年人，那疲惫的精神与矫健的步伐极不相称。他的母亲在数日前在瘟疫中去世了，他甚至不曾见过母亲最后一面。"
 flavor_ufc.10.hist:0 "格拉纳达的优素福一世的前任穆罕默德四世为了平息国内将领叛乱，并应对来自北方卡斯蒂利亚王国的威胁，曾以直布罗陀附近的诸集镇为代价换取了与摩洛哥马林王朝的结盟。但格拉纳达王国实际上一直没有放弃这些领土的宣称，在相当长的时间内以各种理由请求摩洛哥归还伊比利亚半岛上的土地。他们最后成功了。"
 flavor_ufc.10.a:0 "大难之年，谁又能主宰命运呢？"
 flavor_ufc.11.title:0 "放虎归山"
 flavor_ufc.11.desc:0 "在直布罗陀城堡中固守待援的穆斯林守军已经快撑不下去了。饥荒和瘟疫不断捶打着守军，他们或许撑不过两天了，可信仰志愿者援军何时才能抵达呢？咦，为什么敌军在撤退？\n\n卡斯蒂利亚的国王，阿方索十一世，死了。黑死病夺走了这位野心勃勃的战略大师的生命，他自信而残忍的微笑永远驻留在了他年轻的脸庞上。格拉纳达的优素福一世作为阿方索的宿敌，仁慈地下令禁止信仰志愿者们袭击护送棺木的卡斯蒂利亚军队，使这位老对手的遗体安全返回了塞维利亚。\n\n然而，并非所有人都对这一具有骑士精神的仁慈的决断而感到敬畏，信仰志愿者的队长伊本·乌斯曼兄弟就对此颇为不满，他们认为这是对信仰志愿者兄弟们的背叛，且表现出了一个统治者不应有的怯懦。他们对此发了不少牢骚，甚至被一名客居格拉纳达的学者记载在了史书之中。"
 flavor_ufc.11.a:0 "放虎归山怎么了，那是死虎！"
 flavor_ufc.12.title:0 "怪孩子佩德罗"
 flavor_ufc.12.desc:0 "随着阿方索十一世于直布罗陀城堡之前惨死于瘟疫之手，卡斯蒂利亚的王冠戴在了一个刚成年的孩子——佩德罗一世之顶。但不得不说，佩德罗是一个古怪的孩子，离伊比利亚农民们眼中的圣君相差甚远。\n\n佩德罗一世长得人高马大，体格健壮，少年时期对艺术、音乐和诗歌如痴如醉。他尤其喜欢安达卢西亚的文化，喜欢穿着摩尔人的长袍和头巾。据阿尔罕布拉宫的宫廷传言，佩德罗已经和优素福一世缔结了长久的停战协议，并邀请格拉纳达埃米尔国的信仰志愿者进入卡斯蒂利亚领土协助清理叛军。\n\n联合果品商会的一些善于分析国际形势行政专员们之间总是传言，在未来相当长的时间内，[GetCountry('CAS').GetName]与[GetCountry('GRA').GetName]之间的关系将有所缓和。这也是商会进行扩张的有利消息——如果这场瘟疫能够安然度过的话。"
 flavor_ufc.12.a:0 "这将缔结至少一代人的和平。"
 opinion_ufc_petro_in_cas:0 "睦邻友好"
 flavor_ufc.13.title:0 "隔离政策"
 flavor_ufc.13.desc:0 "阿尔罕布拉宫的文武宰相伊本·哈提卜在最近的医学学术论著《关于黑死病的求生者指南》的手稿中声明，黑死病表现出了一种被称为“传染”的现象，健康人与病人的近距离接触会导致健康人的染病。因此，格拉纳达埃米尔国下令执行严格的隔离防疫政策，所有自给农禁止进入城市，而城市市民也应该尽快实现除粮食外的所有资源自给。\n\n这一纸禁令直接扼杀了整个联合果品商会在格拉纳达的贸易活动，与此同时，世界各国也开始有意识地收紧市场规模。更可怕的是，联合果品商会的一些商人开始拒绝张罗生意。显然，涉及到自身生命时，商人并非总是愿意出售绞死自己的绳索。"
 flavor_ufc.13.a:0 "这对于联合果品商会将是毁灭性的打击。"
 flavor_ufc.13.a.tt:0 "相比于其他行业，黑死病对于商业的打击是致命的。货源的短缺、人口的凋敝与需求的锐减都使贸易受困于中断状态。可以说，联合果品商会出生入死。\n#R 黑死病的余波#!修正将一直持续到我们通过各种事件复苏我们的商业活动，或者#Y 离开#!这片受诅咒的土地。您可以在国家修正中随时查看它的影响。\n#R 所有#!首都位于旧大陆的国家都会受到本修正的影响，数值为此数值的一半。历史上大元的衰亡一定程度上受到了贸易系统的中断的影响。该修正会随时间而衰减，我们将有特殊的事件以逐渐削弱该修正的影响。"
 flavor_ufc.14.title:0 "放松控制？"
 flavor_ufc.14.desc:0 "紧张、压抑、无趣、恐惧，黑死病带给人们的不仅仅是身体上的痛苦，在严格的隔离控制下更是精神上的摧残。不少人群已经开始抱怨格拉纳达埃米尔国的隔离政策，这对于阿尔罕布拉宫里那些整天埋头钻研的没有社交需求的学者而言或许不值一提，但对于社会上的多数人群而言，对社交的屏蔽简直是对生命的亵渎。甚至有极端言论提出，人生在世数十年，难道要因为惧怕大地上的猛兽，就永远困在这枯井中吗？\n\n另一方面，来自阿尔罕布拉宫的一些激进的学者开始讨论免疫学的相关话题，就目前观察与之前各种瘟疫的经验来看，长时间的隔离反而会延长瘟疫驻留的时间，虽然他们并不清楚具体导致这种现象的原因。"
 flavor_ufc.14.a:0 "生命诚可贵。"
 flavor_ufc.14.b:0 "自由价更高。"
 flavor_ufc.15.title:0 "黑死病的余波"
 flavor_ufc.15.desc:0 "当面黄肌瘦的乞讨者从空荡荡的马拉加市场颤颤巍巍地端出“装满”了四分之一个陶罐的食物，人们才战战兢兢地从各自的房屋中探出头来——黑死病过去了。格拉纳达埃米尔国开始松弛隔离政策，商人们开始蹑手蹑脚地试探商业复苏的可能性。\n\n在这乍暖还寒的初春，马拉加的城市开始像齿轮一样转动。一开始是运送食物的车辙印，接着马拉加港口的水面泛起涟漪，然后是大街上稀松的言语，渐渐地那工坊中的铁锤声砸下，人们的脚步声变得沉稳，当联合果品商会的市场上第一声吆喝响起，那阳光穿破了浓云，马拉加新的一日开始了。"
 flavor_ufc.15.a:0 "召集所有#Y 可以联系到#!的行政专员，集会！"
 flavor_ufc.15.a.tt:0 "#R 黑死病的余波#!效果将直接减半，但我们需要大量的时间来恢复往昔的繁荣。但即使这样，人口的锐减很可能造成长时间的经济萧条。我们或许不得不探索一条新的道路，记住，#Y 只有改变，方有生机#!。"
 STATIC_MODIFIER_NAME_ufc_modifier_the_aftermath_of_black_death:0 "黑死病的余波"
 STATIC_MODIFIER_DESC_ufc_modifier_the_aftermath_of_black_death:0 "黑死病摧毁了整个旧大陆的贸易体系，货源的短缺、人口的凋敝与需求的锐减都使贸易受困于中断状态。这可能需要上百年的时间来恢复人口与生产。"

 flavor_ufc.16.title:0 "太皇太后的葬礼"
 flavor_ufc.16.desc:0 "法蒂玛·奈斯尔于今日去世，寿终正寝。\n\n法蒂玛是埃米尔穆罕默德二世之女，两位苏丹的妹妹，伊斯玛仪一世的母亲，以及另外两位埃米尔——穆罕默德四世和优素福一世的祖母。她的一生是自私的，她为了自己的子嗣能够以母系继承格拉纳达埃米尔国而费劲心思，亲手策划与阻止了至少三场王室成员之间的谋杀；而她的一生又是无私的，她所做的一切都是为了家族的事业，而她自己却不曾颐养天年。而她最无私之处，在于创造了独立的联合果品商会。\n\n在七十岁时，为了解决刚继位的孙子优素福一世的财政问题，老太皇太后凭借毕生的人脉资源组织起了一支商队，这便是联合果品商会的由来。在之后的数十年中，她让商会逐渐独立于阿尔罕布拉宫的政治，使其成长为了一个商业共和国的雏形。博学多识的老太皇太后清楚，商业与政治的脱钩才能让它成长；而这又是她的百年遗计，当格拉纳达陷入危机时，它将成为救奈斯尔家族于水火的救命稻草。这是多么自私而无私之人！\n\n太皇太后的遗体于格拉纳达城阿尔罕布拉宫内经祈祷后面向麦加下葬。宰相兼编年史家伊本·哈提卜为她创作了41行悼词，余音绕梁，不可断绝。马拉加的联合果品总部为其举哀三日。"
 flavor_ufc.16.a:0 "真主保佑这位智慧女性的灵魂。"
 flavor_ufc.16.a.tt:0 "联合果品的创建者，法蒂玛太皇太后去世了。她的无私、慈爱与聪慧激励着联合果品的每一代人。\n我们将在主要改革中添加“法蒂玛太皇太后的遗产”，效果为每月共和传统：#G +0.1#!。\n在游戏进行到中期时，所有“遗产”类修正都将被整合为一个新的政府改革中。\n\n另外，“海峡之战”局势中的“遏制格拉纳达主权”行动将解锁！"

 STATIC_MODIFIER_NAME_ufc_modifier_strong:0 "身强体壮"
 STATIC_MODIFIER_DESC_ufc_modifier_strong:0 "此人身强体壮，从未被疾病所困扰过——至少小疾小病从未发生。"



 ufc_situations.1000.title:0 "次要事变:百年战争"
 ufc_situations.1000.desc:0 "伊比利亚半岛上从来不缺乏从北方传来的小道消息：英格兰王国与法兰西王国之间的矛盾一触即发。当金雀花王朝贪婪地觊觎着法国王位的同时，卡佩-瓦卢瓦王朝就阿基坦地区和低地地区的主导权更是寸步不让。\n\n近日，弗兰德地区的羊毛贸易燃起了整个炸药桶的第一星火花。英王试图通过对弗兰德公国禁运羊毛和粮食来改变其对法王的效忠，而迫于羊毛需求导致的叛乱，弗兰德伯爵宣布中立。至此，双方剑拔弩张的态势已经让整个西欧地区的各个势力蠢蠢欲动。\n\n根据坊间传言与宫廷消息，卡斯蒂利亚王冠领倾向于支持法兰西势力，而葡萄牙王国则是英王的铁杆盟友，但至少目前看来这场战火尚且烧不到伊比利亚半岛上来。如果联合果品商会希望在这场不可避免的冲突中攫取微薄的利益，我们应该马上做出行动应对这场一本万利的赌局。\n\n若非我们的商船开不到那里，弗兰德斯能被一捆羊毛压倒吗？"
 ufc_situations.1000.a:0 "白花花的羊毛说不卖就不卖了，作孽！"

 ufc_situations.1005.title:0 "百年战争:法兰西地中海舰队"
 ufc_situations.1005.desc:0 "法兰西海军向来不被认为是英格兰海军的对手，在最近的若干场海上战役中，其表现果然不尽人意，甚至面临被全歼的窘境。\n\n法兰西海军企图在英格兰海军触及不到的地中海重整旗鼓，从尼斯、摩纳哥和热那亚重新组建一支地中海海军，以至于能够与英格兰海军相抗衡。\n\n联合果品商会可以利用这一机会扩张我们在热那亚的造船行业，并以租借的名义为法兰西的海军扩张提供些许便利。"
 ufc_situations.1005.hist:0 "在1340年的在斯鲁伊斯海战中，法兰西舰队在英吉利海峡全军覆没，使得英格兰在数年之中牢牢把握了英吉利海峡。1346年，法兰西决定在尼斯、摩纳哥和热那亚开始重新组建海军。"
 ufc_situations.1005.a:0 "我们可以租借给法兰西在热那亚的造船厂。"
 ufc_situations.1005.b:0 "我们不能得罪英格兰。"
 opinion_ufc_hundred_years_war_approve:0 "支持我们"
 opinion_ufc_hundred_years_war_disapprove:0 "支持敌人"
 opinion_ufc_hundred_years_war_thanks:0 "不支持敌人"


 ufc_situations.1010.title:0 "百年战争:波尔多商站"
 ufc_situations.1010.desc:0 "波尔多市场是我们在英法两军对垒的前线所能触及到的最远的区域，然而就在这里，爆发了英法之间的第一场战火。\n\n对于英格兰来说，阿基坦地区的远洋补给难度相比于诺曼底地区要困难数倍，如果在阿基坦地区爆发战争，他们需要源源不断的食物补给来保证波尔多地区的控制和军事存在。对于法国人而言，他们不会乐意看到联合果品商会给英国人带去任何一批粮食物资，况且在此的贸易活动他们一分税都收不到——除非他们收回波尔多的统治权。\n\n我们必须谨慎考虑是否要在波尔多设立商站了。"
 ufc_situations.1010.a:0 "建设波尔多商站是值得的。"
 ufc_situations.1010.b:0 "我们不能得罪法兰西。"

 ufc_situations.1015.title:0 "百年战争:停战合约"
 ufc_situations.1015.desc:0 "英格兰的黑太子[GetCountry('ENG').GetGovernment.GetRuler.GetName]虽然在斯鲁伊斯海战中取得了关键性的胜利，但之后的图尔奈围城战役中遭遇了法兰西的反包围，他的岳母让娜·瓦卢瓦请求他与法王签订停战协议，以保全双方的颜面。双方在签订埃斯普莱尚停战协议后各自撤军，该协议的生效日期截止到1345年。"
 ufc_situations.1015.a:0 "至少和平利好波尔多与蒙彼利埃的商贸。"

 ufc_situations.1020.title:0 "百年战争:烽火再起"
 ufc_situations.1020.desc:0 "波尔多的几个商人为我们传来了最新的消息：英格兰再次对法兰西宣战了。[GetCountry('ENG').GetGovernment.GetRuler.GetName]兵分三路入侵法兰西，其中波尔多与加斯科涅地区成为主战场。\n\n据我们的行政专员分析，由于黑太子的野心与瓦卢瓦王朝维持正统性的要求，双方都及不可能让步，这场战争或许并不会在短期内结束。但联合果品商会对于双方的干涉实在有限，至少此时此刻，波尔多留守的几个商人已经请求回到马拉加避难了。"
 ufc_situations.1020.a:0 "战争就是商机，他们必须留在那里。"
 ufc_situations.1020.b:0 "人命关天，马上返回马拉加。"

 ufc_situations.1025.title:0 "百年战争:对赌协议"
 ufc_situations.1025.desc:0 "英法之间的战争仍然僵持不下，我们驻留在波尔多与蒙彼利埃的联络人员都返回了重要的信息——双方都在积极筹备着下一场战役，而双方的战争资源仍然紧缺，马匹，武器与皮革都成为市场上的稀缺品。法兰西与热那亚是盟友，因此热那亚的商人在蒙彼利埃的市场上十分活跃，而英格兰则依赖着强大的海军和汉萨的商人在维系着军队开支。本国的商人都被要求禁止出口，违令者已被杀鸡儆猴般处决。显然，想靠着两头倒卖来大发战争财的投机分子们并不受欢迎。\n\n鉴于紧张的局势所产生的大量需求，目前正是联合果品商会做出选择的最佳时机——我们必须选择站边其中一方，派遣我们的商人团进驻蒙彼利埃或是波尔多，为一方提供完整的供应链。倘若我们所签约方获得了战役的胜利，等待我们的将是一个海量的市场与长久的贸易伙伴关系；而如果我们支持的一方铩羽而归，那么恐怕那些大宗商品的账目还款日期恐怕要拖个十年也说不定。"
 ufc_situations.1025.a:0 "支持英格兰！"
 ufc_situations.1025.b:0 "应该把赌注下到法兰西身上。"
 ufc_situations.1025.c:0 "赌徒都没有好下场，这事我们不干了。"
 ufc_situations.1025.a.tt:0 "如果英格兰在本场战争中胜利，我们将获得丰厚的回报。结算后将结束次要事变:百年战争。"
 ufc_situations.1025.b.tt:0 "如果法兰西在本场战争中胜利，我们将获得丰厚的回报。结算后将结束次要事变:百年战争。"
 ufc_situations.1025.c.tt:0 "我们不再干涉这里，结束次要事变:百年战争。"
 UFC_SITUATION_SUPPORT_FRA:0 "下注法兰西"
 UFC_SITUATION_SUPPORT_ENG:0 "下注英格兰"
 opinion_ufc_hundred_years_war_win_the_bet:0 "赢得赌注"
 ufc_situations.1030.title:0 "百年战争:停战"
 ufc_situations.1030.desc:0 "英格兰与法兰西之间签订了新一轮的停战协议，我们在对赌协议中获胜。按照协议，我们收回了数倍于当时投资的商业回报，并且在法兰西西南地区的贸易网络得到了巩固。"
 ufc_situations.1030.a:0 "非常好。"

 ufc_situations.1035.title:0 "百年战争:停战"
 ufc_situations.1035.desc:0 "英格兰与法兰西之间签订了新一轮的停战协议，我们在对赌协议中失败了。我们的大宗商品货款被拖欠了，经过通货膨胀与机会成本核算，我们只能收回大部分成本。无论如何，商人团们都不愿意再在这片荒芜的土地上浪费时间了。"
 ufc_situations.1035.a:0 "该死。"


 ufc_situations.1300.title:0 "次要事变:黄金时代"
 ufc_situations.1300.desc:0 "1349年，格拉纳达埃米尔国的宰相兼任首席王室秘书（即“双宰相”）伊本·贾亚布因感染黑死病而逝世，其弟子伊本·哈提卜被任命为新的双宰相，同时总揽了行政、外交和军事大权。\n\n在伊本·哈提卜的辅佐下，格拉纳达埃米尔国的政治与外交事务均井井有条。伴随着北方卡斯蒂利亚王国对格拉纳达埃米尔国的关系缓和，整个格拉纳达成为西欧黑死病后一段时间内最为繁荣的国家，史称格拉纳达黄金时代。\n\n然而，安达卢西亚给每个泰法诸国留下的诅咒至今仍时而显现——这里的政治斗争依然波谲云诡。伊本·哈提卜虽政绩斐然，然其心胸狭隘，结党营私；马林王朝与奈斯尔王朝的联盟关系摇摇欲坠；穆斯林王朝混乱的继承仍然动摇着整个西地中海的政坛，王位觊觎者此起彼伏；黑死病的余波仍然在这片大地上肆虐……\n\n联合果品商会脱离阿尔罕布拉宫的掌控已有十余年，我们能从格拉纳达的黄金时代与这纷繁复杂的政治斗争中攫取属于商会的利益吗？"
 ufc_situations.1300.a:0 "我们正在见证新的未来。"
 ibn_al_Jayyab:0 "伊本·贾亚布"
 ibn_al_khatib:0 "伊本·哈提卜"
 UFC_SITUATION_MISSION_GOLDEN_AGE:0 "次要事变:黄金时代"
 UFC_SITUATION_MISSION_GOLDEN_AGE_TT:0 "随着格拉纳达埃米尔国的宰相兼任首席王室秘书（即“双宰相”）伊本·贾亚布因感染黑死病而逝世，其弟子伊本·哈提卜根据其遗愿为新的双宰相，同时总揽了行政、外交和军事大权。在其辅佐之下，格拉纳达埃米尔国的政治与外交事务均井井有条。伴随着北方卡斯蒂利亚王国对格拉纳达埃米尔国的关系缓和，整个格拉纳达成为西欧黑死病后一段时间内最为繁荣的国家，史称格拉纳达黄金时代。\n然而，表明的繁荣背后暗流涌动。伊本·哈提卜虽政绩斐然，然其心胸狭隘，结党营私；马林王朝与奈斯尔王朝的联盟关系摇摇欲坠；穆斯林王朝混乱的继承仍然动摇着整个西地中海的政坛，王位觊觎者此起彼伏；黑死病的余波仍然在这片大地上肆虐……\n联合果品商会脱离阿尔罕布拉宫的掌控已有十余年，我们能从格拉纳达的黄金时代与这纷繁复杂的政治斗争中攫取属于商会的利益吗？"
 ufc_situations.1300.a.tt:0 "更新当前激活的次要事变。请在局势：白手起家中查看。"

 ufc_situations.1305.title:0 "黄金时代:恩师之死"
 ufc_situations.1305.desc:0 "我的恩师，格拉纳达的宰相和首席秘书，伊本·贾亚布于昨日与世长辞了。他的灵魂将升入天堂，愿真主宽恕他。\n\n可恶的黑死病，这被诅咒的瘟疫带走了我最敬爱的老师，也带走了我的亲人与朋友。为什么我们的医学与草药对这该死的病症毫无作用？我想我们应该赞助一所规模宏大的医院和伊斯兰学校来进行更加深入的研究。\n\n每每想起我年少之时，恩师教授我阿拉伯文学与诗歌，我那拙劣的文法与粗鄙的遣词造句比不上我恩师的十分之一。他是多么杰出的诗人！他的诗稿还等待着我去整理，他的词句还等待着我去学习。我们应该把他的诗歌镌刻在阿尔罕布拉宫的墙壁上，供后世的奈斯尔王室和贵族们瞻仰。\n\n恩师是一名称职的宰相，忠心耿耿，尽职尽责。面对独断专行的我主优素福，恩师也会直言纠正，因为失当的政策和不合适的大赦都会使国家陷入困境。我当因此自勉，谨遵恩师训命，辅佐我们的埃米尔殿下。\n\n真主将智慧传授与你，你亦将智慧传授与我，我将砥砺前行。真主至大。"
 ufc_situations.1305.a:0 "斯人已逝，生者宜当砥砺前行。"
 STATIC_MODIFIER_NAME_ufc_modifier_memory_of_beloved_teacher:0 "缅怀恩师"
 STATIC_MODIFIER_DESC_ufc_modifier_memory_of_beloved_teacher:0 "斯人已逝，生者尤存。路漫漫其修远兮，吾将上下而求索。"

 ufc_situations.1310.title:0 "黄金时代:隔离防疫"
 ufc_situations.1310.desc:0 "“传染的存在已由经验证实，亦通过可靠报告证实其可经衣物、器皿、耳环传播；可由人员从一处房屋扩散至另一处；可由来自疫区的船只使健康海港染疫；并可通过隔离染疫个体的免疫方法得到印证。”——《关于黑死病的求生者指南》。\n\n每当我看到扑地而亡的人，我都回想起老师那沉稳而仁慈的面庞。我所学习过的浅陋的医术面对老师的疾病竟无能为力，这使我的内心时常受到自我的谴责。可是我们面对大疫之年又能如何呢？“传染”，我想用这个词汇来概括我所能知道的一切经验，并诉诸于格拉纳达的所有贵族与平民知晓。\n\n另一方面，我们的医学面对如此的瘟疫竟如此孱弱无力，我们或许应该培养更充足的医学学生，并设立国家主导的医学教育。这将对埃米尔国的未来大有裨益。"
 ufc_situations.1310.a:0 "商会愿意投资一所新的医院。"
 ufc_situations.1310.b:0 "商会愿意投资医学发展。"
 ufc_situations.1310.c:0 "这不是我们当下的重点。"
 ufc_situations.1310.hist:0 "《关于黑死病的求生者指南》一书大概于1362年成文，是整个欧洲最早探讨疾病传染理论的专著之一。也有现代人对此进行了反驳，认为是先知（愿主福安之）也在圣训中传达过隔离防疫的概念。但无论如何，14世纪的安达卢西亚穆斯林更崇尚科学而非死板的宗教训言。\n至于格拉纳达医院，此事后文再表。"
 ibn_khatib_black_death_note:0 "《关于黑死病的求生者指南》"
 ibn_khatib_black_death_note_desc:0 "《关于黑死病的求生者指南》是伊本·哈提卜的医学专著，是整个欧洲最早探讨疾病传染理论的专著之一。"

 ufc_situations.1315.title:0 "黄金时代:增筑"
 ufc_situations.1315.desc:0 "近来，阿尔罕布拉宫在英明的优素福殿下的主持下进行了一番增筑与翻新。\n\n在宫殿入口，一座崭新的沙利亚门（即正义塔）拔地而起；在阿尔罕布拉宫内部，新修筑的科马雷斯宫殿更是宏伟壮丽，其中的大使厅将成为未来的埃米尔御座所在地，桃金娘庭院也将成为全世界最具价值的伊斯兰园林，此外还有翻新的土耳其浴室供人使用。此外，在阿尔罕布拉宫北墙的两座塔楼也被改造为了宫殿式的居所。\n\n我们的埃米尔英明勇武，又富有艺术气质，实是贤君。"
 ufc_situations.1315.a:0 "如果还有余财，不妨来扩建一下马拉加的城市？"
 ufc_situations.1315.b:0 "别掺和此事，商会可交不起额外的贡金。"
 ufc_situations.1315.hist:0 "优素福一世在1349年进行了阿尔罕布拉宫的一次大改造，其中以科马雷斯宫（Palacio de Comares）最为宏大，它位于梅休阿尔宫东侧，狮子宫西侧。另外，历史上还真的以余财扩建了马拉加的城堡。"

 ufc_situations.1320.title:0 "黄金时代:伊斯兰学校"
 ufc_situations.1320.desc:0 "近日埃米尔优素福赞助了一所享誉伊斯兰世界的伊斯兰学校，其位置毗邻格拉纳达大清真寺，并以埃米尔的名字命名（Madrasa Yusufiyya）。\n\n根据设计，该教育机构不仅教授经学，还包括伊斯兰法律、阿拉伯语文学、修辞学、医学与哲学等，其学位设计与博洛尼亚的大学相当。\n\n我也应该去多加学习。"
 ufc_situations.1320.a:0 "给我们的行政专员们也报个名！"
 ufc_situations.1320.b:0 "学习？学个屁！"
 ufc_situations.1320.hist:0 "1349年，优素福一世赞助了一所可与牛津大学、博洛尼亚大学比肩的格拉纳达伊斯兰学校，也是整个安达卢西亚地区最大的伊斯兰学校，而位于马拉加的一所私立伊斯兰学校次之。建立此类机构的动机在于培养新学者、宫廷官僚并提升统治者威望。伊本·哈提卜也是该学校最早的一批学生之一，毕业之后可以直接进入宫廷从政。"

 ufc_situations.1325.title:0 "黄金时代:镌刻诗文"
 ufc_situations.1325.desc:0 "“那珠宝与王冠，胜过世间所有佳人；十二星座的星辰，皆在我面前俯首称臣。仿佛我已承蒙圣恩，且看那丰饶的馈赠；从他的手中倾泻而下，优素福——吾之主君。”——《阿尔罕布拉宫桃金娘庭院刻诗》\n\n我也实在不是谦虚，我将我的诗文铭刻在新修的科马雷斯宫的桃金娘庭院的壁墙上。蒙恩能与老师的诗作镌刻于阿尔罕布拉宫内，吾之幸也。"
 ufc_situations.1325.a:0 "好诗好文，快派行政专员去溜须拍马一番！"
 ufc_situations.1325.b:0 "枪打出头鸟，迟早有此人好果子吃。"
 comares_palace:0 "科马雷斯宫"
 comares_palace_desc:0 "科马雷斯宫是优素福一世在位时期修建的阿尔罕布拉建筑群的一部分。"

 ufc_situations.1330.title:0 "黄金时代:德高望重的巡礼"
 ufc_situations.1330.desc:0 "“这座守护王国独立的城池，商队与船队在此交汇的繁华都市，高悬纯洁荣誉旗帜的城镇，在群雄环伺中傲然居首……”——《冬夏之旅，灵魂显形》\n\n这首阿拉伯语骈文是我为我们的埃米尔优素福的丰功伟绩而做的颂歌。就在前几日，我们完成了从格拉纳达到阿尔梅里亚的大巡游。\n\n优素福是一位品德高尚、性情端庄、心境平和的君主，他凡所到之处民众竭诚欢迎。优素福埃米尔必将领导我们的城市走向繁荣！"
 ufc_situations.1330.a:0 "商会应该投资这座城市。"
 ufc_situations.1330.b:0 "我们应该专注于眼前的事务。"
 ufc_situations.1330.hist:0 "在历史上，这次大巡游发生在1347年的春季。《冬夏之旅，灵魂显形》是一篇对偶韵文，是伊本·哈提卜的著名散文诗。其笔调多采用白描手法，其描写的格拉纳达沿途的城市风貌栩栩如生。如今的西班牙安达卢西亚遗产基金会为他们曾经走过的道路绘制了一份旅游地图，并命名为“伊本·哈提卜之路”。\n\n一段枯燥乏味到极致的巡游能被伊本·哈提卜写的有声有色，此人笔力文法可见一斑。"
 The_Appearance_of_a_Ghost_During_a_Trip_of_Winter_and_Summer:0 "《冬夏之旅，灵魂显形》"
 The_Appearance_of_a_Ghost_During_a_Trip_of_Winter_and_Summer_desc:0 "《冬夏之旅，灵魂显形》是一篇对偶韵文，是伊本·哈提卜的著名散文诗。"

 ufc_situations.1335.title:0 "黄金时代:外交筹码"
 ufc_situations.1335.desc:0 "有两名来自摩洛哥的王位觊觎者，挑战摩洛哥苏丹[GetCountry('MOR').GetGovernment.GetRuler.GetName]的两位兄弟阿布·法德尔和阿布·萨利姆逃亡到了格拉纳达，我提议否决摩洛哥宫廷对引渡两人的要求，英明的优素福埃米尔采纳了这一方案。\n\n根据以往的博弈经验，收留摩洛哥的王位觊觎者对于格拉纳达来说是相当有分量的外交筹码，但优素福埃米尔似乎别有他意。他在与我的对话中提及，北方卡斯蒂利亚的[GetCountry('CAS').GetGovernment.GetRuler.GetName]有意图挑动一场摩洛哥的内战，我们可以将这对兄弟送往卡斯蒂利亚，或许他们可以进行经济和军事上的进一步资助。"
 ufc_situations.1335.a:0 "有趣，我们静观其变。"
 ufc_situations.1335.b:0 "拦住他们！我们不想看到格拉纳达与摩洛哥之间的战争。"

 ufc_situations.1340.title:0 "黄金时代:刺杀"
 ufc_situations.1340.desc:0 "愿主安之！优素福埃米尔被刺杀了，在开斋节的礼拜之上！他被护送到了阿尔罕布拉宫的御座厅，我们的王室医生们发现了心脏处的伤口和大量出血，据我观察情况非常危急。\n\n今天的礼拜在格拉纳达大清真寺举行，优素福埃米尔被刺杀时就在我的几尺之外。一名令人诅咒的不那么引人注目的歹徒从围观的人群中冲出，持着匕首冲向了埃米尔，刹那之间埃米尔便倒在了血泊之中。我们当场抓住了可恶的歹徒，他说话吐字不清，行为疯癫。目前此人已被关入牢狱等待审问，但我们无法不怀疑是否受到了指使。\n\n就我看来，刺杀的原因可能有三种。其一，此人出于个人混乱而受诅咒的意图行事，没有人能够预测他的行为；其二，此人出于宗教狂热而施行了谋杀，优素福埃米尔与卡斯蒂利亚王国频繁的交往造成了宗教狂热份子的忌恨——尤其是任凭卡斯蒂利亚军队护送因黑死病而死的阿方索十一世的遗体此事；其三，此人可能受到了摩洛哥苏丹或其亲信的指使，近期由于收留王位觊觎者，摩洛哥苏丹对格拉纳达埃米尔国的信任极速恶化。真正的动机或许需要我们的进一步审问，但我对审问一个智力低下的疯子的前景并不看好。\n\n倘若，主可怜见，优素福埃米尔不治身亡，我们或许需要尽快将埃米尔所立下的继承人——穆罕默德扶上王位。必须尽快。"
 ufc_situations.1340.a:0 "派遣行政专员处理此事！快！"
 ufc_situations.1340.hist:0 "1354年10月19日开斋节，优素福一世在格拉纳达大清真寺礼拜时，于开斋节礼拜仪式最后的叩拜环节遇刺身亡。刺客的身份和刺杀动机至今都没有确凿证据可以佐证的定论，成为了学术上值得探讨的话题之一。"

 ufc_situations.1345.title:0 "黄金时代:新王登基"
 ufc_situations.1345.desc:0 "为格拉纳达前埃米尔优素福哀悼一刻后，立刻赶到格拉纳达王位上的是长子兼指定继承人阿布·阿卜杜拉·穆罕默德。\n\n穆罕默德是一个可爱的孩子，但他目前涉世尚浅，阿尔罕布拉宫的政治与外交事务应该由我来代为执行。显然，这样的现状可能不会得到某些人的赞同，似乎宫相里德万和从北非来的信仰志愿者将领都希望在权力斗争中分一杯羹。我或许需要谨慎与他们分享权力，我的行动必须如履薄冰，又或者我需要一些外部力量的帮助也说不定。"
 ufc_situations.1345.a:0 "联合果品商会可以为宰相提供资金——当然也需要一些小小的回报。"
 ufc_situations.1345.b:0 "宰相小肚鸡肠，不值得信任。"

 ufc_situations.1350.title:0 "黄金时代:贡礼"
 ufc_situations.1350.desc:0 "虽然很不愿意承认，但我们的埃米尔国与北方的基督徒实际上达成了某种意义上的朝贡国关系，这与我所知的东方的"鞑靼枷锁"体系略有相似。\n\n但总体上讲，我们的外交政策应该是正确的，每年以少量的黄金就可以保证免受来自北方的压力，这无疑是一份合算的交易。我们可以将更多的资源放在国内事务和恢复经济上，避免大规模军事行动对国力的损耗。\n\n另外，我们的新王穆罕默德和卡斯蒂利亚的佩德罗似乎建立起了某种私人友谊，他们经常互相交换礼物，甚至使用对方文化与宗教的器物。有些大臣对此进行了批评，但我可不会在这种琐事上惹怒我们的新埃米尔。"
 ufc_situations.1350.a:0 "让商会也随一份贡礼，这对贸易有不少好处。"
 ufc_situations.1350.b:0 "白花花的银子给基督徒？除非他来卖！"

 ufc_situations.1355.title:0 "黄金时代:朝花夕拾"
 ufc_situations.1355.desc:0 "数年前我们的外交筹码终于结下了果实——我们支持的摩洛哥苏丹国的王位觊觎者成功夺取了政权。\n\n虽然优素福一世已经升入了天堂，但统治者的更换意味着摩洛哥与格拉纳达之间的关系趋于缓和——他们支持我们的穆罕默德埃米尔。这是一件好事，但我们需要一个宿敌来团结我们的国家。近日来阿拉贡的宫廷对我们频繁进行挑衅，来自马略卡的舰队不久前袭击了我们的海岸，我们必须谨慎对待这个敌人。"
 ufc_situations.1355.a:0 "这对北非贸易是好消息，但阿拉贡人可能会对我们加税。"

 ufc_situations.1360.title:0 "黄金时代:双佩德罗战争"
 ufc_situations.1360.desc:0 "经教廷调解无果后，卡斯蒂利亚的佩德罗一世与阿拉贡的佩德罗四世开启了一场新的战争。阿拉贡支持卡斯蒂利亚的王位宣称者亨利，而卡斯蒂利亚则觊觎着阿拉贡的瓦伦西亚地区。这场战争甚至延伸到了国外，法兰西王国成为阿拉贡方的盟友，而卡斯蒂利亚则得到了英格兰和热那亚的资金支持。\n\n对于埃米尔国来说，我认为这是我们巩固与卡斯蒂利亚王国的良好关系，并重创我们的宿敌阿拉贡王国的一个绝佳机会。我们可以派遣少量的骑兵对阿拉贡边境地区进行侵扰——这不会带来太大的军事投入，同时也向埃米尔的朋友，卡斯蒂利亚的佩德罗递上了我们的筹码。"
 ufc_situations.1360.a:0 "这对地区贸易将造成不可避免的损失。"
 ufc_situations.1360.b:0 "打起来！我要看到血流成河！"
 ufc_situations.1360.hist:0 "双佩德罗战争是1356年·1366年之间发生在卡斯蒂利亚王国与阿拉贡王国之间的战争，因双方国王都名为佩德罗而得名。这场冲突源于两位卡斯蒂利亚王位继承人的争夺，是卡斯蒂利亚内战的一部分，同时也是英法百年战争的延伸。纳瓦拉王国与葡萄牙王国亦卷入战局。"

 ufc_situations.1365.title:0 "黄金时代:卡斯蒂利亚的阿拉伯宫廷"
 ufc_situations.1365.desc:0 "我非常高兴能够收获佩德罗这样的盟友，他残暴、易怒、并不精明，却又对我们安达卢西亚的文化如此痴迷，甚至有人传言说他的“基督教国王中最安达卢西亚化的君主”。\n\n我们昨日归来的外交使团报告了这一切：佩德罗身着摩尔式长袍与丝绸头巾现身宫廷，犹太与穆斯林廷臣在卡斯蒂利亚的宫廷中随处可见，禁军中甚至有一支穆斯林骑兵部队。他甚至打算建造一座仿照阿尔罕布拉宫风格的宫殿，这是我们未曾预料过的。\n\n我们相信佩德罗的在位可以保证与穆罕默德埃米尔的良好友谊，这对我们的埃米尔国的边境安全至关重要。或许我们应该加大对于双佩德罗战争的军事投入了。"
 ufc_situations.1365.a:0 "好事，加大对卡斯蒂利亚的商品出口！"

 ufc_situations.1370.title:0 "黄金时代:政变与背叛"
 ufc_situations.1370.desc:0 "可恶的佩德罗！真是受诅咒的基督徒，相信他本身就是一个错误！我们被佩德罗所谓“友好”地请离了塞维利亚的宫廷，但这是对朋友的背叛！佩德罗明显是想利用混乱的政局来坐收渔利！\n\n在数日之前，阿尔罕布拉宫内发生了一场将我们逼上绝境的政变。我们伟大的埃米尔穆罕默德被他的仁慈所背刺，他那被囚禁的同父异母的令人憎恨的弟弟伊斯梅尔和表弟阿赫马尔，以及那些背信弃义的亲族们策划了针对埃米尔的政变，可恶的阴谋者们翻越了阿尔罕布拉宫的城墙，劫持了禁军首领，并刺杀了我们令人尊敬的宫相里德万。我和正义的埃米尔撤退到了瓜迪克斯，并在那里招募到了忠于埃米尔的军队，但我们的力量恐怕还不足以夺回政权。\n\n我陪伴着伟大的埃米尔顺流而下，希望得到塞维利亚的求助。但我们的旧日盟友，那个多么喜欢安达卢西亚文化的佩德罗却给予了我们模棱两可的答复，显然他对支持我们夺回正义的埃米尔之位并无兴致。我誓死守卫我们的正统埃米尔，我想我们需要去摩洛哥的宫廷中碰碰运气了……"
 ufc_situations.1370.a:0 "马上联系流亡的埃米尔，秘密支持他们！"
 ufc_situations.1370.b:0 "和阿尔罕布拉宫的新政权打点好关系就行了。"
 ufc_situations.1370.hist:0 "1359年8月23日，穆罕默德五世被一场来自其亲族的政变废黜，新苏丹为伊斯梅尔二世。宰相、史学家伊本·哈提卜以效忠穆罕默德的立场撰文记载了此事，将政变归因于苏丹对伊斯梅尔的软禁过于宽容，致使擅长欺骗与利用宫廷分裂的卑劣的煽动者得以暗中谋划。此事暴露了奈斯尔贵族内部的派系斗争，以及安达卢西亚地区长期以来伊斯兰政权混乱的继承问题。"
 gra_muhammad_v_support:0 "支持穆罕默德五世叛军"

 ufc_situations.1375.title:0 "黄金时代:暂避锋芒"
 ufc_situations.1375.desc:0 "我们必须承认，当年英明的优素福一世做出了无比正确的决定——收留了当今的摩洛哥苏丹[GetCountry('MOR').GetGovernment.GetRuler.GetName]，这使我们收获了来自非斯宫廷的支持。\n\n在[GetCountry('MOR').GetName]，我们得到了可观的资金、军事力量和人脉资源支持。但很显然这一切都不是免费的，马林王朝显然希望通过这次政变扶持一个傀儡政权——假如穆罕默德埃米尔回到了本该属于他的王位上，我们将不得已履行向摩洛哥的贡赋与军事同盟关系。\n\n但是我们没有选择，埃米尔对我们艰难的处境有些急躁，我已经屡次劝谏要忍气吞声。如今之计，唯有韬光养晦，静待时机。"
 ufc_situations.1375.a:0 "为流亡的埃米尔秘密提供信仰志愿者的支持。"
 ufc_situations.1375.b:0 "准备船只和水手，直布罗陀海峡可不是那么容易跨越的。"
 ufc_situations.1375.c:0 "也不看看谁才是坐在阿尔罕布拉宫里的人！"

 ufc_situations.1380.title:0 "黄金时代:新朋友"
 ufc_situations.1380.desc:0 "伊本·赫勒敦，这是我这个月新交的挚友之名。他目前在非斯的宫廷内担任宫廷学者，这可真是个博学多才而富有艺术气质的人！他的诗歌与我的不相上下，他的文学比我更胜一筹，其政治见解和谋略更在我之上。而他的命运却比我更凄惨几分，在我们的交谈中我得知了他的故事。\n\n他的父母和老师在黑死病中离世，这与我的遭遇如出一辙。二十岁时他曾在突尼斯担任文书官，后又在马林王朝担任诏书撰稿人，始终郁郁不得志。二十五岁时，他被指控反对摩洛哥苏丹而被判处了两年监禁。直到我们的“外交筹码”实现了野心，他才刚刚在非斯的宫廷内混到了廷臣的职位，却并非什么重要的官职。在我看来，此人野心勃勃，深谙政治手腕，只是怀才不遇而已。倘若能助我与真主庇佑的埃米尔返回阿尔罕布拉宫的王位，我或许能在格拉纳达为他谋求高官厚禄。此两全其美之事，值得我与这位新朋友多加商榷。"
 ufc_situations.1380.a:0 "才华横溢的野心家吗，为其备一份礼物。"
 ufc_situations.1380.b:0 "赫什么敦？没听说过。"
 ibn_khaldun:0 "伊本·赫勒敦"
 ufc_situations.1385.title:0 "黄金时代:内部瓦解"
 ufc_situations.1385.desc:0 "令人振奋的消息！就在不久前，阿尔罕布拉宫内发生了又一场政变，伊斯梅尔二世被先前政变的同谋——穆罕默德埃米尔的表弟阿赫马尔暗杀，后者篡夺埃米尔之位后又进行了一次大规模的处决，此起彼伏的叛乱看来已经在所难免了。这是我们绝佳的机会，我们应该引渡更多的流亡者来充实我们的政治力量。\n\n另一方面，我们的新朋友伊本·赫勒敦果然不同凡响，短短数月之间就帮助我们联系到了足以杀回伊比利亚半岛的北非雇佣兵和格拉纳达流亡者，据说还有一队来自联合果品商会赞助的信仰志愿者队伍，这对于我们下一步的计划非常重要。我们计划派遣一小支雇佣军在伊比利亚半岛上建立星罗棋布的据点，在阿尔罕布拉宫的伪政权对叛乱疲于奔命时，一举夺回属于真正的埃米尔的王座！"
 ufc_situations.1385.a:0 "看来穆罕默德五世夺回王位只是时间问题。"
 ufc_situations.1385.hist:0 "伊斯梅尔二世继位苏丹后立即引发动荡，他的统治疏远了效忠被废黜的穆罕默德五世的军政集团，并为巩固权力处决了部分支持者。伊斯梅尔本人在1360年2月被政变盟友穆罕默德六世暗杀，后者篡夺王位后不久便面临更广泛的叛乱。混乱的继承仍然困扰着奈斯尔王朝的每个政权。\n另一方面，为维护奈斯尔王朝的自治权，穆罕默德五世策划复辟时并未邀请马林王朝进行全面占领，而是利用雇佣军实施了多项独立军事行动。这大胆的决策为格拉纳达的独立政权地位打下了坚实的基础。"

 ufc_situations.1390.title:0 "黄金时代:复辟"
 ufc_situations.1390.desc:0 "穆罕默德五世，真主神赐的富足者，今日回到了他忠诚的阿尔罕布拉宫。\n\n我们的军事行动雷厉风行。来自北非的雇佣军、马拉加的信仰志愿者和正义的格拉纳达各地的守卫者们，对曾经那个腐朽堕落的伪政权展开了全面围攻。阿尔罕布拉宫在数日之内宣布投降，篡位者仓皇逃出了格拉纳达，企图向塞维利亚的佩德罗求援。佩德罗假意相邀赴宴，并在宴席上亲手擒获了篡位者，最后以长矛处决了这个令人唾弃的可耻叛徒，以此宣布与英明的穆罕默德五世的盟约。显然，卡斯蒂利亚的国王也是个投机分子，谁赢他们帮谁。\n\n另一方面，我诚邀客居非斯的学者伊本·赫勒敦迁居格拉纳达。您在真主庇佑的埃米尔流亡北非时站在了正确的一方，为埃米尔的成功立下了汗马功劳。您的智慧值得一份更为体面且能体现您的才干的工作。"
 ufc_situations.1390.a:0 "我为复辟出过力，快去讨一份赏金！"
 ufc_situations.1390.hist:0 "当穆罕默德六世仓皇逃出格拉纳达埃米尔国时，他的身上携带了一枚硕大的红色尖晶石。这枚宝石后被佩德罗赠与了英国国王，以答谢在双佩德罗战争中英格兰的军事援助。后来这枚宝石被镶嵌在了大英帝国王冠最正前方的位置上，直至今日。"

 ufc_situations.1395.title:0 "黄金时代:排除异己"
 ufc_situations.1395.desc:0 "我的新朋友伊本·赫勒敦在阿尔罕布拉宫任职已经超过半年了。说实话，有时我确实对他的文学与诗歌才华感到嫉妒，但在政治上我肯定比这位朋友更加成熟。伊本·赫勒敦在政治上如同一个孩子一样，妄图插手他一个无依无靠的外乡人不应该触及的部分，还试图纠正一些英明的埃米尔穆罕默德的一些习惯以满足他内心的完美君主的形象，这未免过于幼稚了。无论如何，我认为我们的这位新朋友应该到地方去，或者去作为外交使节历练一番，以免在朝堂上做出什么出格的事来。\n\n相比于我的朋友，那些趁着光荣的埃米尔复辟的机会，寻求封赏和利益的北非人则更加可恶，他们在肆意践踏着我……们阿尔罕布拉宫的王权，谋求着本来不应属于他们的利益。我们应该将他们赶回北非去，在这里只会浪费我们的资源。"
 ufc_situations.1395.a:0 "商会可以让他们解甲归田。"
 ufc_situations.1395.b:0 "整编这些北非雇佣军。"
 ufc_situations.1395.c:0 "这些人对于马拉加也是累赘。"
 ufc_modifier_the_aftermath_of_black_death_small_descent:0 "降低#G 5%#!#R 黑死病的余波#!的效果。"
 ufc_modifier_the_aftermath_of_black_death_medium_descent:0 "降低#G 10%#!#R 黑死病的余波#!的效果。"
 ufc_situations.1400.title:0 "黄金时代:孤独"
 ufc_situations.1400.desc:0 "“我只身行走于这条路的中央，孤独地流浪。\n曾几何时我亦如那雄狮般雄壮，如今却将自己隔离于可悲的壁障。\n我将灵魂与肉体分离，远离世间的熙熙攘攘。\n我只愿将自己的智慧与财富散在人世，祈祷再无孤独的灵魂流亡。”——《异乡之旅，行囊摇晃》\n\n我轻抚着一年前我所作的这首诗歌，那段从摩洛哥的上阿特拉斯山脉返回安达卢西亚的旅程依稀映在眼前。而此时的我却没有当时的心境，我们成功了，但我感到孤独。我的好友赫勒敦被我请去卡斯蒂利亚王国做了外交使者，他野心勃勃却十分幼稚，不适合在阿尔罕布拉宫内任职。我想起了宫相里德万，我曾经的劲敌，也是我曾经的朋友，他在政变中被刺杀了。我想起了我的老师伊本·贾亚布，如今的我已经成为另一批宫廷学者的老师了，为什么我感受不到曾经我们之间的师徒之情呢？如今的我作为文武双宰相，在整个格拉纳达埃米尔国说一不二；我所辅佐的穆罕默德埃米尔精明强干而又勇敢果决，但为什么我总是感到前途渺茫呢？\n\n我有些孤独。"
 ufc_situations.1400.a:0 "商会近日在阿尔罕布拉宫的使者又被遣返回马拉加了。"
 STATIC_MODIFIER_NAME_ufc_modifier_self_corrosion:0 "自我侵蚀"
 STATIC_MODIFIER_DESC_ufc_modifier_self_corrosion:0 "此人迷失在了权力的漩涡之中，自我怀疑与患得患失使其更加优柔寡断和谨慎。"
 The_Shaking_of_the_Bag:0 "《异乡之旅，行囊摇晃》"

 ufc_situations.1405.title:0 "黄金时代:鉴往知来"
 ufc_situations.1405.desc:0 "伊本·赫勒敦必须离开格拉纳达埃米尔国，他不应该属于这里。\n\n穆罕默德埃米尔同意了我的谏言，我的旧日好友伊本·赫勒敦的一些行为明显越界了。我必须承认伊本·赫勒敦出使卡斯蒂利亚的工作完成得令人满意——他不卑不亢地履行了外交谈判的职责，并高尚地拒绝了佩德罗将他留在塞维利亚的待遇。但当他返回阿尔罕布拉宫时，那些幼稚的政治行为——如对伟大的埃米尔的指指点点暴露出了他的无知。他应该回到突尼斯去，他可以成为一名优秀的学者，而非插手不应该干涉的政治。\n\n我只希望这位旧日的朋友不要记恨我，我是在保护他的安全。我愿经常拜读他的诗歌，但我不希望他在阿尔罕布拉宫内再次现身。"
 ufc_situations.1405.a:0 "赫勒敦？我记得昨日的登记簿上……"
 ufc_io.influence_medium_ascend.tt:0 "这将使联合果品商会贸易圈的贸易影响力增加#G 10#!。"

 ufc_situations.1410.title:0 "黄金时代:格拉纳达医院"
 ufc_situations.1410.desc:0 "在我的一手操办下，格拉纳达城的事业蒸蒸日上。就在数月前，我向埃米尔进言扩建阿尔罕布拉宫，金碧辉煌的狮子宫展现了埃米尔国的实力。\n\n而就在今日，我递交了格拉纳达医院的项目设计，这不仅是一项惠及全城民众的重要基础设施，也可以为我们的格拉纳达伊斯兰学校的医学生们提供丰富的医学经验。此外，这里也将验证我的一些医学研究。\n\n英明的埃米尔同意了这一方案，不久之后就可以开始动工。"
 ufc_situations.1410.a:0 "我们应该派遣行政专员进行学习考察。"
 ufc_situations.1410.b:0 "我们应该赞助一个商会的医疗队伍。"
 ufc_situations.1410.c:0 "宰相又在卖弄他的学术，不必理会。"
 ufc_situations.1410.hist:0 "格拉纳达医院(maristan)是由1365-1367年受穆罕默德五世资助建造的公立性质的医院，也是全世界最早开设精神科诊治与护理的医院之一。"

 ufc_situations.1415.title:0 "黄金时代:党同伐异"
 ufc_situations.1415.desc:0 "我的预感没有错，埃米尔对我或许有些失望，但我不能再留在阿尔罕布拉宫了。我临行之前匆匆为埃米尔留下了一封辞别信，他的统治恩受真主的赐福，而我不能再辅佐他了。\n\n在昨日，我的学生们——这群忘恩负义的白眼狼，竟然勾结了我的政敌在科马雷斯宫的大使厅的朝堂上攻击我，给我强加了一些莫须有的罪状，这完全是对一位忠臣与虔诚的真主的侍奉者的诬陷。受到小人蒙蔽的埃米尔对我产生了些许怀疑，我如何辩述自己的忠诚与虔信都无法令埃米尔回心转意。\n\n我无法承认那些将我的学术研究批判为异端的不实指控，因此我只能暂时离去。我精心构建的权力网络在瞬间化为乌有，如今的我还能去哪里呢？在马拉加的那个什么商会吗？或许只有回到摩洛哥的宫廷才有翻身的机会。"
 ufc_situations.1415.a:0 "商会收留不了这个被权力迷晕的疯子。"

 ufc_situations.1420.title:0 "黄金时代:审判"
 ufc_situations.1420.desc:0 "我是清白的！我的诗歌满载了对真主的光辉的颂扬！我的研究足以造福这个混乱的时代！我的记史均是求真求实绝无亵渎！你们的指控是如此荒唐，竟要将一个无辜的至诚之人置于死地！\n\n那肮脏的审判席上！那个令人可憎的面庞——我的学生伊本·扎姆拉克！我曾将我的文学创作与研究方法尽数传授于你，你为何要行那犹大的背叛之事，难道是嫉妒我五年前在阿尔罕布拉宫的权力吗？而那真主赐福的证人席上，我的挚友伊本·赫勒敦，竟不计前嫌为我辩护。你们听到这位闻名的学者，商会的主席的辩护了吗？我是无罪的！"
 ufc_situations.1420.a:0 "伊斯兰学者议会无法做出裁决，但商会已无法拯救他。"

 ufc_situations.1425.title:0 "黄金时代:尾声"
 ufc_situations.1425.desc:0 "伊本·哈提卜被勒死了，他不愿再承受冤屈，也不会被污蔑名声——他只是因权力而死，仅此而已。\n\n次日，伊本·哈提卜的遗体以穆斯林的葬礼仪式被安葬于非斯城的城墙外。他的政敌们将他剖坟掘墓，将遗体丢入烈火中焚烧。没有人审判这亵渎遗体的行为，这就是权力的意义。\n\n伊本·赫勒敦不知道自己是否应该憎恨这位昔日的好友与曾经的政敌，他默默地整理着伊本·哈提卜的诗歌、记史与学术遗稿。这就是黄金时代，理想与现实之间的隔阂如此模糊——这，就是黄金时代。"
 ufc_situations.1425.a:0 "如果伊本·赫勒敦不曾被赶出格拉纳达，如今又会是怎样的结局呢？"
 ufc_situations.1425.a.tt:0 "伊本·哈提卜死去了，没有人在意他是怎样死的，也没有人在意他为何而死。他是自杀的，他一直在服用名为权力的慢性毒药。在联合果品商会之外，千千万万个这样的故事发生着。\n伊本·哈提卜已死，而格拉纳达埃米尔国的黄金时代或许还会继续。明日，太阳照常升起。"
 STATIC_MODIFIER_NAME_ufc_modifier_relief_the_hatred:0 "和解"
 STATIC_MODIFIER_DESC_ufc_modifier_relief_the_hatred:0 "他与曾经亲密无间的挚友与不共戴天的仇敌和解了。一切身为人的光辉，在权力斗争中捻为齑粉，却在一无所有时重塑为真。"

 UFC_SITUATION_SECONDARY_MISSION_0:0 "次要事变：无"
 ufc_situations.1000.tt:0 "我们将尽可能地在百年战争中浑水摸鱼。在波尔多等城市建立贸易站，挑拨伊比利亚诸邦的关系，甚至在英法两国之间下注，直至获得获胜方的贸易最惠国待遇，将贸易之手伸向英吉利海峡。"
 UFC_SITUATION_SECONDARY_MISSION_1:0 "次要事变：百年战争"


 ufc_situations.1100.title:0 "主要事变：松弛枷锁"
 ufc_situations.1100.desc:0 "联合果品商会的第一桶金来自阿尔罕布拉宫，但不能每一桶金都送去阿尔罕布拉宫。\n\n法蒂玛太皇太后的心中总是惦记着她那可爱的孙子，虽然她本人生活勤俭，但奈斯尔王室对商会的掌控力仍然使得大量的利润流向了繁复奢靡的宫廷生活中。联合果品商会的商团们对此颇为不满，我们必须设法说服法蒂玛太皇太后，将资本放在它最应该存在的地方。如果我们不能将一枚杜卡特变成两枚，那么商会将迎来它的慢性死亡。"
 ufc_situations.1100.a:0 "至少，我们等不起太皇太后去见真主的那一天。"
 ufc_situations.1100.tt:0 "我们需要每月向[GetCountry('GRA').GetName]缴纳#R 50.00%#!的总收入作为初创投资分红，其中大部分是出于对法蒂玛太皇太后的尊敬。我们必须尽快改变这一现状，将阿尔罕布拉宫对商会的控制降到最低。"
 ufc_situations.1105.title:0 "松弛枷锁：王室供给"
 ufc_situations.1105.desc:0 "优素福一世今日迎来了他的第一个儿子的诞生。愿他健康长寿！\n\n为了庆祝[GetCountry('GRA').GetName]继承人的诞生，阿尔罕布拉宫预期在七天后举行一场盛大的阿其刮仪式，为婴儿进行正式的取名，并施行割礼。孩子被取名为阿布·阿卜杜拉·穆罕默德，如果一切顺利，他将成为[GetCountry('GRA').GetName]的第一顺位继承人。——如果顺利的话。"
 ufc_situations.1105.a:0 "商会将为这次王室典礼提供资金和货源。"
 ufc_situations.1105.a.tt:0 "商人们可以提供王室供给，来换取对商会的掌控权。"
 ufc_situations.medium_descent.tt:0 "我们的阿尔罕布拉税款将降低#G 5.00%#!。"
 ufc_situations.small_descent.tt:0 "我们的阿尔罕布拉税款将降低#G 2.50%#!。"
 ufc_situations.1105.b:0 "我们不能承受这带来的额外赤字。"
 ufc_situations.1110.title:0 "松弛枷锁：掌控市场"
 ufc_situations.1110.desc:0 "[GetCountry('GRA').GetName]的宫廷货物进口于马拉加，但整个市场的进出口商品长期受到了非斯的摩洛哥商人把控。如果我们能赞助[GetCountry('GRA').GetName]在马拉加投资一个新市场，想必能够更容易掌控本地市场。但需要注意，摩洛哥的商人一定不会为此高兴的。"
 ufc_situations.1110.a:0 "长远来看确实值得这样做。"
 ufc_situations.1110.a.tt:0 "这将松弛埃米尔国对我们的掌控力。这将使联合果品商圈的贸易影响力降低#R 5#!"
 ufc_situations.1110.b:0 "为什么要做吃力不讨好的事情？"
 opinion_ufc_unsatisfied:0 "商会事件产生的不满"
 opinion_ufc_satisfied:0 "商会事件产生的好感"
 ufc_situations.1115.title:0 "松弛枷锁：需求增加" #随机事件，触发概率是每月1%
 ufc_situations.1115.desc:0 "最近来自[GetCountry('GRA').GetName]的需求增加了，我们可以趁此机会向阿尔罕布拉宫索取更多的自主权。"
 ufc_situations.1115.a:0 "非常好。"
 ufc_situations.1120.title:0 "松弛枷锁：需求减少"
 ufc_situations.1120.desc:0 "最近[GetCountry('UFC').GetName]的生意惨淡，商会很可能会更加依赖阿尔罕布拉宫的支持。"
 ufc_situations.small_ascend.tt:0 "我们的阿尔罕布拉税款将增加#R 2.50%#!。"
 ufc_situations.1120.a:0 "一些临时的资金总是好的。"
 ufc_situations.1120.b:0 "我们自己可以挺过去。"
 ufc_situations.1125.title:0 "松弛枷锁：转移士兵"
 ufc_situations.1125.desc:0 "[GetCountry('GRA').GetName]目前正在应对来自外部的压力，如果我们可以向他们转移一些登记在册信仰志愿者的指挥权，想必来自阿尔罕布拉宫的控制也会有所放缓。"
 ufc_situations.1125.a:0 "这是可以接受的。"
 ufc_situations.1125.b:0 "不行。"
 ufc_situations.1130.title:0 "松弛枷锁：转移水手"
 ufc_situations.1130.desc:0 "[GetCountry('GRA').GetName]目前正在应对来自外部的压力，如果我们可以将我们的一部分船员交给[GetCountry('GRA').GetName]，想必来自阿尔罕布拉宫的控制也会有所放缓。"
 ufc_situations.1130.a:0 "让伙计们明天去报道。"
 ufc_situations.1130.b:0 "我们誊不出人手。"
 ufc_situations.1135.title:0 "松弛枷锁：粮食安全"
 ufc_situations.1135.desc:0 "[GetCountry('GRA').GetName]近期遭遇了一次旱灾，本来粮食短缺的格拉纳达地区如今雪上加霜。埃米尔国希望我们进口一些粮食到本地市场，以压低疯涨的粮价。"
 ufc_situations.1135.a:0 "我们可以以此寻求更多自主权。"
 ufc_situations.1135.b:0 "这岂不是一个低买高卖的好机会？"
 ufc_situations.1140.title:0 "松弛枷锁：铸币困境"
 ufc_situations.1140.desc:0 "[GetCountry('GRA').GetName]的[GetCountry('GRA').GetRuler.GetName]最近计划铸造一批新的货币，但最近的贵金属矿藏要么集中在基督徒手里，要么集中在摩洛哥手里。如果商会能够拿到一些便宜的渠道，阿尔罕布拉宫或许可以提供一些好处……"
 ufc_situations.1140.a:0 "走私贵金属多少有一些风险，但也并非什么大难题。"
 ufc_situations.1140.b:0 "多搞一点！格拉纳达的通货膨胀跟我有什么关系？"
 ufc_situations.1140.c:0 "这会对商会的声誉产生负面影响。"
 ufc_situations.1145.title:0 "松弛枷锁：低息贷款"
 ufc_situations.1145.desc:0 "阿尔罕布拉宫方面希望商会支付三个月的利润作为贷款，并承诺两年后如数归还。经过商会财务核算，这笔贷款的利息低到刚刚抵扣通胀数据，这意味着我们在这笔贷款上丝毫赚不到些许，甚至会亏损机会成本。"
 ufc_situations.1145.a:0 "这算阿尔罕布拉宫欠我们的人情。"
 ufc_situations.1145.b:0 "我们不是无限责任的国家银行。"
 ufc_situations.1150.title:0 "松弛枷锁：交付还款"
 ufc_situations.1150.desc:0 "阿尔罕布拉宫的低息贷款于今日还款，我们一分钱利息也没赚到。"
 ufc_situations.1150.a:0 "至少我们赚了点人情。"
 ufc_situations.1155.title:0 "松弛枷锁：脱离控制"
 ufc_situations.1155.desc:0 "与[GetCountry('GRA').GetName]宫廷的长期制衡使得我们成功脱胎换骨。随着优素福一世的成长，法蒂玛太皇太后在阿尔罕布拉宫中的权力逐年削弱，联合果品权力开始逐渐交接给商人理事会，商人团的利益得到进一步巩固。如今的联合果品商会已经不再是依附于[GetCountry('GRA').GetName]的附属国——我们拥有了自己的船队，自己的商团和行政体系。\n\n至少，来自阿尔罕布拉宫的贷款现在需要向我们支付利息了。"
 ufc_situations.1155.a:0 "敬法蒂玛太皇太后！"
 ufc_situations.1155.b:0 "敬联合果品商会！"
 ufc_situations.never_pay_for_alhambra.tt:0 "我们不再需要交付阿尔罕布拉税款。虽然一定程度上我们仍然需要仰仗格拉纳达埃米尔国的城市和士兵作为我们发展的基础，但埃米尔国不再对商会享有税务上的特权。"
 centralized_trade_federations:0 "集权贸易联邦"
 centralized_trade_federations_desc:0 "相比于去集中化的贸易体系，集权贸易联邦更注重来自中央的有计划的商业策划。"
 UFC_ALLOW:0 "我们脱离了阿尔罕布拉税款的控制，将权力集中在商业理事会内。"

 ufc_situations.1160.title:0 "松弛枷锁：小小穆罕默德"
 ufc_situations.1160.desc:0 "呜呜呜，我们太皇太后的曾孙——小小穆罕默德又被惹哭了，他的玩伴抢走了属于他的玩具。\n\n三岁的小穆罕默德很喜欢他的那些玩具，他第一次体会到失去的滋味是多么辛酸。\n\n但这绝不会是他最后一次体验这滋味。"
 ufc_situations.1160.a:0 "哦可爱的宝贝，快给他买点新玩具。"
 ufc_situations.1160.b:0 "失去的玩具要靠自己的实力抢回来！"
 ufc_situations.1160.c:0 "小不忍则乱大谋，总有一天要把失去的玩具都拿回来！"

 ufc_situations.1200.title:0 "随机任务：步步为营"
 ufc_situations.1200.desc:0 "昏暗的灯光，昨天的商会日志，两个新登记的商人，十名遭遇风暴而死的水手……每天的商会都会有新的变化，每时每刻都是如此。\n\n商会总是会设立一些新的目标，向着商人理事会的目标前进吧！"
 ufc_situations.1200.a:0 "罗马不是一天建成的，联合果品也不是。"
 ufc_situations.1200.a.tt:0 "从现在开始，在[ShowSituationName('rise_of_the_ufc')] [situation|e]中可以查看一些随机任务，当达成目标后可以获得一些随机奖励并刷新随机任务。有小概率可以抽中大奖哦！"


 ufc_situations.2100.title:0 "主要事变：旅行商人"
 ufc_situations.2100.desc:0 "我的喉咙在撕扯，我的额头在灼烧，我的思维在叛乱。人行走于大地之上，突然之间倒地而亡。一切都没有预兆，而一切都成为了预兆。真主怜悯，上帝慈爱，就算是那些个刚当了三年学徒工的从意大利来的异教徒鸟面医生也好，无论是谁，谁来让我活下去，我就……\n\n年轻人颤颤巍巍地躲在信仰志愿者的行军营帐里，帐外乌鸦那嘶哑的叫声令他烦躁。年轻人受征支援位于直布罗陀的城堡，但目前所在军队的组织已经完全瘫痪了，没有侦察兵告诉他们敌人在哪里，也没有督粮官为他们准备伙食。他不知道的是，卡斯蒂利亚的军队同样遭受着瘟疫的折磨。\n\n年轻人恍恍惚惚之间摸到一双属于中年人的粗壮有力的手，递来的是乘着温水与零零散散的草药的陶碗。来人蒙着厚实的头巾，他顾不得许多地一股脑喝下，于是又沉沉睡去。许久，不知是梦中还是清醒，他听到营帐外闷沉而浑厚的声音，似乎是与领队争执着“火葬”这类亵渎的名词。真主会惩罚他的——年轻人的思维艰难地爬行着，终于爬到了一块小小的记忆。他想起这双手和这个声音的主人，是那个刚加入信仰志愿者不久的中年男人，据说是个阅历很丰富的人。终于，他的思维终于触及到了那个名字上。"
 ufc_situations.2100.a:0 "他的名字是阿布·阿卜杜拉·穆罕默德·伊本·白图泰。"
 STATIC_MODIFIER_NAME_ufc_modifier_pandepic_cremation:0 "疫时火葬"
 STATIC_MODIFIER_DESC_ufc_modifier_pandepic_cremation:0 "在黑死病期间，白图泰提议应该借鉴印度文明的经验施行尸体火葬，这似乎对抑止瘟疫的传播有所效果。"
 ufc_situations.2105.title:0 "旅行商人：辩护律师"
 ufc_situations.2105.desc:0 "瘟疫退去了，随着瘟疫退去的还有卡斯蒂利亚的围攻部队——因为卡斯蒂利亚国王感染黑死病而死。\n\n幸存的信仰志愿者们驻留在马拉加港，伊本·白图泰提出的瘟疫时期火葬策略确确实实地令他所在的信仰志愿者部队顺利地挺过了瘟疫。但与此同时，火葬这一显然违反伊斯兰教法的做法遭到了诸位伊玛目的质疑。在马拉加的清真寺内，当地伊玛目对白图泰的行为进行了辩论与宣判。\n\n然而，德高望重的伊玛目在辩经上落了下风。白图泰援引了德里苏丹国的律法，以及在旅行期间观察到印度教徒的火葬仪式对瘟疫的控制效果，再加以所在信仰志愿者领队为其作证，赞同白图泰的伊斯兰学者占据了多数。\n\n马拉加清真寺的伊玛目所不知道的是，白图泰的父亲是丹吉尔的伊斯兰教法法官，从小耳濡目染的他精通伊斯兰律法，加以一生中汇集了亚洲与印度洋数百个国家的教法知识，这位旅行的法官对沙利亚法的理解和运用已至炉火纯青。显然，白图泰是整个伊斯兰世界最好的辩护律师——即使他是在为自己辩护。"
 ufc_situations.2105.a:0 "尊重多数人的意见，伊本·白图泰无罪。"
 ufc_situations.2105.a.tt:0 "当伊本·白图泰成为统治者时，我们将获得：每月教法主义价值观倾向： +0.20。"
 ufc_situations.2110.title:0 "旅行商人：沧海桑田"
 ufc_situations.2110.desc:0 "“不胫而走”这个词用以形容联合果品商会的信息传播能力可谓是再合适不过了。伊本·白图泰的事迹在整个商圈都流传开来，据说他超越了威尼斯著名的囚犯马可·波罗，出生于摩洛哥的他曾两次于麦加朝觐，访问过也门、埃塞俄比亚和基尔瓦的海岸，造访过伊利汗国、拜占庭帝国、金帐汗国的宫殿，在印度苏丹国停留了数年，穿越过马六甲海峡，并最终抵达过中国的泉州、杭州和大都。但当伊本·白图泰想要归家时，天地之间已经找不到属于他的家乡。德里苏丹国内忧外患，伊尔汗国四分五裂，黑死病开始蔓延到大马士革。当返回摩洛哥时，他方才得知父母双亡，受到信仰志愿者的征集而来到了伊比利亚的土地上。\n\n二十五年间沧海桑田，命运和岁月又在这个顶天立地的中年人身上留下了多少刻痕呢？"
 ufc_situations.2110.a:0 "身无旁物，万念俱灰。"
 STATIC_MODIFIER_NAME_ufc_modifier_no_more_chasing:0 "无欲无求"
 STATIC_MODIFIER_DESC_ufc_modifier_no_more_chasing:0 "年少时总在问自己：你在追求什么；而如今更多地会问：你不需追求什么。"
 ufc_situations.2115.title:0 "旅行商人：歧路旅人"
 ufc_situations.2115.desc:0 "一纸和平协议传到了联合果品商会，随着卡斯蒂利亚国王阿方索十一世感染黑死病去世，仁慈的格拉纳达埃米尔优素福一世下令放行卡斯蒂利亚的残军。由于卡斯蒂利亚围攻直布罗陀失败，信仰志愿者们存在的意义也不复存在，大量受征集而来的信仰志愿者们陆续回到了摩洛哥境内，而伊本·白图泰则选择在马拉加逗留数日，不久便会离开。\n\n令白图泰始料不及的是，他的名声在联合果品商会中广为流传，之前的火葬审判事件在马拉加沸沸扬扬，而他旅居全世界的经历更是令商人们心驰神往。更有好事者希望将他的故事书写成一部游记，让这段千古伟绩得以彰显。与此同时，商人们对于万里行旅的商业契机更加兴致斐然，如果商人们能够像白图泰那样远及印度中国，那么光是香料贸易就足以带来一份可观的收益。\n\n总之，商会中越来越多的人请求白图泰留下来，甚至太皇太后有征召白图泰进阿尔罕布拉宫之意。而白图泰本人也犹豫不决，毕竟摩洛哥的产业已被兄长继承，如今何处是他的家呢？"
 ufc_situations.2115.a:0 "联合果品商会，这里将会是你的#Y 新家#!。"
 ufc_situations.2115.b:0 "放他回摩洛哥吧，他已经承受了太多。"
 ufc_situations.2115.b.tt:0 "伊本·白图泰的相关事件将会全部跳过。"
 ufc_situations.2120.title:0 "旅行商人：登堂入室"
 ufc_situations.2120.desc:0 "此非白图泰第一次来到富丽堂皇的宫殿——他也曾拜访过伊尔汗国的可汗，也曾面见过德里的苏丹——但如此标志性的建筑风格还是首次见到。阿尔罕布拉宫的正义之塔作为整个建筑群最宏伟的入口，其美观性和实用性的建筑设计都令这位博学多识的旅行家叹为观止。当步入桃香木院的大使厅时，白图泰真正体会到了全世界最有价值的建筑美学\n\n老太皇太后已经不再像十年前那样精神矍铄了，她的双手开始颤抖，她的双目开始昏沉。但当伊本·白图泰得到召见时，老太皇太后仍是勉强撑住了身形。白图泰的传说在商会中流传甚广，老太皇太后对这个年轻人也颇为喜爱——唯一的问题是，这个“年轻”仅是对于老太皇太后而言，白图泰本人已经年近五十了。\n\n老太皇太后十分欣赏白图泰的学识、见地和勇于探索的决心，这对于一个旅行家而言或许只是基本功，但对于商人来说却意义非凡。联合果品商会需要注入新的血液与新的活力。另外，商会也可以为白图泰提供帮助，比如为他的毕生经历撰写一部史诗般的巨作，让这段旷世奇闻永恒流传。\n\n自第二天起，这位野心已经被消磨干净的旅行家不得不又一次背起了行囊。但这并非下一次旅行的启程，而是为了商业考察与探访。白图泰被聘为了商会的首席顾问，不久的将来，他将成为商会的正式主席。"
 ufc_situations.2120.hist:0 "优素福一世在位时期，阿尔罕布拉宫得到了多次修缮，其中包括了宏伟壮丽的正义之塔（Bab al-Sharia）、奇伟瑰怪的断塔（Torre Quebrada）、帕塔尔宫的小祈祷厅（oratorio）和桃香木院大使厅等等。如今保留下来的相当一部分奈斯尔建筑群都是出自优素福一世时期。"
 ufc_situations.2120.a:0 "伊本·白图泰必将为联合果品商会注入新鲜血液。"
 ufc_situations.2120.a.tt:0 "我们现在可以将伊本·白图泰任命为内阁成员。\n我们将获得仅持续一个月的修正：新任内阁，允许我们免费替换一名内阁成员，使用一次或过期后失效。"
 STATIC_MODIFIER_NAME_ufc_modifier_free_assign_cabinet:0 "新任内阁"
 STATIC_MODIFIER_DESC_ufc_modifier_free_assign_cabinet:0 "我们的政府部门中新来了一个值得信赖的内阁成员。"
 ufc_situations.2125.title:0 "旅行商人：唯贤主义"
 ufc_situations.2125.desc:0 "伊本·白图泰开始参与管理联合果品的行政事务意味着一件事：以格拉纳达贵族为主导的商会政治已经逐渐演变成商人们中的佼佼者为主导的政治体系。资产丰厚、生意成功的商人往往更有机会参与到商会总部的行政管理体系中来，而无能的行政专员将被可能剔除出这不需风餐露宿的清闲岗位。\n\n不得不说，伊本·白图泰曾见识过大都的官僚体系，这为联合果品带来了一些东方的唯贤主义思潮——这虽不是欧洲的首例，但足以在伊比利亚半岛上掀起一场风浪。至少在联合果品，对于行政专员的考核这一工作自白图泰时期开始。"
 ufc_situations.2125.a:0 "是黄铜，总会被扒光的。"

 ufc_situations.2130.title:0 "旅行商人：安于现状"
 ufc_situations.2130.desc:0 "不得不说，伊本·白图泰拥有着商人们最为珍视的素质，或许是精明的头脑，或许是敢闯敢干的执行力，又或许是勇于探索的勇气。但事事并非完美，作为一名博学者、旅行家和律法学家，伊本·白图泰天生缺少了一些野心，这在联合果品的商人中并非是受到欢迎的性格。\n\n在担任顾问期间，伊本·白图泰卓绝的行动力为商团们树立了榜样，如实地考察商业模式与需求；但与此同时，一些商人也对伊本·白图泰的一些保守性意见颇有微词。随着商会权力开始逐渐向白图泰过渡，激进的投机策略在联合果品商会中开始愈发少见，与此同时，安于现状的商业策略开始在商会中蔓延开来。"
 STATIC_MODIFIER_NAME_ufc_modifier_slow_expansion:0 "扩张减缓"
 STATIC_MODIFIER_DESC_ufc_modifier_slow_expansion:0 "或许是因为黑死病的余波，又或者是伊本·白图泰的做事风格倾向的影响，商会的扩张脚步开始放缓了。"
 ufc_situations.2130.a:0 "这对商会的发展不知是福是祸。"
 ufc_situations.2135.title:0 "旅行商人：起稿"
 ufc_situations.2135.desc:0 "“她们把新郎拥上坐垫后，用指甲花染了他的双手和双脚，其他人则在一旁载歌载舞，而新郎则同其挚友们在一起。苏丹指派一批长官充当男方家人，另一批则充当女方家人。他们的风俗如此，女方家人要于新娘和新郎见面处的门前站立，当新郎率其家人来时，必须奋力击溃对方，夺门而入或甘拜下风。这个过程须缴纳数千第纳尔……”\n\n从今日起，伊本·白图泰的游记开始委托格拉纳达学者伊本·朱扎伊编纂，其中故事皆由白图泰口述，其体裁范式均沿袭阿拉伯文学经典。这一手稿名为《献给观赏城市奇观与旅行奇事的珍品》，其中包含了从马穆鲁克到麦加、从伊利汗国到拜占庭帝国、从金帐汗国到印度苏丹国，甚至马尔代夫和中国的旅行故事。其中生动的诗歌与引人入胜的描绘使这一作品得到了诸多穆斯林学者的青睐。"
 ufc_situations.2135.a:0 "赞助这部旅行者的史诗！"
 ufc_situations.2135.a.tt:0 "伊本·白图泰将在这位艺术家的帮助下开始写稿。这可能需要数年的时间。之后会触发一个数量相当可观的事件链，我们将回顾伊本·白图泰波澜壮阔的旅行生涯。"
 ibn_juzay:0 "伊本·朱扎伊"
 traval_notes_of_ibn_battuta:0 "《伊本·白图泰游记》"
 traval_notes_of_ibn_battuta_desc:0 "伊本·白图泰的游记，讲述了他一生中走过的十二万公里的路程中的所见所闻。其中多有牵强附会与虚构臆造，但仍不改其在历史学与考古学中的地位。"
 ufc_situations.2150.title:0 "旅行商人：早期纸币"
 ufc_situations.2150.desc:0 "“纸币”的概念是白图泰在中国泉州旅行期间所最为惊诧的，这种具有一定防伪标识的纸质信物可用于各个商会票号中兑换实体货币，对于走南闯北的商人而言意义非凡。\n\n对于一个君主制主权国家来说，推行纸币或许十分困难，因为国家是国王的私人财产，它很难作为各个银行的信用担保物。但对于一个商会内部而言，这种纸币的流通将以整个联合果品商会的信用作为担保。这将有利于提升贸易的效率。"
 ufc_situations.2150.a:0 "让我们试点发行一部分纸币，作为商会内部流通工具。"
 ufc_situations.2150.b:0 "我们不能承受肉眼可见的通货膨胀。"
 ufc_monetary_law:0 "货币体系"
 ufc_monetary_law_desc:0 "联合果品商会是一个贸易集团，倘若我们能够主导地区的货币体系，这将极大塑造我们的地区贸易垄断权。"
 ufc_european_monetary_policy:0 "沿袭欧洲货币体系"
 ufc_european_monetary_policy_desc:0 "欧洲的货币体系是以银本位作为基础的，但随着白银的逐渐枯竭，白银货币出现了通货紧缩的情况。14世纪时，威尼斯铸币的含银量已经低至0.05克，意大利诸城邦的铸币都陷入困境，巴塞罗那则开始使用铜币。在这种情况下，商会的发展将长期受限。"
 ufc_banknote_policy:0 "商会期票"
 ufc_banknote_policy_desc:0 "商会期票是模仿中国纸币而推行的内部期票票据，商团可以在各地的商会贸易站进行兑换。这有利于提升商业效率，但在垄断市场之前，我们短期内仍然无法主导货币。"

 ufc_situations.2155.title:0 "旅行商人：风流债务"
 ufc_situations.2155.desc:0 "母子来到联合果品商会的总部，要白图泰出来给个说法。行政人员们赶都赶不走，母亲大声叫嚷着，孩子则畏畏缩缩地躲在桌下。\n\n母子来自大马士革，自称是伊本·白图泰当年旅行时所纳的妾室，但白图泰不辞而别，留下了怀孕的女人独自生下孩子拉扯到大。伊本·白图泰的犹豫暴露了他的过往，实际上，白图泰的旅行的过程中，曾纳过数个妾室，包括一名希腊女奴、一位大马士革的妇女、一名布哈拉的呼罗珊女人、来自德里的少女和一名马尔代夫妇女等等，且白图泰与其中大部分妻妾都以各种原因离异。如果孩子能够证明与伊本·白图泰的血缘关系，恐怕联合果品就不得不多养两个闲人了。\n\n等女人的情绪被安定下来时，孩子唯唯诺诺地钻出桌底，此时人们才发现孩子已经长得和白图泰差不多高了。问及年龄，孩子才怯生生答道：“八岁。”"
 ufc_situations.2155.a:0 "这他妈是八岁？！"
 ufc_situations.2155.a.tt:0 "该角色修正将在伊本·白图泰担任商会领袖时生效。"
 STATIC_MODIFIER_NAME_ufc_modifier_dept_of_love:0 "风流债务"
 STATIC_MODIFIER_DESC_ufc_modifier_dept_of_love:0 "伊本·白图泰旅途上对女性随意的态度让他背负了一些风流债务。"

 ufc_situations.2160.title:0 "旅行商人：退休"
 ufc_situations.2160.desc:0 "[GetCountry('UFC').GetGovernment.GetRuler.GetName]最近越来越力不从心了。太皇太后平日深居简出，靠着较少与外界交流勉强挺过了这一场大瘟疫，但将近九十岁的高龄下的衰老的身躯已经无法支持她解决联合果品商会的行政问题。太皇太后必须物色一个经验丰富、能力出众、众人拥护，且忠于奈斯尔家族的接班人。显然，五十岁的伊本·白图泰是不二人选。\n\n今天是[GetCountry('UFC').GetGovernment.GetRuler.GetName]最后一次莅临马拉加总部了，黑死病的风暴尚未平息，能够在总部大厅中聚集起来的行政专员与商人们甚至不及太皇太后的卫队人数，而年逾五旬的伊本·白图泰奉命在列。在场的各位都十分清楚这意味着什么——九十岁的老太皇太后要退休了。\n\n数名能够到场的行政专员们进行了类似威尼斯大议会的选举，而这一流程则颇为仪式化，没有抽签与复杂的流程，大家都顺从着德高望重的老太皇太后的旨意。选举结果经口头公布后，老太皇太后颤颤巍巍地坐下，伏案而书。她将行政专员们预先写好的文件的首页扯下，自己用华美的阿拉伯文书法重新在上好的埃及莎草纸上写下了委任状的封面——这对于一位九十岁的穆斯林女性而言亦是奇迹。最后是太皇太后与新任商会领袖伊本·白图泰的签名。"
 ufc_situations.2160.a:0 "权力交接结束了，过程像马拉加的街道一样死寂。"

 ufc_situations.2165.title:0 "旅行商人：初窥门径"
 ufc_situations.2165.desc:0 "对于伊本·白图泰来说，让他一个律法学家、旅行者来掌管整个商会的行政，不能说得心应手吧，也只能说是一窍不通。不过就目前的状况来看，留给伊本·白图泰锻炼行政能力的机遇还有很多——只是因为在瘟疫之中事务没有那么紧张而已。\n\n平日里熙熙攘攘的马拉加联合果品商会总部，如今只有三三两两的行政人员在维持着行政体系勉强运作。所有外部的商站都失联了，而格拉纳达埃米尔国又施行了严格的隔离政策。目前只有马拉加、格拉纳达和阿尔梅里亚的市场上运行着最基本的粮食贸易以供应城市需求，这尚且是因为粮价已经涨到了原先的数倍，否则没有商人愿意冒着瘟疫的风险。"
 ufc_situations.2165.a:0 "太皇太后七十而立，何况你才五十岁而已。"

 ufc_situations.2170.title:0 "旅行商人：百废待兴"
 ufc_situations.2170.desc:0 "黑死病的风暴逐渐消散了，但留下的断壁残垣仍然诉说着那段提心吊胆的岁月。人们开始“尝试”回归往日的生活，但如今皆是物是人非。马拉加的那位铁匠已经不在世了，港口的水手们找不到他们的船长，曾经带着孩子工作的纺织工如今只能沉默不语地机械式地工作着……瘟疫摧毁了一切，而幸存者们只能艰难前行。\n\n在马拉加的联合果品商会，伊本·白图泰召开了瘟疫结束后的首次集会，到场的行政专员与商团首领只有瘟疫前的不足一半。一段鼓舞人心的演讲自然是少不了的，这对于一个律法学家而言并非难事。然而，问题不是喊口号就能解决的，联合果品商会在黑死病的重创下如何复苏是摆在每个人眼前的问题。\n\n就目前的情况来看，大瘟疫造成了供给端、需求端和人力资源三方面的缺口。对于供给端，商人们失去了至少一半的稳定货源；对于需求端，大量人口的死亡导致普通商品的需求量骤减；而对于人事，如今的联合果品商会只能招募到未经训练的新手来填补空缺。我们必须尽快解决这三方面的问题，否则商会很可能就此一蹶不振。"
 ufc_situations.2170.a:0 "哦不，我已经开始头痛了。"
 ufc_situations.2170.a.tt:0 "接下来我们将触发一系列事件以削弱黑死病的余波对我们的影响。"

 ufc_situations.2175.title:0 "旅行商人：拓展货源"
 ufc_situations.2175.desc:0 "一直以来，联合果品商会更像是一个商品集散中心，商人们的货源大多是来自于自身的人脉资源，下到有余粮的自给农，上到各国宫廷专门的供货渠道，皆是依赖于个人或小型商团的人脉与经验。然而，瘟疫摧毁了这些传统的贸易模式。人的死亡、土地的荒芜、贸易网络的断绝……压在商人们心坎上的第一道堵便是他们无事可做。\n\n但就算是黑暗之中仍存一丝光明。一位富有远见的马拉加本地商人曾投资了一家染坊，一位来自乡下的商人曾赞助过一个小果园。这些基础生产与加工业虽然税收上缴本地政府，但早期资本的投资保障了第一手商品的经手权。富有远见卓识的伊本·白图泰鼓励更多商人们将财富以新建、赎买或注资的方式组织原材料生产与加工。从今天起，联合果品的商人们不再单纯的货物的搬运工。\n\n我们，将卖出自己的货物，打造自己的品牌。"
 ufc_situations.2175.a:0 "来尝一口自产自销的椰枣！"
 ufc_situations.2175.a.tt:0 "从现在起，建筑[ShowBuildingTypeName('UFC_raw_material_collection_center')]的效果将额外提升50%，且会增加大量贸易力量。这代表了联合果品商会对于本地商品货源的提货优先级升高。"

 ufc_situations.2180.title:0 "旅行商人：唯才是举"
 ufc_situations.2180.desc:0 "在执掌联合果品商会的行政事务之前，伊本·白图泰就以东方唯贤主义的观念在行政专员内部中闯出了一套名堂，甚至做出了一个简单的考核指标方案来约束那些“商人中的贵族”。然而，这一定程度上也是对人力资源的浪费，毕竟“商人中的贵族”也是贵族，而贵族老爷们总有超出常人的修养、见地与资源。\n\n对于目前的联合果品商会而言，相比于筛选，更加迫在眉睫的事情是培养。我们随时都可以招募到走投无路之人，但良莠不齐、鱼目混珠的水平严重影响了商会的行政与商业效率。我们需要尽快设立专业化的人事部门，负责从行政专员、教育专员、商团、劳工、水手等各种专业化团队的招募、培养、调度与考核等事务。"
 ufc_situations.2180.a:0 "这岂不是肥差中的肥差？"
 ufc_situations.2180.a.tt:0 "就这样，联合果品公司的人事部在一片荒芜之中建立起来了。人事部隶属于行政专员，负责招募、培养、调度与考核等事务。"
 ufc_department_law_human_resource_set:0 "人事部"
 ufc_department_law_human_resource_set_desc:0 "人事部致力于推进联合果品公司的人力资源分配。\n人事部是联合果品公司最早设立的中央直属部门之一，起源于伊本·白图泰时代。受到一些东方唯贤主义的影响，以及自己身为律法学家的职业道德，伊本·白图泰为联合果品公司的行政专员、教育专员与商团的选拔、考核都规定了一些基础的标准。人事部要求每个人各司其职，保证一切有才能的人能得到应有的晋升，这代表了联合果品公司对于人员流动的控制力度。"
 ufc_initialize_human_resource_department:0 "探索建设"
 ufc_initialize_human_resource_department_desc:0 "人事部的初期建设离不开伊本·白图泰团队的努力。将无能的贵族剔除出行政专员的位置，并引入有才能的商人是非常困难的事情。人事部的未来一定在是与既得利益者的长久的冲突中艰难前行。"
 ufc_ban_human_resource_department:0 "暂停活动"
 ufc_ban_human_resource_department_desc:0 "或许是因为保守思想的泛滥，又或者是因为董事会的不作为。无论如何，任何关于人事部的草案都被无限期搁置了。"

 ufc_situations.2185.title:0 "旅行商人：炒作需求"
 ufc_situations.2185.desc:0 "有时候，价格与价值实际上并不相当，因为供需关系决定了价格的波动。黑死病对于需求的影响实际上比起供给有过之而无不及。人们开始大量压制自己的消费需求，以应对短期未来那变幻莫测的不确定性。\n\n然而，相比于供给的脚踏实地，在联合果品商会的商人们眼中，需求则是可以被操纵的提线玩偶。被吹的天花乱坠的异域商品可能被卖出十倍于成本价的价格，在贵族与市民之间鼓动起的风尚也足以在短时间内抬高物价。更有甚者，当一件商品被广泛接受，它很有可能被赋予通货的价值。这将给予商人们低买高卖的套利空间，虽然这是对市场信心的一种透支。"
 ufc_situations.2185.a:0 "我们不会透支商会信誉来炒作价格。"
 ufc_situations.2185.b:0 "您猜怎么着？我听说小亚细亚有一种叫郁金香的植物……"

 ufc_situations.2190.title:0 "旅行商人：似曾相识"
 ufc_situations.2190.desc:0 "在阴暗无光的街头小巷里，隐藏在黑暗中的男人细细嗅着空气中的每一个细节。啊——这种感觉，清冽，甘甜，沁人心脾。与他接头的是另一个身着黑袍的高个子，手中紧紧攥着一只浸着汗渍的麻布包。高个子沉沉哼了一声，男人只能颇有些不情愿地从怀里摸出足称足量的金币。这里并非是交易什么成瘾品的现场，或者说所交易之物比成瘾品更甚——这是在热那亚的街头的香料交易。贵族们趋之若鹜的东方香料，近些年随着丝绸之路贸易的中断而愈发珍贵。\n\n伊本·白图泰曾经亲眼见证过，在东方屡见不鲜的瓷器与香料是怎样被欧洲人炒到天价的。然而，他曾经走过的丝绸之路如今难说有多少商队敢于穿过。#R 突厥人，蒙古人，更多的蒙古人，耗子。#!\n\n在遥远的东方，无数唾手可得的财富在等待着联合果品商会去发掘，但至少，我们需要重新踏上伊本·白图泰曾走过的道路。"
 ufc_situations.2190.a:0 "曾见过的终将再见，这一次我们将重返旧途。"
 ufc_situations.2190.a.tt:0 "伊本·白图泰将开始创作游记。每当故事推进到新的篇章，我们的商团就会尝试远行至此进行商业活动。商业活动的成功概率与距离与该地区的政治环境相关。\n希望东方的奇珍异宝能够带领商会走出黑死病的余波。\n\n解锁建筑：贸易使馆是我们的特殊使馆类建筑，可以为我们提供视野和少量资金，直到我们之间爆发战争。"
 UFC_trade_embassy:0 "贸易使馆"
 UFC_trade_embassy_desc:0 "贸易使馆是联合果品公司在国外重要贸易枢纽建立的小型使馆，与当地政府保持良好关系与通信的同时，也负责接待远来的商队并提供商业信息。"

 ufc_situations.2195.title:0 "旅行商人：埃及之旅"
 ufc_situations.2195.desc:0 "“我孤身启程，既无旅伴相慰，亦无商队可随，唯凭心中不可抗拒的冲动与长久怀抱的夙愿——探访这些圣洁的朝觐之地。于是下定决心，舍弃亲友，离别故土，如飞鸟弃巢。父母尚在人世，与之分离令我痛彻心扉，彼此皆为这般离别而悲恸不已。”——《伊本·白图泰游记》\n\n三十多年前，1326年的早春，伊本白图泰穿越北非来到亚历山大港。这里是埃及的马穆鲁克王朝，昔日罗马帝国的粮仓仍然诉说着繁荣与辉煌。马匹、骆驼、粮食、蔗糖，和那质量上乘的莎草纸……马穆鲁克王朝的生命线仍然掌握在尼罗河三角洲这些永远停不下忙碌的农民与工人身上。\n\n商人团们已经准备好出发了。大多数人支持直接沿地中海沿岸于亚历山大港登陆，也有寥寥数人希望重走伊本·白图泰的陆路路线，这可能耗时更长，但摩洛哥与突尼斯沿岸的商业机会也并非毫无价值。"
 ufc_situations.2195.a:0 "走地中海航线，效率优先。"
 ufc_situations.2195.b:0 "走陆路，地中海北非沿岸有不少城市。"
 ufc_situations.2195.c:0 "我去！我不去！"
